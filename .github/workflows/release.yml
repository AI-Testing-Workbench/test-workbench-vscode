name: Release Build

on:
  push:
    branches:
      - main
      - 'release/*'
      - '**'  # 支持所有分支
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: false
        default: 'win32-x64'
        type: choice
        options:
          - all
          - win32-x64
          - win32-arm64
          - darwin
          - linux
      target:
        description: 'Target (user or system, Windows only)'
        required: false
        default: 'user'
        type: choice
        options:
          - user
          - system
      dsh_fork_repository:
        description: 'dsh fork repository (owner/name)'
        required: false
        default: 'AI-Testing-Workbench/testagent-dsh'
        type: string
      dsh_fork_ref:
        description: 'dsh fork branch used to find the latest artifact'
        required: false
        default: 'dev'
        type: string
      dsh_fork_run_id:
        description: 'Specific dsh fork workflow run id (set automatically by the fork trigger; empty finds the latest branch artifact)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  VSCODE_QUALITY: stable
  # test-workbench_change start
  DSH_AGENT_FORK_REPOSITORY: ${{ github.event.inputs.dsh_fork_repository || 'AI-Testing-Workbench/testagent-dsh' }}
  DSH_AGENT_FORK_REF: ${{ github.event.inputs.dsh_fork_ref || 'dev' }}
  DSH_AGENT_FORK_RUN_ID: ${{ github.event.inputs.dsh_fork_run_id || '' }}
  # test-workbench_change end

jobs:
  dsh-runtime: # test-workbench_change - pull or build the dsh fork once per workflow run
    name: Resolve dsh fork runtime
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      ref: ${{ steps.source.outputs.ref }}
    steps:
      - name: Resolve dsh fork artifact
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.DSH_FORK_TOKEN }}
        run: |
          set -euo pipefail
          repo="$DSH_AGENT_FORK_REPOSITORY"
          run_id="$DSH_AGENT_FORK_RUN_ID"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DSH_FORK_TOKEN is not configured; building dsh from source"
            exit 0
          fi
          if [ -z "$run_id" ]; then
            run_id=$(gh api -X GET "repos/$repo/actions/workflows/tscode-runtime.yml/runs" \
              -f branch="$DSH_AGENT_FORK_REF" -f status=success -f per_page=1 \
              --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)
          fi
          if [ -z "$run_id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No successful tscode-runtime run for $repo@$DSH_AGENT_FORK_REF; building dsh from source"
            exit 0
          fi
          artifact_id=$(gh api "repos/$repo/actions/runs/$run_id/artifacts" \
            --jq '.artifacts[] | select(.name == "dsh-fork-tarballs") | .id' 2>/dev/null | head -n 1 || true)
          if [ -z "$artifact_id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Run $run_id has no dsh-fork-tarballs artifact; building dsh from source"
            exit 0
          fi
          rm -rf dsh-fork/dist/tscode
          mkdir -p dsh-fork/dist/tscode
          if ! gh api "repos/$repo/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/dsh-fork-tarballs.zip"; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not download artifact $artifact_id; building dsh from source"
            exit 0
          fi
          if ! unzip -q "$RUNNER_TEMP/dsh-fork-tarballs.zip" -d dsh-fork/dist/tscode; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not extract artifact $artifact_id; building dsh from source"
            exit 0
          fi
          if [ -d dsh-fork/dist/tscode/tscode/dsh ] && [ ! -d dsh-fork/dist/tscode/dsh ]; then
            mv dsh-fork/dist/tscode/tscode/* dsh-fork/dist/tscode/
            rmdir dsh-fork/dist/tscode/tscode
          fi
          if [ ! -d dsh-fork/dist/tscode/dsh ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Artifact $artifact_id has no dsh family; building dsh from source"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'

      - name: Checkout dsh fork (fallback)
        if: steps.resolve.outputs.found != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.DSH_AGENT_FORK_REPOSITORY }}
          ref: ${{ env.DSH_AGENT_FORK_REF }}
          token: ${{ secrets.DSH_FORK_TOKEN || github.token }}
          path: dsh-fork-src
          persist-credentials: false
          clean: true

      - name: Setup pnpm (fallback)
        if: steps.resolve.outputs.found != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: '11.28.5'

      - name: Install dsh fork dependencies (fallback)
        if: steps.resolve.outputs.found != 'true'
        working-directory: dsh-fork-src
        run: pnpm install --frozen-lockfile

      - name: Build dsh fork artifacts (fallback)
        if: steps.resolve.outputs.found != 'true'
        working-directory: dsh-fork-src
        run: pnpm run build:official

      - name: Pack dsh fork runtime (fallback)
        if: steps.resolve.outputs.found != 'true'
        working-directory: dsh-fork-src
        run: |
          set -e
          pnpm run release:pack --family dsh --out dist/tscode/dsh --concurrency 8
          pnpm run release:pack --family vendor --out dist/tscode/vendor --concurrency 8
          pnpm --dir native/system run build:ts
          pnpm --dir native/system/packages/entry pack --pack-destination "$PWD/dist/tscode/landlock"

      - name: Write fallback tarball manifests
        if: steps.resolve.outputs.found != 'true'
        working-directory: dsh-fork-src
        run: |
          VERSION=$(node -p "require('./package.json').version")
          REF=$(git rev-parse HEAD)
          export VERSION REF
          node - <<'NODE'
          const { createHash } = require('node:crypto');
          const { readdirSync, readFileSync, writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          for (const family of ['dsh', 'vendor', 'landlock']) {
            const directory = join('dist/tscode', family);
            const packages = readdirSync(directory).filter(name => name.endsWith('.tgz')).sort().map(name => ({
              tarball: name,
              sha256: createHash('sha256').update(readFileSync(join(directory, name))).digest('hex')
            }));
            writeFileSync(join(directory, 'manifest.json'), JSON.stringify({
              schemaVersion: 1,
              version: process.env.VERSION,
              source: { repository: process.env.DSH_AGENT_FORK_REPOSITORY, ref: process.env.REF },
              packages
            }, null, 2) + '\n');
          }
          NODE
          rm -rf "$GITHUB_WORKSPACE/dsh-fork/dist/tscode"
          mkdir -p "$GITHUB_WORKSPACE/dsh-fork/dist"
          cp -R dist/tscode "$GITHUB_WORKSPACE/dsh-fork/dist/"

      - name: Resolve dsh artifact metadata
        id: source
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync, readFileSync, readdirSync } = require('node:fs');
          const { join } = require('node:path');
          const directory = 'dsh-fork/dist/tscode/dsh';
          const tarballs = readdirSync(directory).filter(name => /^deepseek-ai-dsh-\d/.test(name) && name.endsWith('.tgz'));
          if (tarballs.length !== 1) {
            throw new Error(`expected one @deepseek-ai/dsh tarball, found ${String(tarballs.length)}`);
          }
          const version = JSON.parse(execFileSync('tar', ['-xOzf', join(directory, tarballs[0]), 'package/package.json'], { encoding: 'utf8' })).version;
          let manifest = {};
          try {
            manifest = JSON.parse(readFileSync(join(directory, 'manifest.json'), 'utf8'));
          } catch {
            // Older fork artifacts may not carry a manifest; the env pin is the fallback.
          }
          const ref = manifest.source?.ref || process.env.DSH_AGENT_FORK_REF;
          if (!ref) {
            throw new Error('The dsh artifact does not record a source revision');
          }
          if (!/^[0-9a-f]{40}$/iu.test(ref)) {
            console.log(`::warning::dsh artifact source ref is not a full commit: ${ref}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nref=${ref}\n`);
          NODE

      - name: Verify dsh runtime artifact
        run: |
          test -d dsh-fork/dist/tscode/dsh
          test -d dsh-fork/dist/tscode/vendor
          test -d dsh-fork/dist/tscode/landlock
          test -n "$(find dsh-fork/dist/tscode/dsh -name '*.tgz' -print -quit)"

      - name: Upload dsh runtime tarballs
        uses: actions/upload-artifact@v4
        with:
          name: dsh-fork-tarballs
          path: dsh-fork/dist/tscode
          if-no-files-found: error
          retention-days: 7

  build-win32-x64:
    name: Build Windows x64
    needs: dsh-runtime # test-workbench_change
    runs-on: windows-2022
    if: >-
      (github.event_name == 'workflow_dispatch' && (contains('win32-x64,all', github.event.inputs.platforms) || github.event.inputs.platforms == '')) ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/dependabot/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Prepare node_modules cache key
        shell: pwsh
        run: |
          mkdir .build -ea 0
          node build/azure-pipelines/common/computeNodeModulesCacheKey.ts win32 x64 $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules cache
        uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: .build/node_modules_cache
          key: "node_modules-windows-${{ hashFiles('**/package-lock.json') }}"

      - name: Extract node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: 7z.exe x .build/node_modules_cache/cache.7z -aoa

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          for ($i = 1; $i -le 5; $i++) {
            try {
              npm ci
              break
            }
            catch {
              if ($i -eq 5) {
                Write-Error "npm ci failed after 5 attempts"
                throw
              }
              Write-Host "npm ci failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }
        env:
          npm_config_arch: x64
          npm_config_foreground_scripts: "true"
          VSCODE_ARCH: x64
          npm_config_build_from_source: "false"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Create node_modules archive
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -Force .build/node_modules_cache
          7z.exe a .build/node_modules_cache/cache.7z -mx3 `@.build/node_modules_list.txt

      - name: Create .build folder
        shell: pwsh
        run: mkdir .build -ea 0

      - name: Prepare built-in extensions cache key
        shell: pwsh
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@v5
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare prebuilt extensions
        shell: pwsh
        run: node build/prepare-prebuilt-extensions.ts --platform=win32 --arch=x64

      - name: Prepare Electron types
        shell: pwsh
        run: node build/npm/electronTypes.ts

      - name: Compile core (esbuild)
        shell: pwsh
        run: npm run gulp core-ci

      - name: Restore dsh Agent runtime cache
        uses: actions/cache@v5
        id: dsh-agent-runtime-cache
        with:
          path: .build/dsh-runtime
          key: dsh-agent-runtime-v3-win32-x64-${{ needs.dsh-runtime.outputs.ref }}

      - name: Download dsh fork tarballs
        if: steps.dsh-agent-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: dsh-fork-tarballs
          path: .build/dsh-tarballs

      - name: Install dsh Agent runtime
        if: steps.dsh-agent-runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: node scripts/dsh-agent/install-runtime-from-tarballs.mts --out .build/dsh-runtime --from .build/dsh-tarballs/dsh --from .build/dsh-tarballs/vendor --from .build/dsh-tarballs/landlock
        env:
          npm_config_arch: x64

      - name: Stage dsh Agent runtime
        shell: pwsh
        run: |
          node scripts/dsh-agent/prepare-runtime.mjs --dsh .build/dsh-runtime/node_modules/@deepseek-ai/dsh --node (Get-Command node).Source --dsh-version "${{ needs.dsh-runtime.outputs.version }}" --fork-ref "${{ needs.dsh-runtime.outputs.ref }}"
          node scripts/dsh-agent/prepare-runtime.mjs --check --dsh-version "${{ needs.dsh-runtime.outputs.version }}" --fork-ref "${{ needs.dsh-runtime.outputs.ref }}"

      - name: Smoke dsh Agent runtime
        shell: pwsh
        env:
          TSCODE_DSH_AGENT_DSH_ENTRY: ${{ github.workspace }}/resources/dsh-agent/app/node_modules/@deepseek-ai/dsh/lib/bin.js
          TSCODE_DSH_AGENT_SMOKE_NODE: ${{ github.workspace }}/resources/dsh-agent/node/node.exe
        run: node scripts/dsh-agent/e2e-smoke.mjs

      - name: Build Windows x64 Application
        shell: pwsh
        run: npm run gulp vscode-win32-x64-min-ci

      - name: Verify dsh Agent runtime in package
        shell: pwsh
        run: |
          $runtime = Get-ChildItem -Path ../VSCode-win32-x64 -Recurse -Filter VERSION | Where-Object { $_.FullName -like '*resources\dsh-agent\VERSION' } | Select-Object -First 1
          if (-not $runtime) { throw 'dsh Agent runtime missing from the packaged app' }
          node scripts/dsh-agent/prepare-runtime.mjs --check --out $runtime.Directory.FullName --dsh-version "${{ needs.dsh-runtime.outputs.version }}" --fork-ref "${{ needs.dsh-runtime.outputs.ref }}"

      - name: Prepare Windows x64 Inno Updater
        shell: pwsh
        run: npm run gulp vscode-win32-x64-inno-updater

      - name: Build Windows x64 User Setup
        shell: pwsh
        run: npm run gulp vscode-win32-x64-user-setup

      - name: Upload User Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-win32-x64-user-setup
          path: .build/win32-x64/user-setup/*.exe

  build-win32-arm64:
    name: Build Windows arm64
    needs: dsh-runtime # test-workbench_change
    # test-workbench_change start
    # windows-11-arm now ships Visual Studio 2026, which `build/npm/preinstall.ts`
    # and node-gyp 11 do not recognize. Cross-compile on the x64 image instead,
    # matching the upstream arm64 pipeline.
    runs-on: windows-2022
    # test-workbench_change end
    if: >-
      (github.event_name == 'workflow_dispatch' && (contains('win32-arm64,all', github.event.inputs.platforms) || github.event.inputs.platforms == '')) ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/dependabot/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Prepare node_modules cache key
        shell: pwsh
        run: |
          mkdir .build -ea 0
          node build/azure-pipelines/common/computeNodeModulesCacheKey.ts win32 arm64 $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules cache
        uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: .build/node_modules_cache
          key: "node_modules-windows-arm64-${{ hashFiles('**/package-lock.json') }}"

      - name: Extract node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: 7z.exe x .build/node_modules_cache/cache.7z -aoa

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          for ($i = 1; $i -le 5; $i++) {
            try {
              npm ci
              break
            }
            catch {
              if ($i -eq 5) {
                Write-Error "npm ci failed after 5 attempts"
                throw
              }
              Write-Host "npm ci failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }
        env:
          npm_config_arch: arm64
          npm_config_foreground_scripts: "true"
          VSCODE_ARCH: arm64
          npm_config_build_from_source: "false"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Create node_modules archive
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -Force .build/node_modules_cache
          7z.exe a .build/node_modules_cache/cache.7z -mx3 `@.build/node_modules_list.txt

      - name: Create .build folder
        shell: pwsh
        run: mkdir .build -ea 0

      - name: Prepare built-in extensions cache key
        shell: pwsh
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@v5
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare prebuilt extensions
        shell: pwsh
        run: node build/prepare-prebuilt-extensions.ts --platform=win32 --arch=arm64

      - name: Prepare Electron types
        shell: pwsh
        run: node build/npm/electronTypes.ts

      - name: Compile core (esbuild)
        shell: pwsh
        run: npm run gulp core-ci

      - name: Restore dsh Agent runtime cache
        uses: actions/cache@v5
        id: dsh-agent-runtime-cache
        with:
          path: .build/dsh-runtime
          key: dsh-agent-runtime-v3-win32-arm64-${{ needs.dsh-runtime.outputs.ref }}

      - name: Download dsh fork tarballs
        if: steps.dsh-agent-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: dsh-fork-tarballs
          path: .build/dsh-tarballs

      - name: Install dsh Agent runtime
        if: steps.dsh-agent-runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: node scripts/dsh-agent/install-runtime-from-tarballs.mts --out .build/dsh-runtime --from .build/dsh-tarballs/dsh --from .build/dsh-tarballs/vendor --from .build/dsh-tarballs/landlock
        env:
          # test-workbench_change start
          # The packaged dsh runtime stays x64 on this cross-build so it can be
          # smoke-tested here; Windows on Arm runs it through x64 emulation.
          npm_config_arch: x64
          # test-workbench_change end

      - name: Stage dsh Agent runtime
        shell: pwsh
        run: |
          node scripts/dsh-agent/prepare-runtime.mjs --dsh .build/dsh-runtime/node_modules/@deepseek-ai/dsh --node (Get-Command node).Source --dsh-version "${{ needs.dsh-runtime.outputs.version }}" --fork-ref "${{ needs.dsh-runtime.outputs.ref }}"
          node scripts/dsh-agent/prepare-runtime.mjs --check --dsh-version "${{ needs.dsh-runtime.outputs.version }}" --fork-ref "${{ needs.dsh-runtime.outputs.ref }}"

      - name: Smoke dsh Agent runtime
        shell: pwsh
        env:
          TSCODE_DSH_AGENT_DSH_ENTRY: ${{ github.workspace }}/resources/dsh-agent/app/node_modules/@deepseek-ai/dsh/lib/bin.js
          TSCODE_DSH_AGENT_SMOKE_NODE: ${{ github.workspace }}/resources/dsh-agent/node/node.exe
        run: node scripts/dsh-agent/e2e-smoke.mjs

      - name: Build Windows arm64 Application
        shell: pwsh
        run: npm run gulp vscode-win32-arm64-min-ci

      - name: Verify dsh Agent runtime in package
        shell: pwsh
        run: |
          $runtime = Get-ChildItem -Path ../VSCode-win32-arm64 -Recurse -Filter VERSION | Where-Object { $_.FullName -like '*resources\dsh-agent\VERSION' } | Select-Object -First 1
          if (-not $runtime) { throw 'dsh Agent runtime missing from the packaged app' }
          node scripts/dsh-agent/prepare-runtime.mjs --check --out $runtime.Directory.FullName --dsh-version "${{ needs.dsh-runtime.outputs.version }}" --fork-ref "${{ needs.dsh-runtime.outputs.ref }}"

      - name: Prepare Windows arm64 Inno Updater
        shell: pwsh
        run: npm run gulp vscode-win32-arm64-inno-updater

      - name: Build Windows arm64 User Setup
        shell: pwsh
        run: npm run gulp vscode-win32-arm64-user-setup

      - name: Upload User Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-win32-arm64-user-setup
          path: .build/win32-arm64/user-setup/*.exe

  build-darwin:
    name: Build macOS
    needs: dsh-runtime # test-workbench_change
    runs-on: macos-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && (contains('darwin,all', github.event.inputs.platforms) || github.event.inputs.platforms == '')) ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/dependabot/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Prepare node_modules cache key
        run: |
          mkdir -p .build
          node build/azure-pipelines/common/computeNodeModulesCacheKey.ts darwin x64 $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules cache
        uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: .build/node_modules_cache
          key: "node_modules-macos-${{ hashFiles('**/package-lock.json') }}"

      - name: Extract node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit == 'true'
        run: tar -xzf .build/node_modules_cache/cache.tgz

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_build_from_source: "false"

      - name: Create node_modules archive
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -p .build/node_modules_cache
          tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt

      - name: Create .build folder
        run: mkdir -p .build

      - name: Prepare built-in extensions cache key
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@v5
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare prebuilt extensions
        run: |
          node build/prepare-prebuilt-extensions.ts --platform=darwin --arch=arm64

      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      - name: Compile core (esbuild)
        run: npm run gulp core-ci

      - name: Restore dsh Agent runtime cache
        uses: actions/cache@v5
        id: dsh-agent-runtime-cache
        with:
          path: .build/dsh-runtime
          key: dsh-agent-runtime-v3-darwin-arm64-${{ needs.dsh-runtime.outputs.ref }}

      - name: Download dsh fork tarballs
        if: steps.dsh-agent-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: dsh-fork-tarballs
          path: .build/dsh-tarballs

      - name: Install dsh Agent runtime
        if: steps.dsh-agent-runtime-cache.outputs.cache-hit != 'true'
        run: node scripts/dsh-agent/install-runtime-from-tarballs.mts --out .build/dsh-runtime --from .build/dsh-tarballs/dsh --from .build/dsh-tarballs/vendor --from .build/dsh-tarballs/landlock
        env:
          npm_config_arch: arm64

      - name: Stage dsh Agent runtime
        run: |
          node scripts/dsh-agent/prepare-runtime.mjs --dsh .build/dsh-runtime/node_modules/@deepseek-ai/dsh --node "$(which node)" --dsh-version "${{ needs.dsh-runtime.outputs.version }}" --fork-ref "${{ needs.dsh-runtime.outputs.ref }}"
          node scripts/dsh-agent/prepare-runtime.mjs --check --dsh-version "${{ needs.dsh-runtime.outputs.version }}" --fork-ref "${{ needs.dsh-runtime.outputs.ref }}"

      - name: Smoke dsh Agent runtime
        env:
          TSCODE_DSH_AGENT_DSH_ENTRY: ${{ github.workspace }}/resources/dsh-agent/app/node_modules/@deepseek-ai/dsh/lib/bin.js
          TSCODE_DSH_AGENT_SMOKE_NODE: ${{ github.workspace }}/resources/dsh-agent/node/bin/node
        run: node scripts/dsh-agent/e2e-smoke.mjs

      - name: Build macOS arm64
        run: npm run gulp vscode-darwin-arm64-min-ci

      - name: Verify dsh Agent runtime in package
        run: |
          RUNTIME=$(find ../VSCode-darwin-arm64 -path '*/Contents/Resources/app/resources/dsh-agent/VERSION' -print -quit)
          test -n "$RUNTIME"
          node scripts/dsh-agent/prepare-runtime.mjs --check --out "$(dirname "$RUNTIME")" --dsh-version "${{ needs.dsh-runtime.outputs.version }}" --fork-ref "${{ needs.dsh-runtime.outputs.ref }}"

      - name: Create macOS arm64 archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent ../VSCode-darwin-arm64 .build/VSCode-darwin-arm64.zip

      - name: Upload arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-darwin-arm64
          path: .build/VSCode-darwin-arm64.zip

  build-linux:
    name: Build Linux
    needs: dsh-runtime # test-workbench_change
    runs-on: ubuntu-22.04
    if: >-
      (github.event_name == 'workflow_dispatch' && (contains('linux,all', github.event.inputs.platforms) || github.event.inputs.platforms == '')) ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/dependabot/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev libsecret-1-dev libxshmfence-dev python-is-python3

      - name: Prepare node_modules cache key
        run: |
          mkdir -p .build
          node build/azure-pipelines/common/computeNodeModulesCacheKey.ts linux x64 $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules cache
        uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: .build/node_modules_cache
          # key includes glibc228 suffix so old caches (built without the glibc-2.28 sysroot) are invalidated
          key: "node_modules-linux-glibc228-${{ hashFiles('**/package-lock.json') }}"

      - name: Extract node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit == 'true'
        run: tar -xzf .build/node_modules_cache/cache.tgz

      - name: Install build dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: build
        run: |
          set -e
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore sysroot toolchain cache
        uses: actions/cache/restore@v5
        id: sysroot-toolchain-cache
        with:
          path: |
            .build/sysroots
            .build/CR_Clang
            .build/libcxx-objects
            .build/libcxx_headers
            .build/libcxxabi_headers
          key: linux-sysroot-glibc228

      - name: Download vscode sysroots
        run: |
          set -e
          mkdir -p .build/sysroots
          export VSCODE_SYSROOT_DIR="${{ github.workspace }}/.build/sysroots/glibc-2.28-gcc-8.5.0"
          node -e 'import { getVSCodeSysroot } from "./build/linux/debian/install-sysroot.ts"; (async () => { await getVSCodeSysroot("amd64"); })()'
        env:
          VSCODE_SYSROOT_PREFIX: "-glibc-2.28-gcc-8.5.0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          source ./build/azure-pipelines/linux/setup-env.sh
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          npm_config_arch: x64
          VSCODE_ARCH: x64
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_build_from_source: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save sysroot toolchain cache
        if: steps.sysroot-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .build/sysroots
            .build/CR_Clang
            .build/libcxx-objects
            .build/libcxx_headers
            .build/libcxxabi_headers
          key: linux-sysroot-glibc228

      - name: Create node_modules archive
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -p .build/node_modules_cache
          tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt

      - name: Create .build folder
        run: mkdir -p .build

      - name: Prepare built-in extensions cache key
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@v5
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare prebuilt extensions
        run: |
          node build/prepare-prebuilt-extensions.ts --platform=linux --arch=x64

      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      - name: Compile core (esbuild)
        run: npm run gulp core-ci

      - name: Build Linux Servers
        run: |
          npm run gulp vscode-reh-linux-x64-min-ci

      - name: Create Linux Server archive
        run: |
          mv ../vscode-reh-linux-x64 ../vscode-server-linux-x64
          tar --owner=0 --group=0 -czf .build/vscode-server-linux-x64.tar.gz -C .. vscode-server-linux-x64

      - name: Verify GLIBC requirements (server)
        run: |
          set -e
          SERVER_DIR="${{ github.workspace }}/../vscode-server-linux-x64"
          if [ ! -d "$SERVER_DIR" ]; then
            echo "ERROR: server dir not found at $SERVER_DIR" >&2
            exit 1
          fi
          echo "Scanning native modules under $SERVER_DIR"
          # The bundled dsh Agent runtime has its own glibc baseline; skip it.
          find "$SERVER_DIR" -name "*.node" -not -path "*prebuilds*" -not -path "*/resources/dsh-agent/*" | head -10
          if [ -z "$(find "$SERVER_DIR" -name "*.node" -not -path "*prebuilds*" -not -path "*/resources/dsh-agent/*" | head -1)" ]; then
            echo "ERROR: no .node files found under $SERVER_DIR" >&2
            exit 1
          fi
          EXPECTED_GLIBC_VERSION="2.28" \
          EXPECTED_GLIBCXX_VERSION="3.4.25" \
          VSCODE_SYSROOT_DIR="${{ github.workspace }}/.build/sysroots/glibc-2.28-gcc-8.5.0" \
          SEARCH_PATH="$SERVER_DIR" \
          VSCODE_ARCH=x64 \
          ./build/azure-pipelines/linux/verify-glibc-requirements.sh

      - name: Upload Linux x64 Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-server-linux-x64
          path: .build/vscode-server-linux-x64.tar.gz

      - name: Restore dsh Agent runtime cache
        uses: actions/cache@v5
        id: dsh-agent-runtime-cache
        with:
          path: .build/dsh-runtime
          key: dsh-agent-runtime-v3-linux-x64-${{ needs.dsh-runtime.outputs.ref }}

      - name: Download dsh fork tarballs
        if: steps.dsh-agent-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: dsh-fork-tarballs
          path: .build/dsh-tarballs

      - name: Install dsh Agent runtime
        if: steps.dsh-agent-runtime-cache.outputs.cache-hit != 'true'
        run: node scripts/dsh-agent/install-runtime-from-tarballs.mts --out .build/dsh-runtime --from .build/dsh-tarballs/dsh --from .build/dsh-tarballs/vendor --from .build/dsh-tarballs/landlock
        env:
          npm_config_arch: x64

      - name: Stage dsh Agent runtime
        run: |
          node scripts/dsh-agent/prepare-runtime.mjs --dsh .build/dsh-runtime/node_modules/@deepseek-ai/dsh --node "$(which node)" --dsh-version "${{ needs.dsh-runtime.outputs.version }}" --fork-ref "${{ needs.dsh-runtime.outputs.ref }}"
          node scripts/dsh-agent/prepare-runtime.mjs --check --dsh-version "${{ needs.dsh-runtime.outputs.version }}" --fork-ref "${{ needs.dsh-runtime.outputs.ref }}"

      - name: Smoke dsh Agent runtime
        env:
          TSCODE_DSH_AGENT_DSH_ENTRY: ${{ github.workspace }}/resources/dsh-agent/app/node_modules/@deepseek-ai/dsh/lib/bin.js
          TSCODE_DSH_AGENT_SMOKE_NODE: ${{ github.workspace }}/resources/dsh-agent/node/bin/node
        run: node scripts/dsh-agent/e2e-smoke.mjs

      - name: Build Linux x64
        run: |
          npm run gulp "vscode-linux-x64-min-ci"

      - name: Verify dsh Agent runtime in package
        run: |
          RUNTIME=$(find ../VSCode-linux-x64 -path '*/resources/app/resources/dsh-agent/VERSION' -print -quit)
          test -n "$RUNTIME"
          node scripts/dsh-agent/prepare-runtime.mjs --check --out "$(dirname "$RUNTIME")" --dsh-version "${{ needs.dsh-runtime.outputs.version }}" --fork-ref "${{ needs.dsh-runtime.outputs.ref }}"

      - name: Create Linux x64 archive
        run: |
          tar -czf .build/VSCode-linux-x64.tar.gz -C .. VSCode-linux-x64

      - name: Verify GLIBC requirements (client)
        run: |
          set -e
          CLIENT_DIR="${{ github.workspace }}/../VSCode-linux-x64"
          if [ ! -d "$CLIENT_DIR" ]; then
            echo "ERROR: client build dir not found at $CLIENT_DIR" >&2
            exit 1
          fi
          echo "Scanning native modules under $CLIENT_DIR"
          # The bundled dsh Agent runtime has its own glibc baseline; skip it.
          find "$CLIENT_DIR" -name "*.node" -not -path "*prebuilds*" -not -path "*/resources/dsh-agent/*" | head -10
          if [ -z "$(find "$CLIENT_DIR" -name "*.node" -not -path "*prebuilds*" -not -path "*/resources/dsh-agent/*" | head -1)" ]; then
            echo "ERROR: no .node files found under $CLIENT_DIR" >&2
            exit 1
          fi
          EXPECTED_GLIBC_VERSION="2.28" \
          EXPECTED_GLIBCXX_VERSION="3.4.25" \
          VSCODE_SYSROOT_DIR="${{ github.workspace }}/.build/sysroots/glibc-2.28-gcc-8.5.0" \
          SEARCH_PATH="$CLIENT_DIR" \
          VSCODE_ARCH=x64 \
          ./build/azure-pipelines/linux/verify-glibc-requirements.sh

      - name: Upload x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-linux-x64
          path: .build/VSCode-linux-x64.tar.gz

  trigger-docker-build:
    name: 触发 TSCode Docker 镜像构建
    runs-on: ubuntu-latest
    needs: build-linux
    # 仅在 main 分支构建成功（含 v* tag 发布）后调度 docker 镜像流水线
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - name: 调度 tscode-server-docker 构建镜像
        if: env.DOCKER_REPO_PAT != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DOCKER_REPO_PAT: ${{ secrets.DOCKER_REPO_PAT }}
        with:
          github-token: ${{ env.DOCKER_REPO_PAT }}
          script: |
            const runId = context.runId;
            await github.rest.actions.createWorkflowDispatch({
              owner: 'AI-Testing-Workbench',
              repo: 'tscode-server-docker',
              workflow_id: 'build-docker-image.yml',
              ref: 'main',
              inputs: {
                server_run_id: `${runId}`
              }
            });
            console.log(`已调度 tscode-server-docker 镜像构建 (server run ${runId})`);

      - name: 提示缺少 DOCKER_REPO_PAT
        if: env.DOCKER_REPO_PAT == ''
        run: |
          echo "::warning::未配置 DOCKER_REPO_PAT，跳过调度 tscode-server-docker 镜像构建。如需自动构建镜像，请在 Settings -> Secrets and variables -> Actions 中新增对 AI-Testing-Workbench/tscode-server-docker 拥有 Workflow 写入权限的 PAT。"
        env:
          DOCKER_REPO_PAT: ${{ secrets.DOCKER_REPO_PAT }}
