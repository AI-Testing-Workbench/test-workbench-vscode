name: Build for Debian 10

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'feature/uos-workflow'
      version:
        description: 'Package version'
        required: false
        default: '1.116.0'
      custom_extension_repo:
        description: 'Custom extension repository (optional)'
        required: false
        default: 'https://github.com/AI-Testing-Workbench/test-workbench-vsix.git'
      custom_extension_branch:
        description: 'Custom extension branch'
        required: false
        default: 'feature/uos-workflow'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libgtk-3-dev libxkbfile-dev \
            libkrb5-dev libgbm-dev rpm libx11-dev libxss-dev libxtst-dev \
            libnss3-dev libasound2-dev libglib2.0-dev libcairo2-dev \
            libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev \
            python3 git wget curl tree xz-utils \
            dpkg-dev fakeroot lintian rsync jq

      - name: 🔧 Fix TypeScript scripts
        run: |
          echo 'console.log("Preinstall OK");' > build/npm/preinstall.js
          sed -i 's/"preinstall": "node build\/npm\/preinstall.ts"/"preinstall": "node build\/npm\/preinstall.js"/' package.json
          echo 'console.log("Postinstall OK");' > build/npm/postinstall.js
          sed -i 's/"postinstall": "node build\/npm\/postinstall.ts"/"postinstall": "node build\/npm\/postinstall.js"/' package.json

      - name: 📦 Install dependencies
        run: |
          echo "=========================================="
          echo "📦 Installing dependencies"
          echo "=========================================="
          npm install --legacy-peer-deps

      - name: 📦 Install build tools
        run: |
          npm install -g tsx
          npm install --legacy-peer-deps \
            ternary-stream vscode-gulp-watch esbuild jsonc-parser \
            gulp-merge-json gulp-tsb gulp-sourcemaps gulp-filter \
            gulp-rename gulp-sort 2>/dev/null || true

      - name: 🔧 Fix extensions.ts
        run: |
          cat > build/lib/extensions.ts << 'EOF'
          import { Stream } from "stream";
          const empty: any[] = [];
          function emptyStream(): Stream {
            const s = new Stream.Readable();
            s._read = () => s.push(null);
            return s;
          }
          export function isWebExtension(): boolean { return false; }
          export function getExtensionStream(): Stream { return emptyStream(); }
          export function getExtensionDownloadStream(): Stream { return emptyStream(); }
          export function packageMarketplaceExtensionsStream(): Stream { return emptyStream(); }
          export function packageNativeLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageNonNativeLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageExtensionsStream(): Stream { return emptyStream(); }
          export function packageCopilotExtensionStream(): Stream { return emptyStream(); }
          export function packageCopilotChatExtensionStream(): Stream { return emptyStream(); }
          export function packageCopilotAgentsExtensionStream(): Stream { return emptyStream(); }
          export function fromMarketplace(): any[] { return empty; }
          export async function fetchUrls(urls: string[], options: any): Promise<void> {
            console.log("fetchUrls: disabled");
            return Promise.resolve();
          }
          export function buildExtensionMedia(): void {}
          export function compileExtensionMedia(): void {}
          export function buildExtensionMediaTask(done: any): void { done(); }
          export const builtInExtensions = empty;
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions = empty;
          export const shouldDownloadWebBuiltInExtensions = false;
          EOF
          echo 'export const builtInExtensions: any[] = [];
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions: any[] = [];
          export const shouldDownloadWebBuiltInExtensions = false;' > build/lib/builtInExtensions.ts
          echo 'import { Stream } from "stream";
          export async function fetchUrls(urls: string[], options: any): Promise<void> {
            console.log("fetchUrls: disabled");
            return Promise.resolve();
          }' > build/lib/fetch.ts

      - name: 🔧 Fix gulpfile spawn calls
        run: |
          python3 << 'PY_END'
          import re
          with open('build/gulpfile.vscode.ts', 'r') as f:
              content = f.read()
          content = re.sub(r"spawn\('node'", "spawn('tsx'", content)
          content = re.sub(r'spawn\("node"', 'spawn("tsx"', content)
          content = re.sub(r"spawn\(process\.execPath", "spawn('tsx'", content)
          with open('build/gulpfile.vscode.ts', 'w') as f:
              f.write(content)
          print("spawn calls fixed")
          PY_END

      - name: 🔧 Replace copilot.ts
        run: |
          cat > build/lib/copilot.ts << 'EOF'
          export async function prepareBuiltInCopilotExtensionShims(extRoot: string): Promise<void> {
              console.log('Copilot extension shims preparation skipped for UOS build');
              return;
          }
          export function copyCopilotNativeDeps(productRoot: string): void {
              console.log('Copilot native deps copy skipped for UOS build');
          }
          export function getCopilotExcludeFilter(): any {
              return function() { return false; };
          }
          EOF

      - name: 🔧 Disable Crashpad
        run: |
          echo "Disabling Crashpad"
          python3 << 'PY_JSON_END'
          import json
          import os
          if os.path.exists('product.json'):
              with open('product.json', 'r') as f:
                  data = json.load(f)
              data['enableCrashReport'] = False
              if 'crashReporter' not in data:
                  data['crashReporter'] = {}
              data['crashReporter']['disabled'] = True
              with open('product.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print("product.json modified")
          PY_JSON_END

          mkdir -p src/vs/platform/crash/common
          cat > src/vs/platform/crash/common/crashService.ts << 'CRASH_EOF'
          /*---------------------------------------------------------------------------------------------
           *  Copyright (c) Microsoft Corporation. All rights reserved.
           *  Licensed under the MIT License. See License.txt in the project root for license information.
           *--------------------------------------------------------------------------------------------*/
          import { createDecorator } from '../../../base/common/instantiation.js';
          export const ICrashService = createDecorator<ICrashService>('crashService');
          export interface ICrashService { _serviceBrand: undefined; }
          export class CrashService implements ICrashService {
              declare readonly _serviceBrand: undefined;
              constructor() { console.log('Crash service disabled for UOS build'); }
          }
          CRASH_EOF
          echo "crashService.ts created"

      - name: ⚙️ Set env
        run: |
          echo "VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_ELECTRON_SKIP_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_SKIP_PRELAUNCH=1" >> $GITHUB_ENV
          echo "VSCODE_SKIP_BUNDLED_EXTENSIONS=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTER=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTING=1" >> $GITHUB_ENV

      - name: 🔨 Build VSCode
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          export VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1
          export VSCODE_ELECTRON_SKIP_DOWNLOAD=1
          export VSCODE_SKIP_PRELAUNCH=1
          export VSCODE_SKIP_BUNDLED_EXTENSIONS=1
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          echo "Start: $(date)"
          npx tsx node_modules/gulp/bin/gulp.js vscode-linux-x64 --no-color
          echo "Done: $(date)"

      - name: 🔍 Verify build contents
        run: |
          echo "=========================================="
          echo "🔍 Verify build contents"
          echo "=========================================="

          BUILD_DIR=""
          for dir in "./VSCode-linux-x64" "./vscode/VSCode-linux-x64" "../VSCode-linux-x64"; do
            if [ -d "$dir" ]; then
              BUILD_DIR="$dir"
              echo "Found build directory: $BUILD_DIR"
              break
            fi
          done

          if [ -z "$BUILD_DIR" ]; then
            echo "Build directory not found!"
            exit 1
          fi

          TARGET_DIR="./tscode"
          if [ "$BUILD_DIR" != "$TARGET_DIR" ]; then
            echo "Renaming $BUILD_DIR to $TARGET_DIR"
            rm -rf "$TARGET_DIR"
            mv "$BUILD_DIR" "$TARGET_DIR"
          fi
          BUILD_DIR="$TARGET_DIR"
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

          echo "Initial build size:"
          du -sh "$BUILD_DIR"

      - name: 📦 Copy node_modules to resources/app
        run: |
          echo "=========================================="
          echo "📦 Copy node_modules to resources/app"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          if [ ! -d "./node_modules" ]; then
            echo "❌ node_modules not found in root!"
            echo "Installing node_modules..."
            npm install --legacy-peer-deps
          fi

          echo "📌 Copying node_modules to $BUILD_DIR/resources/app/"
          rm -rf "$BUILD_DIR/resources/app/node_modules"
          cp -r ./node_modules "$BUILD_DIR/resources/app/"

          echo "✅ node_modules copied"

      - name: 🔥 Replace native modules and copy official extensions
        run: |
          # 禁用错误退出，我们自己处理错误
          set +e

          echo "=========================================="
          echo "🔥 Replacing native modules & copying official extensions"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          VERSION="${{ github.event.inputs.version || '1.116.0' }}"

          # ============================================================
          # 1. 下载官方 VSCode（只下载一次）
          # ============================================================
          echo ""
          echo "📌 Step 1: Downloading official VSCode $VERSION for Linux x64..."

          # 清理旧的下载目录
          rm -rf /tmp/official-vscode
          rm -f /tmp/official.tar.gz

          wget -q --show-progress "https://update.code.visualstudio.com/$VERSION/linux-x64/stable" -O /tmp/official.tar.gz

          if [ $? -ne 0 ] || [ ! -s /tmp/official.tar.gz ]; then
            echo "⚠️ Failed to download version $VERSION, trying latest..."
            wget -q --show-progress https://update.code.visualstudio.com/latest/linux-x64/stable -O /tmp/official.tar.gz
            if [ $? -ne 0 ] || [ ! -s /tmp/official.tar.gz ]; then
              echo "❌ Failed to download official VSCode!"
              exit 1
            fi
          fi

          echo "📌 Extracting official VSCode..."
          mkdir -p /tmp/official-vscode
          tar -xzf /tmp/official.tar.gz -C /tmp/official-vscode/

          # 查找官方 VSCode 目录
          OFFICIAL_DIR=""
          for dir in "/tmp/official-vscode/VSCode-linux-x64" "/tmp/official-vscode/vscode/VSCode-linux-x64"; do
            if [ -d "$dir" ]; then
              OFFICIAL_DIR="$dir"
              break
            fi
          done

          # 如果没找到，尝试搜索
          if [ -z "$OFFICIAL_DIR" ]; then
            OFFICIAL_DIR=$(find /tmp/official-vscode -type d -name "VSCode-linux-x64" 2>/dev/null | head -1)
          fi

          if [ -z "$OFFICIAL_DIR" ] || [ ! -d "$OFFICIAL_DIR" ]; then
            echo "❌ Could not find official VSCode directory!"
            echo "   Contents of /tmp/official-vscode:"
            ls -la /tmp/official-vscode/
            exit 1
          fi

          echo "✅ Official VSCode found at: $OFFICIAL_DIR"

          # ============================================================
          # 2. 替换 node_modules
          # ============================================================
          echo ""
          echo "📌 Step 2: Replacing node_modules with official version..."

          if [ -d "$OFFICIAL_DIR/resources/app/node_modules" ]; then
            echo "   ✅ Found official node_modules"

            # 备份旧的 node_modules
            if [ -d "$BUILD_DIR/resources/app/node_modules" ]; then
              echo "   📦 Backing up old node_modules..."
              mv "$BUILD_DIR/resources/app/node_modules" \
                 "$BUILD_DIR/resources/app/node_modules.bak"
            fi

            echo "   📦 Copying official node_modules..."
            cp -r "$OFFICIAL_DIR/resources/app/node_modules" \
                  "$BUILD_DIR/resources/app/"

            # 检查复制是否成功
            if [ -d "$BUILD_DIR/resources/app/node_modules" ]; then
              echo "   ✅ node_modules replaced successfully"
              echo "   📊 Size: $(du -sh $BUILD_DIR/resources/app/node_modules | cut -f1)"
            else
              echo "   ❌ Failed to copy node_modules!"
              exit 1
            fi
          else
            echo "   ⚠️ No node_modules found in official build, skipping..."
          fi

          # ============================================================
          # 3. 复制官方扩展到系统目录
          # ============================================================
          echo ""
          echo "📌 Step 3: Copying official extensions to system directory..."

          # 确保目标目录存在
          mkdir -p "$BUILD_DIR/resources/app/extensions"

          EXT_COPIED=0
          EXT_SKIPPED=0
          EXT_FAILED=0
          EXT_TOTAL=0

          # 获取官方扩展列表
          OFFICIAL_EXT_DIR="$OFFICIAL_DIR/resources/app/extensions"

          if [ ! -d "$OFFICIAL_EXT_DIR" ]; then
            echo "❌ Official extensions directory not found: $OFFICIAL_EXT_DIR"
            exit 1
          fi

          echo "   📂 Official extensions directory: $OFFICIAL_EXT_DIR"
          echo "   📂 Target directory: $BUILD_DIR/resources/app/extensions"
          echo ""

          # 使用 find 获取所有扩展
          echo "   📊 Scanning official extensions..."

          # 创建临时文件存储扩展列表
          EXT_LIST_FILE="/tmp/ext_list.txt"
          find "$OFFICIAL_EXT_DIR" -maxdepth 1 -type d ! -path "$OFFICIAL_EXT_DIR" -exec basename {} \; > "$EXT_LIST_FILE" 2>/dev/null

          EXT_TOTAL=$(wc -l < "$EXT_LIST_FILE" 2>/dev/null | tr -d ' ')
          echo "   📊 Found $EXT_TOTAL extensions in official build"
          echo ""

          # 使用 while 循环逐行读取
          while IFS= read -r ext_name; do
            # 跳过空行
            [ -z "$ext_name" ] && continue

            ext_path="$OFFICIAL_EXT_DIR/$ext_name"

            # 检查源目录是否存在
            if [ ! -d "$ext_path" ]; then
              echo "      ⚠️ Source directory not found: $ext_name"
              EXT_FAILED=$((EXT_FAILED + 1))
              continue
            fi

            # 检查是否已经存在
            if [ -d "$BUILD_DIR/resources/app/extensions/$ext_name" ]; then
              echo "      ⏭️ Skipping (already exists): $ext_name"
              EXT_SKIPPED=$((EXT_SKIPPED + 1))
              continue
            fi

            echo "      ✅ Copying: $ext_name"

            # 使用 rsync 复制
            if rsync -a --no-owner --no-group "$ext_path/" "$BUILD_DIR/resources/app/extensions/$ext_name/" 2>/dev/null; then
              echo "         ✅ Success"
              EXT_COPIED=$((EXT_COPIED + 1))
            else
              echo "         ❌ Failed to copy: $ext_name"
              EXT_FAILED=$((EXT_FAILED + 1))
            fi
          done < "$EXT_LIST_FILE"

          # 清理临时文件
          rm -f "$EXT_LIST_FILE"

          echo ""
          echo "   📊 Extension copy summary:"
          echo "      📦 Total official extensions: $EXT_TOTAL"
          echo "      ✅ Copied: $EXT_COPIED extensions"
          echo "      ⏭️ Skipped: $EXT_SKIPPED extensions (already exist)"
          echo "      ❌ Failed: $EXT_FAILED extensions"

          # 计算实际总数
          ACTUAL_TOTAL=$(find "$BUILD_DIR/resources/app/extensions" -maxdepth 1 -type d ! -path "$BUILD_DIR/resources/app/extensions" 2>/dev/null | wc -l | tr -d ' ')
          echo "      📂 Total in system: $ACTUAL_TOTAL extensions"

          # 如果所有扩展都失败了，报错
          if [ $EXT_TOTAL -gt 0 ] && [ $EXT_COPIED -eq 0 ] && [ $EXT_SKIPPED -eq 0 ]; then
            echo ""
            echo "❌ No extensions were copied! This is a critical error."
            exit 1
          fi

          echo ""
          echo "   🔍 Verifying critical extensions..."
          CRITICAL_EXTS="typescript-language-features git git-base github-authentication json-language-features markdown-language-features html-language-features css-language-features"
          MISSING_EXTS=""
          for ext in $CRITICAL_EXTS; do
            if [ -d "$BUILD_DIR/resources/app/extensions/$ext" ]; then
              echo "      ✅ $ext"
            else
              echo "      ❌ $ext (NOT FOUND!)"
              MISSING_EXTS="$MISSING_EXTS $ext"
            fi
          done

          # 如果有缺失的关键扩展，报错
          if [ -n "$MISSING_EXTS" ]; then
            echo ""
            echo "❌ Critical extensions are missing:$MISSING_EXTS"
            echo "   This may cause issues when running TSCode."
            exit 1
          fi

          # ============================================================
          # 4. 清理临时文件
          # ============================================================
          echo ""
          echo "📌 Step 4: Cleaning up temporary files..."
          rm -f /tmp/official.tar.gz
          rm -rf /tmp/official-vscode
          echo "   ✅ Cleanup completed"

          echo ""
          echo "✅ Native modules and extensions replacement completed!"

          # 恢复错误退出
          set -e

      - name: 📦 Download and prepare custom extensions
        run: |
          echo "=========================================="
          echo "📦 Downloading and preparing custom extensions"
          echo "=========================================="

          # 直接从 github.event.inputs 读取
          CUSTOM_REPO="${{ github.event.inputs.custom_extension_repo }}"
          CUSTOM_BRANCH="${{ github.event.inputs.custom_extension_branch || 'feature/uos-workflow' }}"

          echo "CUSTOM_REPO: [$CUSTOM_REPO]"
          echo "CUSTOM_BRANCH: [$CUSTOM_BRANCH]"

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          # 创建自定义扩展目录（确保在正确的位置）
          CUSTOM_EXT_DIR="$BUILD_DIR/resources/app/custom-extensions"
          mkdir -p "$CUSTOM_EXT_DIR"
          echo "✅ Custom extensions directory: $CUSTOM_EXT_DIR"

          # 从工作流输入下载自定义扩展
          if [ -n "$CUSTOM_REPO" ] && [ "$CUSTOM_REPO" != "null" ] && [ "$CUSTOM_REPO" != "" ]; then
            echo "📌 Cloning custom extension from: $CUSTOM_REPO"
            echo "📌 Branch: $CUSTOM_BRANCH"

            rm -rf /tmp/custom-ext-temp
            git clone --depth 1 \
              --branch "$CUSTOM_BRANCH" \
              "$CUSTOM_REPO" \
              /tmp/custom-ext-temp 2>&1 | tee /tmp/git-clone.log || {
                echo "⚠️ Failed to clone with branch: $CUSTOM_BRANCH"
                echo "   Trying default branch..."
                git clone --depth 1 "$CUSTOM_REPO" /tmp/custom-ext-temp 2>&1 | tee /tmp/git-clone.log || true
              }

            if [ -d "/tmp/custom-ext-temp" ] && [ "$(ls -A /tmp/custom-ext-temp 2>/dev/null)" ]; then
              echo "✅ Cloned successfully"
              echo "📋 Contents of cloned repository:"
              ls -la /tmp/custom-ext-temp/

              # 查找所有 VSIX 文件
              VSIX_FILES=$(find /tmp/custom-ext-temp -name "*.vsix" -type f 2>/dev/null)
              VSIX_COUNT=$(echo "$VSIX_FILES" | grep -v "^$" | wc -l | tr -d ' ')
              echo "📦 Found $VSIX_COUNT VSIX file(s)"

              if [ "$VSIX_COUNT" -gt 0 ]; then
                # 提取每个 VSIX 文件
                for vsix_file in $VSIX_FILES; do
                  vsix_name=$(basename "$vsix_file" .vsix)

                  # 只处理 Linux 版本
                  if [[ "$vsix_name" == *"darwin"* ]] || [[ "$vsix_name" == *"win32"* ]]; then
                    echo "  ⏭️ Skipping non-Linux: $vsix_name"
                    continue
                  fi

                  echo "  📌 Extracting: $vsix_name"

                  mkdir -p /tmp/extract-vsix-$vsix_name
                  unzip -q "$vsix_file" -d /tmp/extract-vsix-$vsix_name 2>/dev/null

                  # 确定扩展内容位置
                  EXT_CONTENT_DIR=""
                  if [ -d "/tmp/extract-vsix-$vsix_name/extension" ]; then
                    EXT_CONTENT_DIR="/tmp/extract-vsix-$vsix_name/extension"
                  elif [ -f "/tmp/extract-vsix-$vsix_name/package.json" ]; then
                    EXT_CONTENT_DIR="/tmp/extract-vsix-$vsix_name"
                  elif [ -d "/tmp/extract-vsix-$vsix_name/contents" ]; then
                    EXT_CONTENT_DIR="/tmp/extract-vsix-$vsix_name/contents"
                  fi

                  if [ -n "$EXT_CONTENT_DIR" ] && [ -f "$EXT_CONTENT_DIR/package.json" ]; then
                    # 创建目标目录
                    TARGET_EXT_DIR="$CUSTOM_EXT_DIR/$vsix_name"
                    mkdir -p "$TARGET_EXT_DIR"

                    # 复制扩展内容
                    cp -r "$EXT_CONTENT_DIR/"* "$TARGET_EXT_DIR/" 2>/dev/null || true

                    # 验证
                    if [ -f "$TARGET_EXT_DIR/package.json" ]; then
                      echo "    ✅ Extracted: $vsix_name"
                      # 显示扩展信息
                      EXT_VERSION=$(grep -o '"version": *"[^"]*"' "$TARGET_EXT_DIR/package.json" 2>/dev/null | head -1 | cut -d'"' -f4)
                      echo "       Version: $EXT_VERSION"
                    else
                      echo "    ❌ Failed to extract: $vsix_name"
                    fi
                  else
                    echo "    ⚠️ No package.json found in VSIX"
                  fi

                  rm -rf /tmp/extract-vsix-$vsix_name
                done
              else
                echo "ℹ️ No VSIX files found, looking for extension directories..."

                # 查找扩展目录（包含 package.json 的目录）
                for ext_dir in $(find /tmp/custom-ext-temp -name "package.json" -type f 2>/dev/null); do
                  ext_parent=$(dirname "$ext_dir")
                  ext_name=$(basename "$ext_parent")

                  # 检查是否是有效的扩展目录
                  if [ -f "$ext_parent/package.json" ]; then
                    echo "  📦 Found extension directory: $ext_name"
                    TARGET_EXT_DIR="$CUSTOM_EXT_DIR/$ext_name"
                    mkdir -p "$TARGET_EXT_DIR"
                    cp -r "$ext_parent/"* "$TARGET_EXT_DIR/" 2>/dev/null || true

                    if [ -f "$TARGET_EXT_DIR/package.json" ]; then
                      echo "    ✅ Copied: $ext_name"
                    fi
                  fi
                done
              fi

              rm -rf /tmp/custom-ext-temp
            else
              echo "⚠️ Clone failed or empty"
              echo "   Git clone log:"
              cat /tmp/git-clone.log 2>/dev/null || echo "   (no log)"
            fi
          else
            echo "ℹ️ No custom extension repo provided"
            echo "   CUSTOM_REPO value: [$CUSTOM_REPO]"
          fi

          # 显示最终结果
          echo ""
          echo "📋 Final custom extensions in build:"
          if [ -d "$CUSTOM_EXT_DIR" ]; then
            echo "📂 Directory: $CUSTOM_EXT_DIR"

            # 统计扩展数量
            EXT_COUNT=0
            for ext_dir in "$CUSTOM_EXT_DIR"/*/; do
              if [ -d "$ext_dir" ] && [ -f "$ext_dir/package.json" ]; then
                ext_name=$(basename "$ext_dir")
                ext_version=$(grep -o '"version": *"[^"]*"' "$ext_dir/package.json" 2>/dev/null | head -1 | cut -d'"' -f4 || echo "unknown")
                echo "  ✅ $ext_name (v$ext_version)"
                EXT_COUNT=$((EXT_COUNT + 1))
              fi
            done

            echo ""
            echo "📊 Total valid extensions: $EXT_COUNT"

            if [ "$EXT_COUNT" -eq 0 ]; then
              echo "⚠️ WARNING: No extensions found in custom-extensions!"
              echo "   This will result in empty custom-extensions directory"
            fi
          else
            echo "❌ custom-extensions directory not found!"
          fi

      - name: 🧹 Deep cleanup (preserve runtime files)
        run: |
          echo "=========================================="
          echo "🧹 Deep cleanup - preserving runtime files"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          echo "📊 Before cleanup:"
          du -sh "$BUILD_DIR"
          du -sh "$BUILD_DIR/resources/app" 2>/dev/null || true

          # 保护核心扩展不被删除
          echo ""
          echo "📌 Preserving core extensions..."
          # 重要：添加 github-authentication 和 git-base 到保护列表
          CORE_EXTS="typescript-language-features git git-base github-authentication json-language-features markdown-language-features html-language-features css-language-features npm debug-auto-launch merge-conflict search-result @builtin"

          mkdir -p /tmp/core-extensions-backup
          for ext in $CORE_EXTS; do
            if [ -d "$BUILD_DIR/resources/app/extensions/$ext" ]; then
              echo "   Backing up: $ext"
              mv "$BUILD_DIR/resources/app/extensions/$ext" /tmp/core-extensions-backup/ 2>/dev/null || true
            fi
          done

          cd "$BUILD_DIR/resources/app"

          # ============================================================
          # 1. 删除非 Linux TestAgent 扩展
          # ============================================================
          echo ""
          echo "📌 Removing non-Linux TestAgent extensions..."
          rm -rf extensions/testagent-nodejs-tscode-darwin-arm64 2>/dev/null || true
          rm -rf extensions/testagent-nodejs-tscode-win32-x64 2>/dev/null || true
          rm -rf ../custom-extensions/testagent-nodejs-tscode-darwin-arm64 2>/dev/null || true
          rm -rf ../custom-extensions/testagent-nodejs-tscode-win32-x64 2>/dev/null || true

          # ============================================================
          # 2. 删除不需要的扩展（copilot）
          # ============================================================
          echo ""
          echo "📌 Removing unwanted extensions (copilot)..."
          rm -rf extensions/copilot 2>/dev/null || true

          # ============================================================
          # 3. 删除扩展中的源代码（保留编译输出）
          # ============================================================
          echo ""
          echo "📌 Removing source code from extensions..."
          for ext in extensions/*/; do
            if [ -d "$ext" ]; then
              # 删除 src 目录
              rm -rf "$ext/src" 2>/dev/null || true
              # 删除 .ts 文件（保留 .d.ts）
              find "$ext" -name "*.ts" -type f ! -name "*.d.ts" -delete 2>/dev/null || true
              # 删除 .map 文件
              find "$ext" -name "*.map" -type f -delete 2>/dev/null || true
              # 删除 test 目录
              rm -rf "$ext/test" 2>/dev/null || true
              rm -rf "$ext/tests" 2>/dev/null || true
              rm -rf "$ext/__tests__" 2>/dev/null || true
              # 删除 example 目录
              rm -rf "$ext/example" 2>/dev/null || true
              rm -rf "$ext/examples" 2>/dev/null || true
            fi
          done

          # ============================================================
          # 4. 清理 node_modules
          # ============================================================
          echo ""
          echo "📌 Cleaning node_modules..."

          # 删除 devDependencies
          npx json -I -f package.json -e 'this.devDependencies={}' 2>/dev/null || true

          # 删除源代码
          find node_modules -name "*.ts" -type f ! -name "*.d.ts" -delete 2>/dev/null || true
          # 删除文档
          find node_modules -name "*.md" -type f -delete 2>/dev/null || true
          find node_modules -name "CHANGELOG*" -type f -delete 2>/dev/null || true
          find node_modules -name "LICENSE*" -type f -delete 2>/dev/null || true
          # 删除测试目录
          find node_modules -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "__tests__" -exec rm -rf {} + 2>/dev/null || true
          # 删除示例目录
          find node_modules -type d -name "example" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "examples" -exec rm -rf {} + 2>/dev/null || true
          # 删除源映射
          find node_modules -name "*.map" -type f -delete 2>/dev/null || true
          # 删除 .git
          find node_modules -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true

          # ============================================================
          # 5. 删除开发工具包
          # ============================================================
          echo ""
          echo "📌 Removing dev tools..."
          rm -rf node_modules/@types 2>/dev/null || true
          rm -rf node_modules/webpack 2>/dev/null || true
          rm -rf node_modules/rollup 2>/dev/null || true
          rm -rf node_modules/vite 2>/dev/null || true
          rm -rf node_modules/terser 2>/dev/null || true
          rm -rf node_modules/eslint 2>/dev/null || true
          rm -rf node_modules/prettier 2>/dev/null || true
          # 保留 typescript，某些扩展需要
          # rm -rf node_modules/typescript 2>/dev/null || true
          rm -rf node_modules/@typescript-eslint 2>/dev/null || true
          rm -rf node_modules/jest 2>/dev/null || true
          rm -rf node_modules/mocha 2>/dev/null || true
          rm -rf node_modules/chai 2>/dev/null || true
          rm -rf node_modules/sinon 2>/dev/null || true

          # ============================================================
          # 6. 删除构建临时文件
          # ============================================================
          echo ""
          echo "📌 Removing build temp..."
          rm -rf .cache 2>/dev/null || true
          rm -rf build 2>/dev/null || true
          rm -rf *.tsbuildinfo 2>/dev/null || true

          cd -

          # 恢复核心扩展
          echo ""
          echo "📌 Restoring core extensions..."
          if [ -d "/tmp/core-extensions-backup" ]; then
            for ext in $CORE_EXTS; do
              if [ -d "/tmp/core-extensions-backup/$ext" ]; then
                echo "   Restoring: $ext"
                mv "/tmp/core-extensions-backup/$ext" "$BUILD_DIR/resources/app/extensions/" 2>/dev/null || true
              fi
            done
            rm -rf /tmp/core-extensions-backup
          fi

          echo ""
          echo "📊 After cleanup:"
          du -sh "$BUILD_DIR"
          du -sh "$BUILD_DIR/resources/app" 2>/dev/null || true

          echo "✅ Deep cleanup completed"

      - name: 📄 Create launcher and fix all issues
        run: |
          echo "=========================================="
          echo "📄 Creating launcher and fixing all issues"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          cd "$BUILD_DIR"

          # 复制配置文件
          [ -f "resources/app/package.json" ] && cp "resources/app/package.json" . && echo "✅ package.json"
          [ -f "resources/app/product.json" ] && cp "resources/app/product.json" . && echo "✅ product.json"

          # 找到可执行文件
          REAL_EXEC=""
          for name in code code-oss; do
            if [ -f "./$name" ]; then
              REAL_EXEC="$name"
              break
            fi
          done

          if [ -z "$REAL_EXEC" ]; then
            REAL_EXEC=$(find . -maxdepth 1 -type f -executable ! -name "*.so" ! -name "*.sh" ! -name "chrome-*" 2>/dev/null | head -1 | sed 's|^\./||')
          fi

          if [ -z "$REAL_EXEC" ]; then
            echo "❌ No executable found!"
            exit 1
          fi

          echo "✅ Found executable: $REAL_EXEC"

          if [ "$REAL_EXEC" != "tscode" ]; then
            mv "$REAL_EXEC" "tscode"
            echo "✅ Renamed to tscode"
          else
            echo "✅ Already named tscode"
          fi

          # ============================================================
          # 创建启动包装脚本 (run.sh) - 修复版：确保 DBUS_SESSION_BUS_ADDRESS= 为空
          # ============================================================
          echo ""
          echo "📌 Creating startup wrapper script (run.sh)..."

          cat > run.sh << 'RUNEOF'
          #!/bin/bash
          # TSCode 启动脚本 - 修复版（支持 GitHub 登录，无密钥环弹窗）

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          # 环境变量
          export ELECTRON_ENABLE_GPU=0
          export LIBGL_ALWAYS_SOFTWARE=1
          export NODE_OPTIONS="--max-old-space-size=4096"
          export ELECTRON_DISABLE_SANDBOX=1
          export GDK_BACKEND=x11
          export QT_QPA_PLATFORM=xcb
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          export CRASHPAD_DISABLE=1

          # 禁用密钥环 - 关键：DBUS_SESSION_BUS_ADDRESS 必须设置为空（不是 unset）
          export GNOME_KEYRING_CONTROL=
          export DBUS_SESSION_BUS_ADDRESS=
          export PYTHON_KEYRING_BACKEND=keyring.backends.null.Keyring
          export SECRETS_BACKEND=basic
          export DISABLE_VAULT=1
          export VSCODE_PASSWORD_STORE=basic
          export ELECTRON_PASSWORD_STORE=basic

          # 用户数据目录 - 使用 XDG 标准位置
          export VSCODE_APPDATA="$HOME/.local/share/tscode"
          export VSCODE_EXTENSIONS_DIR="$HOME/.tscode/extensions"

          # 创建目录并设置权限
          mkdir -p "$VSCODE_APPDATA" 2>/dev/null || true
          mkdir -p "$VSCODE_EXTENSIONS_DIR" 2>/dev/null || true
          chmod 755 "$VSCODE_APPDATA" 2>/dev/null || true
          chmod 755 "$VSCODE_EXTENSIONS_DIR" 2>/dev/null || true

          # 创建 argv.json 配置文件（如果不存在）
          ARGV_FILE="$VSCODE_APPDATA/argv.json"
          if [ ! -f "$ARGV_FILE" ]; then
              echo "📄 Creating argv.json..."
              cat > "$ARGV_FILE" << 'JSONEOF'
          {
              "locale": "zh-cn",
              "enable-crash-reporter": false
          }
          JSONEOF
              chmod 644 "$ARGV_FILE" 2>/dev/null || true
          fi

          # 系统扩展目录（内置扩展）
          export VSCODE_SYSTEM_EXTENSIONS="$SCRIPT_DIR/resources/app/extensions"

          # 启动
          exec "$SCRIPT_DIR/tscode" \
              --no-sandbox \
              --disable-gpu-sandbox \
              --disable-gpu \
              --disable-crash-reporter \
              --password-store="basic" \
              --extensions-dir="$VSCODE_EXTENSIONS_DIR" \
              --user-data-dir="$VSCODE_APPDATA" \
              --builtin-extensions-dir="$VSCODE_SYSTEM_EXTENSIONS" \
              "$@"
          RUNEOF

          chmod +x run.sh
          echo "   ✅ run.sh created"

          # ============================================================
          # 创建 start-tscode.sh（兼容脚本）
          # ============================================================
          cat > start-tscode.sh << 'STARTEOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$SCRIPT_DIR/run.sh" "$@"
          STARTEOF

          chmod +x start-tscode.sh
          echo "   ✅ start-tscode.sh created"

          # ============================================================
          # 设置二进制文件权限
          # ============================================================
          chmod +x tscode
          chmod +x chrome-sandbox 2>/dev/null || true

          echo ""
          echo "✅ Launcher and scripts created"

      - name: 📄 Create desktop entry
        run: |
          echo "=========================================="
          echo "📄 Creating desktop entry"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          mkdir -p "$BUILD_DIR/usr/share/applications"
          mkdir -p "$BUILD_DIR/usr/share/icons/hicolor/256x256/apps"

          if [ -f "$BUILD_DIR/resources/app/resources/linux/code.png" ]; then
            cp "$BUILD_DIR/resources/app/resources/linux/code.png" \
               "$BUILD_DIR/usr/share/icons/hicolor/256x256/apps/tscode.png"
            echo "   ✅ Icon copied"
          fi

          cat > "$BUILD_DIR/usr/share/applications/tscode.desktop" << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=TSCode
          GenericName=Code Editor
          Comment=Code Editing. Redefined.
          Exec=/opt/tscode/run.sh %F
          Icon=tscode
          Terminal=false
          Categories=Development;IDE;
          MimeType=text/plain;inode/directory;
          StartupNotify=true
          StartupWMClass=Code
          X-GNOME-SingleWindow=false
          EOF

          echo "   ✅ Desktop file created"

      - name: 📄 Create validation script
        run: |
          echo "=========================================="
          echo "📄 Creating validation script"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          cat > "$BUILD_DIR/validate.sh" << 'VALIDATE_EOF'
          #!/bin/bash
          echo "=========================================="
          echo "TSCode Validation Script"
          echo "=========================================="

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          PASSED=0
          FAILED=0

          echo ""
          echo "1️⃣ Checking main executable..."
          if [ -x "$SCRIPT_DIR/tscode" ]; then
            echo "   ✅ tscode executable"
            ((PASSED++))
          else
            echo "   ❌ tscode not executable"
            ((FAILED++))
          fi

          echo ""
          echo "2️⃣ Checking run wrapper..."
          if [ -x "$SCRIPT_DIR/run.sh" ]; then
            echo "   ✅ run.sh exists and executable"
            ((PASSED++))
          else
            echo "   ❌ run.sh missing"
            ((FAILED++))
          fi

          echo ""
          echo "3️⃣ Checking start-tscode.sh..."
          if [ -x "$SCRIPT_DIR/start-tscode.sh" ]; then
            echo "   ✅ start-tscode.sh exists"
            ((PASSED++))
          else
            echo "   ❌ start-tscode.sh missing"
            ((FAILED++))
          fi

          echo ""
          echo "4️⃣ Checking desktop file..."
          if [ -f "$SCRIPT_DIR/usr/share/applications/tscode.desktop" ]; then
            echo "   ✅ Desktop file exists"
            ((PASSED++))
          else
            echo "   ❌ Desktop file missing"
            ((FAILED++))
          fi

          echo ""
          echo "5️⃣ Checking icon..."
          if [ -f "$SCRIPT_DIR/usr/share/icons/hicolor/256x256/apps/tscode.png" ]; then
            echo "   ✅ Icon exists"
            ((PASSED++))
          else
            echo "   ⚠️ Icon missing"
          fi

          echo ""
          echo "6️⃣ Checking Chrome sandbox..."
          if [ -f "$SCRIPT_DIR/chrome-sandbox" ]; then
            PERMS=$(stat -c %a "$SCRIPT_DIR/chrome-sandbox" 2>/dev/null || echo "000")
            if [ "$PERMS" = "4755" ]; then
              echo "   ✅ chrome-sandbox SUID: 4755"
              ((PASSED++))
            else
              echo "   ⚠️ chrome-sandbox permissions: $PERMS"
            fi
          else
            echo "   ⚠️ chrome-sandbox not found"
          fi

          echo ""
          echo "7️⃣ Checking core extensions..."
          for ext in typescript-language-features git git-base github-authentication json-language-features; do
            if [ -d "$SCRIPT_DIR/resources/app/extensions/$ext" ]; then
              echo "   ✅ $ext (system)"
              ((PASSED++))
            else
              echo "   ❌ $ext (missing)"
              ((FAILED++))
            fi
          done

          echo ""
          echo "8️⃣ Checking custom extensions..."
          if [ -d "$SCRIPT_DIR/resources/app/custom-extensions" ]; then
            CUSTOM_COUNT=$(find "$SCRIPT_DIR/resources/app/custom-extensions" -maxdepth 1 -type d ! -path "$SCRIPT_DIR/resources/app/custom-extensions" 2>/dev/null | wc -l | tr -d ' ')
            if [ "$CUSTOM_COUNT" -gt 0 ]; then
              echo "   ✅ Custom extensions directory exists ($CUSTOM_COUNT extensions)"
              ((PASSED++))
            else
              echo "   ⚠️ Custom extensions directory is empty"
            fi
          else
            echo "   ⚠️ No custom extensions directory"
          fi

          echo ""
          echo "=========================================="
          echo "Validation Results:"
          echo "   ✅ Passed: $PASSED"
          echo "   ❌ Failed: $FAILED"
          echo "=========================================="

          if [ $FAILED -eq 0 ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed."
            exit 1
          fi
          VALIDATE_EOF

          chmod +x "$BUILD_DIR/validate.sh"
          echo "✅ Validation script created"

      - name: 🔍 Run validation
        run: |
          echo "=========================================="
          echo "🔍 Running validation"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          if ! "$BUILD_DIR/validate.sh"; then
            echo "❌ Validation failed!"
            exit 1
          fi

          echo "✅ Validation passed!"

      - name: 📦 Build DEB package
        run: |
          echo "=========================================="
          echo "📦 Building DEB package for Debian 10"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          VERSION="${{ github.event.inputs.version || '1.116.0' }}"
          DEB_VERSION="${VERSION}-1"
          DEB_ARCH="amd64"
          DEB_ROOT="$(pwd)/deb_root"

          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/opt/tscode"
          mkdir -p "$DEB_ROOT/usr/bin"
          mkdir -p "$DEB_ROOT/usr/share/applications"
          mkdir -p "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps"

          echo "📌 Copying application to /opt/tscode..."
          cp -r "$BUILD_DIR"/* "$DEB_ROOT/opt/tscode/"

          # ============================================================
          # 验证 custom-extensions 目录
          # ============================================================
          echo ""
          echo "🔍 Verifying custom-extensions before packaging..."

          SOURCE_CUSTOM_EXT="$BUILD_DIR/resources/app/custom-extensions"
          TARGET_CUSTOM_EXT="$DEB_ROOT/opt/tscode/resources/app/custom-extensions"

          if [ -d "$SOURCE_CUSTOM_EXT" ]; then
            echo "  ✅ Source custom-extensions exists: $SOURCE_CUSTOM_EXT"
            echo "  📋 Source contents:"
            ls -la "$SOURCE_CUSTOM_EXT/"

            # 确保目标目录存在
            mkdir -p "$TARGET_CUSTOM_EXT"

            # 复制所有内容（包括隐藏文件）
            cp -r "$SOURCE_CUSTOM_EXT"/. "$TARGET_CUSTOM_EXT/" 2>/dev/null || true

            echo "  📋 Target contents after copy:"
            ls -la "$TARGET_CUSTOM_EXT/"

            # 统计扩展数量
            SOURCE_COUNT=$(find "$SOURCE_CUSTOM_EXT" -maxdepth 1 -type d ! -path "$SOURCE_CUSTOM_EXT" 2>/dev/null | wc -l | tr -d ' ')
            TARGET_COUNT=$(find "$TARGET_CUSTOM_EXT" -maxdepth 1 -type d ! -path "$TARGET_CUSTOM_EXT" 2>/dev/null | wc -l | tr -d ' ')

            echo "  📊 Source extensions: $SOURCE_COUNT"
            echo "  📊 Target extensions: $TARGET_COUNT"

            if [ "$TARGET_COUNT" -eq 0 ] && [ "$SOURCE_COUNT" -gt 0 ]; then
              echo "  ❌ ERROR: Custom extensions not copied properly!"
              echo "  🔄 Attempting manual copy..."

              # 手动复制每个扩展
              for ext_dir in "$SOURCE_CUSTOM_EXT"/*/; do
                if [ -d "$ext_dir" ]; then
                  ext_name=$(basename "$ext_dir")
                  echo "    📦 Copying: $ext_name"
                  cp -r "$ext_dir" "$TARGET_CUSTOM_EXT/"
                fi
              done

              # 重新验证
              TARGET_COUNT=$(find "$TARGET_CUSTOM_EXT" -maxdepth 1 -type d ! -path "$TARGET_CUSTOM_EXT" 2>/dev/null | wc -l | tr -d ' ')
              echo "  📊 Target extensions after manual copy: $TARGET_COUNT"
            fi
          else
            echo "  ⚠️ Source custom-extensions does not exist: $SOURCE_CUSTOM_EXT"
            echo "  📂 Creating empty directory..."
            mkdir -p "$TARGET_CUSTOM_EXT"
          fi

          # ============================================================
          # 修复所有权限
          # ============================================================
          echo ""
          echo "📌 Fixing all permissions..."

          # 1. chrome-sandbox SUID
          if [ -f "$DEB_ROOT/opt/tscode/chrome-sandbox" ]; then
            sudo chown root:root "$DEB_ROOT/opt/tscode/chrome-sandbox"
            sudo chmod 4755 "$DEB_ROOT/opt/tscode/chrome-sandbox"
            echo "   ✅ chrome-sandbox SUID set"
          fi

          # 2. 主程序可执行权限
          chmod +x "$DEB_ROOT/opt/tscode/tscode" 2>/dev/null || true
          chmod +x "$DEB_ROOT/opt/tscode/run.sh" 2>/dev/null || true
          chmod +x "$DEB_ROOT/opt/tscode/start-tscode.sh" 2>/dev/null || true
          chmod +x "$DEB_ROOT/opt/tscode/validate.sh" 2>/dev/null || true

          # ============================================================
          # 3. 修复所有扩展中的二进制文件
          # ============================================================
          echo ""
          echo "📌 Setting executable permissions for ALL extension binaries..."

          EXTENSIONS_DIR="$DEB_ROOT/opt/tscode/resources/app/extensions"

          if [ -d "$EXTENSIONS_DIR" ]; then
              echo "   🔧 Fixing bin/ scripts/ tools/ utils/ directories..."
              find "$EXTENSIONS_DIR" -type d \( -name "bin" -o -name "scripts" -o -name "tools" -o -name "utils" \) 2>/dev/null | while read -r dir; do
                  find "$dir" -type f -exec chmod +x {} \; 2>/dev/null || true
              done

              echo "   🔧 Fixing common executable files..."
              find "$EXTENSIONS_DIR" -type f \( \
                  -name "*.sh" -o -name "*.bash" -o -name "*.zsh" -o \
                  -name "*.py" -o -name "*.pl" -o -name "*.rb" -o \
                  -name "*.js" -o -name "*.mjs" -o -name "*.cjs" -o \
                  -name "testflow" -o -name "testagent" -o \
                  -name "rg" -o -name "grep" -o \
                  -name "server" -o -name "main" -o -name "run" -o \
                  -name "start" -o -name "bootstrap" -o -name "cli" -o \
                  -name "node" -o -name "npm" -o -name "npx" -o \
                  -name "*.node" \
              \) -exec chmod +x {} \; 2>/dev/null || true

              echo "   🔧 Fixing files without extensions (ELF/scripts)..."
              find "$EXTENSIONS_DIR" -type f ! -name "*.*" 2>/dev/null | while read -r file; do
                  if file "$file" 2>/dev/null | grep -qE "(ELF|script|executable)"; then
                      chmod +x "$file" 2>/dev/null || true
                  fi
              done

              echo "   ✅ All extension binaries permissions fixed"
          fi

          # 4. 修复自定义扩展
          echo "   🔧 Fixing custom extensions..."
          if [ -d "$DEB_ROOT/opt/tscode/resources/app/custom-extensions" ]; then
              find "$DEB_ROOT/opt/tscode/resources/app/custom-extensions" -type f -exec chmod +x {} \; 2>/dev/null || true
              echo "   ✅ Custom extensions binaries permissions fixed"
          fi

          # 5. ripgrep 权限
          find "$DEB_ROOT/opt/tscode" -name "rg" -type f -exec chmod 755 {} \; 2>/dev/null || true
          find "$DEB_ROOT/opt/tscode" -type f -executable -exec chmod 755 {} \; 2>/dev/null || true

          echo "   ✅ All permissions fixed"

          # ============================================================
          # 创建 /usr/bin/tscode 包装脚本
          # ============================================================
          echo ""
          echo "📌 Creating /usr/bin/tscode wrapper script..."

          cat > "$DEB_ROOT/usr/bin/tscode" << 'WRAPEOF'
          #!/bin/bash
          # TSCode 启动包装器
          exec /opt/tscode/run.sh "$@"
          WRAPEOF

          chmod +x "$DEB_ROOT/usr/bin/tscode"
          echo "   ✅ /usr/bin/tscode wrapper created"

          # ============================================================
          # 创建桌面文件
          # ============================================================
          echo ""
          echo "📌 Creating desktop file..."

          printf '%s\n' \
            '[Desktop Entry]' \
            'Version=1.0' \
            'Type=Application' \
            'Name=TSCode' \
            'GenericName=Code Editor' \
            'Comment=Code Editing. Redefined.' \
            'Exec=/opt/tscode/run.sh %F' \
            'Icon=tscode' \
            'Terminal=false' \
            'Categories=Development;IDE' \
            'MimeType=text/plain;inode/directory' \
            'StartupNotify=true' \
            'StartupWMClass=Code' > "$DEB_ROOT/usr/share/applications/tscode.desktop"

          echo "   ✅ Desktop file created"

          # ============================================================
          # 复制图标
          # ============================================================
          if [ -f "$BUILD_DIR/resources/app/resources/linux/code.png" ]; then
            cp "$BUILD_DIR/resources/app/resources/linux/code.png" \
               "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps/tscode.png"
            echo "   ✅ Icon copied"
          fi

          # ============================================================
          # 创建 DEBIAN/control
          # ============================================================
          cat > "$DEB_ROOT/DEBIAN/control" << 'CONTROLEOF'
          Package: tscode
          Version: REPLACE_VERSION
          Architecture: REPLACE_ARCH
          Maintainer: TSCode Team <tscode@example.com>
          Description: TSCode - Code Editing. Redefined.
           TSCode is a code editor redefined and optimized for building
           and debugging modern web and cloud applications.
          Depends: libgtk-3-0, libx11-6, libxss1, libxtst6, libnss3, libasound2, libgbm1, libglib2.0-0, libcairo2, libpango-1.0-0, libatk1.0-0, libgdk-pixbuf2.0-0
          Recommends: git, python3
          Homepage: https://github.com/tscode
          Section: devel
          Priority: optional
          CONTROLEOF

          sed -i "s/REPLACE_VERSION/$DEB_VERSION/g" "$DEB_ROOT/DEBIAN/control"
          sed -i "s/REPLACE_ARCH/$DEB_ARCH/g" "$DEB_ROOT/DEBIAN/control"

          # ============================================================
          # 创建 postinst 脚本 - 修复扩展复制逻辑
          # ============================================================
          cat > "$DEB_ROOT/DEBIAN/postinst" << 'POSTINSTEOF'
          #!/bin/bash
          set -e

          echo "=========================================="
          echo "Setting up TSCode for Debian 10..."
          echo "=========================================="

          # 调试：显示 custom-extensions 目录内容
          echo ""
          echo "🔍 Debug: Checking custom-extensions..."
          if [ -d "/opt/tscode/resources/app/custom-extensions" ]; then
            echo "  ✅ custom-extensions directory exists"
            echo "  📋 Contents:"
            ls -la /opt/tscode/resources/app/custom-extensions/

            # 统计扩展
            EXT_COUNT=$(find /opt/tscode/resources/app/custom-extensions -maxdepth 1 -type d ! -path "/opt/tscode/resources/app/custom-extensions" 2>/dev/null | wc -l | tr -d ' ')
            echo "  📊 Total extensions: $EXT_COUNT"
          else
            echo "  ❌ custom-extensions directory NOT FOUND"
          fi

          # 调试：检查系统扩展
          echo ""
          echo "🔍 Debug: Checking system extensions..."
          if [ -d "/opt/tscode/resources/app/extensions" ]; then
            EXT_COUNT=$(find /opt/tscode/resources/app/extensions -maxdepth 1 -type d ! -path "/opt/tscode/resources/app/extensions" 2>/dev/null | wc -l | tr -d ' ')
            echo "  ✅ System extensions: $EXT_COUNT"
          else
            echo "  ❌ System extensions NOT FOUND"
          fi

          # 1. 修复 chrome-sandbox SUID
          if [ -f "/opt/tscode/chrome-sandbox" ]; then
              chown root:root /opt/tscode/chrome-sandbox
              chmod 4755 /opt/tscode/chrome-sandbox
              echo "  ✅ chrome-sandbox permissions fixed"
          fi

          # 2. 设置可执行权限
          chmod +x /opt/tscode/run.sh 2>/dev/null || true
          chmod +x /opt/tscode/tscode 2>/dev/null || true
          chmod +x /opt/tscode/start-tscode.sh 2>/dev/null || true
          chmod +x /usr/bin/tscode 2>/dev/null || true

          # 3. 修复 ripgrep 权限
          if [ -f "/opt/tscode/resources/app/node_modules/@vscode/ripgrep/bin/rg" ]; then
              chmod 755 /opt/tscode/resources/app/node_modules/@vscode/ripgrep/bin/rg
              echo "  ✅ ripgrep permissions fixed"
          fi

          # ============================================================
          # 4. 修复所有扩展中的二进制文件
          # ============================================================
          echo ""
          echo "📌 Setting executable permissions for ALL extension binaries..."

          EXTENSIONS_DIR="/opt/tscode/resources/app/extensions"

          if [ -d "$EXTENSIONS_DIR" ]; then
              echo "   🔧 Fixing bin/ scripts/ tools/ utils/ directories..."
              find "$EXTENSIONS_DIR" -type d \( -name "bin" -o -name "scripts" -o -name "tools" -o -name "utils" \) 2>/dev/null | while read -r dir; do
                  find "$dir" -type f -exec chmod +x {} \; 2>/dev/null || true
              done

              echo "   🔧 Fixing common executable files..."
              find "$EXTENSIONS_DIR" -type f \( \
                  -name "*.sh" -o -name "*.bash" -o -name "*.zsh" -o \
                  -name "*.py" -o -name "*.pl" -o -name "*.rb" -o \
                  -name "*.js" -o -name "*.mjs" -o -name "*.cjs" -o \
                  -name "testflow" -o -name "testagent" -o \
                  -name "rg" -o -name "grep" -o \
                  -name "server" -o -name "main" -o -name "run" -o \
                  -name "start" -o -name "bootstrap" -o -name "cli" -o \
                  -name "node" -o -name "npm" -o -name "npx" -o \
                  -name "*.node" \
              \) -exec chmod +x {} \; 2>/dev/null || true

              echo "   🔧 Fixing files without extensions (ELF/scripts)..."
              find "$EXTENSIONS_DIR" -type f ! -name "*.*" 2>/dev/null | while read -r file; do
                  if file "$file" 2>/dev/null | grep -qE "(ELF|script|executable)"; then
                      chmod +x "$file" 2>/dev/null || true
                  fi
              done

              echo "  ✅ All extension binaries permissions fixed"
          fi

          # 5. 修复自定义扩展
          echo "   🔧 Fixing custom extensions..."
          if [ -d "/opt/tscode/resources/app/custom-extensions" ]; then
              find /opt/tscode/resources/app/custom-extensions -type f -exec chmod +x {} \; 2>/dev/null || true
              echo "  ✅ Custom extensions binaries permissions fixed"
          fi

          # ============================================================
          # 6. 配置用户目录和复制扩展
          # ============================================================
          echo ""
          echo "📁 Configuring user directories and copying extensions..."

          for USER_HOME in /home/* /root; do
              if [ -d "$USER_HOME" ] && [ "$USER_HOME" != "/home/*" ]; then
                  USER_NAME=$(basename "$USER_HOME")
                  echo ""
                  echo "  === Configuring user: $USER_NAME ==="

                  # 创建目录结构
                  mkdir -p "$USER_HOME/.tscode"
                  mkdir -p "$USER_HOME/.tscode/extensions"
                  mkdir -p "$USER_HOME/.local/share/tscode"

                  # 设置基本权限
                  chmod 755 "$USER_HOME/.tscode"
                  chmod 755 "$USER_HOME/.tscode/extensions"
                  chmod 755 "$USER_HOME/.local/share/tscode"

                  # 创建 argv.json
                  ARGV_FILE="$USER_HOME/.local/share/tscode/argv.json"
                  echo "    📄 Creating argv.json..."
                  cat > "$ARGV_FILE" << 'JSONEOF'
          {
              "locale": "zh-cn",
              "enable-crash-reporter": false
          }
          JSONEOF
                  chmod 644 "$ARGV_FILE" 2>/dev/null || true

                  # ============================================================
                  # 关键：复制扩展到用户目录
                  # ============================================================
                  echo "    📦 Copying extensions to user directory..."

                  # 6a. 复制自定义扩展（从 custom-extensions）
                  CUSTOM_EXT_DIR="/opt/tscode/resources/app/custom-extensions"
                  if [ -d "$CUSTOM_EXT_DIR" ]; then
                      rm -f "$CUSTOM_EXT_DIR/.empty" 2>/dev/null || true
                      CUSTOM_EXT_COUNT=$(find "$CUSTOM_EXT_DIR" -maxdepth 1 -type d ! -path "$CUSTOM_EXT_DIR" 2>/dev/null | wc -l | tr -d ' ')

                      if [ "$CUSTOM_EXT_COUNT" -gt 0 ]; then
                          echo "      📦 Found $CUSTOM_EXT_COUNT custom extensions"
                          for ext in "$CUSTOM_EXT_DIR"/*/; do
                              if [ -d "$ext" ] && [ -f "$ext/package.json" ]; then
                                  ext_name=$(basename "$ext")
                                  echo "        ✅ Copying custom extension: $ext_name"
                                  rm -rf "$USER_HOME/.tscode/extensions/$ext_name" 2>/dev/null || true
                                  cp -r "$ext" "$USER_HOME/.tscode/extensions/" 2>/dev/null || true

                                  # 修复权限
                                  if [ -d "$USER_HOME/.tscode/extensions/$ext_name" ]; then
                                      find "$USER_HOME/.tscode/extensions/$ext_name" -type f -exec chmod +x {} \; 2>/dev/null || true
                                      find "$USER_HOME/.tscode/extensions/$ext_name" -type d -exec chmod 755 {} \; 2>/dev/null || true
                                      echo "          ✅ Successfully copied"
                                  else
                                      echo "          ❌ Failed to copy"
                                  fi
                              fi
                          done
                      else
                          echo "      ℹ️ No custom extensions found"
                      fi
                  fi

                  # 6b. 复制 test-tech.* 扩展（从系统扩展）
                  echo "      📦 Copying test-tech extensions..."
                  if [ -d "$EXTENSIONS_DIR" ]; then
                      find "$EXTENSIONS_DIR" -maxdepth 1 -type d -name "test-tech.*" 2>/dev/null | while read -r ext_dir; do
                          ext_name=$(basename "$ext_dir")
                          echo "        ✅ Copying system extension: $ext_name"

                          if [ ! -d "$USER_HOME/.tscode/extensions/$ext_name" ]; then
                              cp -r "$ext_dir" "$USER_HOME/.tscode/extensions/" 2>/dev/null || true

                              if [ -d "$USER_HOME/.tscode/extensions/$ext_name" ]; then
                                  find "$USER_HOME/.tscode/extensions/$ext_name" -type f -exec chmod +x {} \; 2>/dev/null || true
                                  find "$USER_HOME/.tscode/extensions/$ext_name" -type d -exec chmod 755 {} \; 2>/dev/null || true

                                  # 特别修复 testflow
                                  if [ -f "$USER_HOME/.tscode/extensions/$ext_name/bin/testflow" ]; then
                                      chmod +x "$USER_HOME/.tscode/extensions/$ext_name/bin/testflow"
                                      echo "          ✅ testflow permissions fixed"
                                  fi
                                  echo "          ✅ Successfully copied"
                              else
                                  echo "          ❌ Failed to copy"
                              fi
                          else
                              echo "          ⏭️ Already exists"
                          fi
                      done
                  fi

                  # 6c. 复制认证相关扩展
                  echo "      📦 Copying auth extensions..."
                  if [ -d "$EXTENSIONS_DIR" ]; then
                      for auth_ext in "github-authentication" "github" "microsoft-authentication"; do
                          if [ -d "$EXTENSIONS_DIR/$auth_ext" ] && [ ! -d "$USER_HOME/.tscode/extensions/$auth_ext" ]; then
                              echo "        ✅ Copying: $auth_ext"
                              cp -r "$EXTENSIONS_DIR/$auth_ext" "$USER_HOME/.tscode/extensions/" 2>/dev/null || true

                              if [ -d "$USER_HOME/.tscode/extensions/$auth_ext" ]; then
                                  find "$USER_HOME/.tscode/extensions/$auth_ext" -type f -exec chmod +x {} \; 2>/dev/null || true
                                  find "$USER_HOME/.tscode/extensions/$auth_ext" -type d -exec chmod 755 {} \; 2>/dev/null || true
                                  echo "          ✅ Successfully copied"
                              fi
                          fi
                      done
                  fi

                  # 生成 extensions.json
                  echo "      📄 Generating extensions.json..."
                  python3 << PYEOF
          import json
          import os
          import sys

          user_home = "$USER_HOME"
          ext_dir = os.path.join(user_home, '.tscode', 'extensions')
          extensions = []

          if os.path.exists(ext_dir):
              for item in os.listdir(ext_dir):
                  item_path = os.path.join(ext_dir, item)
                  if os.path.isdir(item_path):
                      pkg_json = os.path.join(item_path, 'package.json')
                      if os.path.exists(pkg_json):
                          try:
                              with open(pkg_json, 'r') as f:
                                  pkg = json.load(f)
                              ext_info = {
                                  'identifier': {'id': pkg.get('name', item)},
                                  'version': pkg.get('version', '0.0.0'),
                                  'location': {'path': item_path}
                              }
                              extensions.append(ext_info)
                          except:
                              pass

          ext_json_path = os.path.join(ext_dir, 'extensions.json')
          with open(ext_json_path, 'w') as f:
              json.dump(extensions, f, indent=2)

          print(f"        ✅ extensions.json created with {len(extensions)} extensions")
          PYEOF

                  # 设置所有权
                  if [ "$USER_NAME" != "root" ]; then
                      echo "    👤 Setting ownership..."
                      chown -R "$USER_NAME:$USER_NAME" "$USER_HOME/.tscode" 2>/dev/null || true
                      chown -R "$USER_NAME:$USER_NAME" "$USER_HOME/.local/share/tscode" 2>/dev/null || true
                  fi

                  # 最终权限设置
                  chmod -R 755 "$USER_HOME/.tscode" 2>/dev/null || true
                  chmod -R 755 "$USER_HOME/.local/share/tscode" 2>/dev/null || true
                  chmod 644 "$ARGV_FILE" 2>/dev/null || true

                  # 显示结果
                  EXT_COUNT=$(find "$USER_HOME/.tscode/extensions" -maxdepth 1 -type d ! -path "$USER_HOME/.tscode/extensions" 2>/dev/null | wc -l | tr -d ' ')
                  echo "    ✅ Configured for $USER_NAME ($EXT_COUNT extensions)"
              fi
          done

          # ============================================================
          # 7. 禁用密钥环
          # ============================================================
          echo ""
          echo "🔒 Disabling keyring..."

          REAL_USER="${SUDO_USER:-$USER}"
          if [ -n "$REAL_USER" ] && [ "$REAL_USER" != "root" ]; then
              REAL_HOME=$(getent passwd "$REAL_USER" 2>/dev/null | cut -d: -f6)
              if [ -n "$REAL_HOME" ]; then
                  mkdir -p "$REAL_HOME/.local/share/keyrings" 2>/dev/null || true
                  echo "[keyring]" > "$REAL_HOME/.local/share/keyrings/login.keyring" 2>/dev/null || true
                  echo "display-name=Login" >> "$REAL_HOME/.local/share/keyrings/login.keyring" 2>/dev/null || true
                  echo "locked=false" >> "$REAL_HOME/.local/share/keyrings/login.keyring" 2>/dev/null || true
                  chown -R "$REAL_USER:$REAL_USER" "$REAL_HOME/.local/share/keyrings" 2>/dev/null || true
                  echo "  ✅ Keyring pre-configured for $REAL_USER"
              fi
          fi

          # 8. 更新桌面数据库
          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database /usr/share/applications/
              echo "  ✅ Desktop database updated"
          fi

          if command -v update-icon-caches >/dev/null 2>&1; then
              update-icon-caches /usr/share/icons/hicolor/
              echo "  ✅ Icon cache updated"
          fi

          echo ""
          echo "=========================================="
          echo "✅ TSCode installed successfully!"
          echo ""
          echo "📁 System extensions: /opt/tscode/resources/app/extensions/"
          echo "📂 User extensions: ~/.tscode/extensions/"
          echo "📂 User data: ~/.local/share/tscode/"
          echo "📄 Config file: ~/.local/share/tscode/argv.json"
          echo ""
          echo "🚀 Run 'tscode' to start (no password required)"
          echo "=========================================="

          exit 0
          POSTINSTEOF

          chmod +x "$DEB_ROOT/DEBIAN/postinst"

          # ============================================================
          # 创建 prerm 脚本
          # ============================================================
          cat > "$DEB_ROOT/DEBIAN/prerm" << 'PRERMEOF'
          #!/bin/bash
          set -e
          echo "=========================================="
          echo "TSCode is being removed..."
          echo "=========================================="
          echo ""
          echo "📁 User data preserved at: ~/.local/share/tscode/"
          echo "📦 Extensions preserved at: ~/.tscode/extensions/"
          echo ""
          echo "To completely remove user data:"
          echo "  rm -rf ~/.tscode"
          echo "  rm -rf ~/.local/share/tscode"
          echo "=========================================="
          exit 0
          PRERMEOF

          chmod +x "$DEB_ROOT/DEBIAN/prerm"

          echo ""
          echo "📌 Building DEB package..."
          fakeroot dpkg-deb -Zgzip -z9 --build "$DEB_ROOT" "tscode-${DEB_VERSION}_${DEB_ARCH}.deb"

          if [ $? -eq 0 ] && [ -f "tscode-${DEB_VERSION}_${DEB_ARCH}.deb" ]; then
            echo ""
            echo "✅ DEB package built successfully!"
            ls -lh "tscode-${DEB_VERSION}_${DEB_ARCH}.deb"
            sha256sum "tscode-${DEB_VERSION}_${DEB_ARCH}.deb" > "tscode-${DEB_VERSION}_${DEB_ARCH}.deb.sha256"
          else
            echo "❌ Failed to build DEB package"
            exit 1
          fi

      - name: 🔍 Verify DEB package extensions
        run: |
          echo "=========================================="
          echo "🔍 Verifying DEB package extensions"
          echo "=========================================="

          VERSION="${{ github.event.inputs.version || '1.116.0' }}"
          DEB_VERSION="${VERSION}-1"
          DEB_ARCH="amd64"
          DEB_FILE="tscode-${DEB_VERSION}_${DEB_ARCH}.deb"

          if [ ! -f "$DEB_FILE" ]; then
            echo "❌ DEB package not found: $DEB_FILE"
            exit 1
          fi

          echo "📦 Extracting DEB package for verification..."
          mkdir -p /tmp/deb-verify
          cd /tmp/deb-verify
          ar x "$GITHUB_WORKSPACE/$DEB_FILE"

          if [ -f "data.tar.xz" ]; then
            tar -xf data.tar.xz
          elif [ -f "data.tar.gz" ]; then
            tar -xf data.tar.gz
          elif [ -f "data.tar" ]; then
            tar -xf data.tar
          else
            echo "❌ No data archive found in DEB package!"
            ls -la
            exit 1
          fi

          echo ""
          echo "📂 Checking extensions in DEB package..."
          echo "=========================================="

          EXT_DIR="./opt/tscode/resources/app/extensions"

          if [ ! -d "$EXT_DIR" ]; then
            echo "❌ Extensions directory not found in DEB package!"
            exit 1
          fi

          echo ""
          echo "📋 Extensions in DEB package:"
          echo "----------------------------------------"
          EXT_COUNT=$(find "$EXT_DIR" -maxdepth 1 -type d ! -path "$EXT_DIR" 2>/dev/null | wc -l | tr -d ' ')
          find "$EXT_DIR" -maxdepth 1 -type d ! -path "$EXT_DIR" -exec basename {} \; 2>/dev/null | sort
          echo "----------------------------------------"
          echo "   Total extensions: $EXT_COUNT"
          echo ""

          echo ""
          echo "🔍 Checking critical extensions in DEB:"
          CRITICAL_EXTS="typescript-language-features git git-base github-authentication json-language-features markdown-language-features html-language-features css-language-features npm debug-auto-launch merge-conflict"
          CRITICAL_MISSING=""

          for ext in $CRITICAL_EXTS; do
            if [ -d "$EXT_DIR/$ext" ]; then
              echo "   ✅ $ext"
            else
              echo "   ❌ $ext (CRITICAL - MISSING!)"
              CRITICAL_MISSING="$CRITICAL_MISSING $ext"
            fi
          done

          if [ -n "$CRITICAL_MISSING" ]; then
            echo ""
            echo "❌❌❌ CRITICAL ERROR: Missing critical extensions:$CRITICAL_MISSING"
            exit 1
          fi

          echo ""
          echo "🔍 Checking test-tech extensions in DEB:"
          TEST_TECH_EXTS=$(find "$EXT_DIR" -maxdepth 1 -type d -name "test-tech.*" 2>/dev/null)
          if [ -n "$TEST_TECH_EXTS" ]; then
            for ext in $TEST_TECH_EXTS; do
              ext_name=$(basename "$ext")
              echo "   ✅ $ext_name"
              if [ -f "$ext/bin/testflow" ]; then
                PERMS=$(stat -c %a "$ext/bin/testflow" 2>/dev/null || echo "unknown")
                echo "      📄 testflow permissions: $PERMS"
              fi
            done
          else
            echo "   ℹ️ No test-tech extensions found"
          fi

          echo ""
          echo "🔍 Checking custom-extensions in DEB:"
          CUSTOM_EXT_DIR="./opt/tscode/resources/app/custom-extensions"
          if [ -d "$CUSTOM_EXT_DIR" ]; then
            CUSTOM_COUNT=$(find "$CUSTOM_EXT_DIR" -maxdepth 1 -type d ! -path "$CUSTOM_EXT_DIR" 2>/dev/null | wc -l | tr -d ' ')
            echo "   ✅ custom-extensions directory exists ($CUSTOM_COUNT extensions)"
            if [ "$CUSTOM_COUNT" -gt 0 ]; then
              find "$CUSTOM_EXT_DIR" -maxdepth 1 -type d ! -path "$CUSTOM_EXT_DIR" -exec basename {} \; 2>/dev/null | sort
            fi
          else
            echo "   ⚠️ custom-extensions directory not found"
          fi

          echo ""
          echo "=========================================="
          echo "📊 DEB EXTENSION VERIFICATION SUMMARY"
          echo "=========================================="
          echo "   Total extensions: $EXT_COUNT"
          echo "   ✅ Critical extensions: All present"
          echo "   Result: PASSED"
          echo "=========================================="

          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/deb-verify

          echo ""
          echo "✅ DEB package extension verification completed!"

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tscode-debian10-deb
          path: |
            *.deb
            *.deb.sha256
          retention-days: 30

      - name: 📊 Build summary
        if: always()
        run: |
          echo "=========================================="
          echo "📊 BUILD SUMMARY"
          echo "=========================================="
          echo "Status: ${{ job.status }}"
          echo "Version: ${{ github.event.inputs.version || '1.116.0' }}"
          echo "Format: DEB (Debian 10)"
          echo ""
          echo "✅ Features:"
          echo "   - No password required on startup (keyring disabled)"
          echo "   - No sandbox password prompt"
          echo "   - GitHub login works (no keyring popup)"
          echo "   - Desktop entry in application menu"
          echo "   - /usr/bin/tscode is a wrapper script"
          echo "   - ✅ ALL extension binaries have execute permissions"
          echo "   - ✅ test-tech.* extensions copied to user directory"
          echo "   - ✅ Custom extensions copied to user directory"
          echo "   - ✅ Auth extensions preserved"
          echo "   - ✅ argv.json created automatically"
          echo "   - ✅ extensions.json generated"
          echo ""
          echo "📂 Directory structure:"
          echo "   System extensions: /opt/tscode/resources/app/extensions/"
          echo "   Custom extensions: /opt/tscode/resources/app/custom-extensions/"
          echo "   User extensions:   ~/.tscode/extensions/"
          echo "   User data:         ~/.local/share/tscode/"
          echo "   Config file:       ~/.local/share/tscode/argv.json"
          echo ""
          echo "🔐 Keyring: DISABLED"
          echo "🔐 Login page: WILL POPUP"
          echo ""
          echo "💡 Extensions persist across reinstallation"
          echo "==========================================="

          if [ "${{ job.status }}" = "success" ]; then
            echo ""
            echo "✅ Build completed successfully!"
            echo ""
            echo "📦 DEB Package:"
            ls -lh *.deb 2>/dev/null || echo "   No DEB package found"
            echo ""
            echo "📖 Installation:"
            echo "  sudo dpkg -i tscode-*.deb"
            echo "  sudo apt-get install -f"
            echo ""
            echo "🚀 After installation:"
            echo "  - Run: tscode (no password required)"
            echo "  - Find in application menu: TSCode"
            echo "  - GitHub login: Ctrl+Shift+P -> GitHub: Sign in"
            echo ""
            echo "📂 Directory structure:"
            echo "  System extensions: /opt/tscode/resources/app/extensions/"
            echo "  Custom extensions: /opt/tscode/resources/app/custom-extensions/"
            echo "  User extensions:   ~/.tscode/extensions/"
            echo "  User data:         ~/.local/share/tscode/"
            echo "  Config file:       ~/.local/share/tscode/argv.json"
            echo "=========================================="
          fi