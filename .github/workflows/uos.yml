name: Build for Debian 10

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'feature/uos-workflow'
      version:
        description: 'Package version'
        required: false
        default: '1.116.0'
      custom_extension_repo:
        description: 'Custom extension repository (optional)'
        required: false
        default: 'https://github.com/AI-Testing-Workbench/test-workbench-vsix.git'
      custom_extension_branch:
        description: 'Custom extension branch'
        required: false
        default: 'feature/uos-workflow'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libgtk-3-dev libxkbfile-dev \
            libkrb5-dev libgbm-dev rpm libx11-dev libxss-dev libxtst-dev \
            libnss3-dev libasound2-dev libglib2.0-dev libcairo2-dev \
            libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev \
            python3 git wget curl tree xz-utils \
            dpkg-dev fakeroot lintian rsync jq

      - name: 🔧 Fix TypeScript scripts
        run: |
          echo 'console.log("Preinstall OK");' > build/npm/preinstall.js
          sed -i 's/"preinstall": "node build\/npm\/preinstall.ts"/"preinstall": "node build\/npm\/preinstall.js"/' package.json
          echo 'console.log("Postinstall OK");' > build/npm/postinstall.js
          sed -i 's/"postinstall": "node build\/npm\/postinstall.ts"/"postinstall": "node build\/npm\/postinstall.js"/' package.json

      - name: 📦 Install dependencies
        run: |
          echo "=========================================="
          echo "📦 Installing dependencies"
          echo "=========================================="
          npm install --legacy-peer-deps

      - name: 📦 Install build tools
        run: |
          npm install -g tsx
          npm install --legacy-peer-deps \
            ternary-stream vscode-gulp-watch esbuild jsonc-parser \
            gulp-merge-json gulp-tsb gulp-sourcemaps gulp-filter \
            gulp-rename gulp-sort 2>/dev/null || true

      - name: 🔧 Fix extensions.ts
        run: |
          cat > build/lib/extensions.ts << 'EOF'
          import { Stream } from "stream";
          const empty: any[] = [];
          function emptyStream(): Stream {
            const s = new Stream.Readable();
            s._read = () => s.push(null);
            return s;
          }
          export function isWebExtension(): boolean { return false; }
          export function getExtensionStream(): Stream { return emptyStream(); }
          export function getExtensionDownloadStream(): Stream { return emptyStream(); }
          export function packageMarketplaceExtensionsStream(): Stream { return emptyStream(); }
          export function packageNativeLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageNonNativeLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageLocalExtensionsStream(): Stream { return emptyStream(); }
          export function packageExtensionsStream(): Stream { return emptyStream(); }
          export function packageCopilotExtensionStream(): Stream { return emptyStream(); }
          export function packageCopilotChatExtensionStream(): Stream { return emptyStream(); }
          export function packageCopilotAgentsExtensionStream(): Stream { return emptyStream(); }
          export function fromMarketplace(): any[] { return empty; }
          export async function fetchUrls(urls: string[], options: any): Promise<void> {
            console.log("fetchUrls: disabled");
            return Promise.resolve();
          }
          export function buildExtensionMedia(): void {}
          export function compileExtensionMedia(): void {}
          export function buildExtensionMediaTask(done: any): void { done(); }
          export const builtInExtensions = empty;
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions = empty;
          export const shouldDownloadWebBuiltInExtensions = false;
          EOF
          echo 'export const builtInExtensions: any[] = [];
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions: any[] = [];
          export const shouldDownloadWebBuiltInExtensions = false;' > build/lib/builtInExtensions.ts
          echo 'import { Stream } from "stream";
          export async function fetchUrls(urls: string[], options: any): Promise<void> {
            console.log("fetchUrls: disabled");
            return Promise.resolve();
          }' > build/lib/fetch.ts

      - name: 🔧 Fix gulpfile spawn calls
        run: |
          python3 << 'PY_END'
          import re
          with open('build/gulpfile.vscode.ts', 'r') as f:
              content = f.read()
          content = re.sub(r"spawn\('node'", "spawn('tsx'", content)
          content = re.sub(r'spawn\("node"', 'spawn("tsx"', content)
          content = re.sub(r"spawn\(process\.execPath", "spawn('tsx'", content)
          with open('build/gulpfile.vscode.ts', 'w') as f:
              f.write(content)
          print("spawn calls fixed")
          PY_END

      - name: 🔧 Replace copilot.ts
        run: |
          cat > build/lib/copilot.ts << 'EOF'
          export async function prepareBuiltInCopilotExtensionShims(extRoot: string): Promise<void> {
              console.log('Copilot extension shims preparation skipped for UOS build');
              return;
          }
          export function copyCopilotNativeDeps(productRoot: string): void {
              console.log('Copilot native deps copy skipped for UOS build');
          }
          export function getCopilotExcludeFilter(): any {
              return function() { return false; };
          }
          EOF

      - name: 🔧 Disable Crashpad
        run: |
          echo "Disabling Crashpad"
          python3 << 'PY_JSON_END'
          import json
          import os
          if os.path.exists('product.json'):
              with open('product.json', 'r') as f:
                  data = json.load(f)
              data['enableCrashReport'] = False
              if 'crashReporter' not in data:
                  data['crashReporter'] = {}
              data['crashReporter']['disabled'] = True
              with open('product.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print("product.json modified")
          PY_JSON_END

          mkdir -p src/vs/platform/crash/common
          cat > src/vs/platform/crash/common/crashService.ts << 'CRASH_EOF'
          /*---------------------------------------------------------------------------------------------
           *  Copyright (c) Microsoft Corporation. All rights reserved.
           *  Licensed under the MIT License. See License.txt in the project root for license information.
           *--------------------------------------------------------------------------------------------*/
          import { createDecorator } from '../../../base/common/instantiation.js';
          export const ICrashService = createDecorator<ICrashService>('crashService');
          export interface ICrashService { _serviceBrand: undefined; }
          export class CrashService implements ICrashService {
              declare readonly _serviceBrand: undefined;
              constructor() { console.log('Crash service disabled for UOS build'); }
          }
          CRASH_EOF
          echo "crashService.ts created"

      - name: ⚙️ Set env
        run: |
          echo "VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_ELECTRON_SKIP_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_SKIP_PRELAUNCH=1" >> $GITHUB_ENV
          echo "VSCODE_SKIP_BUNDLED_EXTENSIONS=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTER=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTING=1" >> $GITHUB_ENV

      - name: 🔨 Build VSCode
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          export VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1
          export VSCODE_ELECTRON_SKIP_DOWNLOAD=1
          export VSCODE_SKIP_PRELAUNCH=1
          export VSCODE_SKIP_BUNDLED_EXTENSIONS=1
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          echo "Start: $(date)"
          npx tsx node_modules/gulp/bin/gulp.js vscode-linux-x64 --no-color
          echo "Done: $(date)"

      - name: 🔧 Build ms-vscode.js-debug extension (optional)
        run: |
          echo "=========================================="
          echo "🔧 Building ms-vscode.js-debug extension"
          echo "=========================================="

          EXT_DIR=""
          SEARCH_PATHS=(
            "./extensions/ms-vscode.js-debug"
            "./vscode/extensions/ms-vscode.js-debug"
            "../extensions/ms-vscode.js-debug"
            "./VSCode-linux-x64/resources/app/extensions/ms-vscode.js-debug"
            "./vscode/VSCode-linux-x64/resources/app/extensions/ms-vscode.js-debug"
            "./tscode/resources/app/extensions/ms-vscode.js-debug"
            "./prebuilt-extensions/ms-vscode.js-debug"
          )

          for dir in "${SEARCH_PATHS[@]}"; do
            if [ -d "$dir" ]; then
              EXT_DIR="$dir"
              echo "📌 Found extension at: $EXT_DIR"
              break
            fi
          done

          if [ -z "$EXT_DIR" ]; then
            echo "🔍 Searching with find..."
            EXT_DIR=$(find . -type d -name "ms-vscode.js-debug" 2>/dev/null | head -1)
            if [ -n "$EXT_DIR" ]; then
              echo "📌 Found extension at: $EXT_DIR"
            fi
          fi

          if [ -z "$EXT_DIR" ]; then
            echo "⚠️ ms-vscode.js-debug extension not found!"
            echo "   Will use official version from downloaded VSCode."
            exit 0
          fi

          echo "📌 Building extension at: $EXT_DIR"

          if [ -d "$EXT_DIR/out" ]; then
            echo "   ✅ out/ directory already exists, skipping build"
          else
            echo "   📦 Building ms-vscode.js-debug..."
            cd "$EXT_DIR"

            echo "   📦 Installing dependencies..."
            npm install --legacy-peer-deps 2>&1 | tail -20 || true

            if grep -q '"compile"' package.json; then
              echo "   🔨 Running npm run compile..."
              npm run compile 2>&1 || true
            elif [ -f "node_modules/.bin/gulp" ]; then
              echo "   🔨 Running gulp compile..."
              ./node_modules/.bin/gulp compile 2>&1 || true
            else
              echo "   🔨 Trying tsc..."
              if [ -f "node_modules/.bin/tsc" ]; then
                ./node_modules/.bin/tsc -p tsconfig.json 2>&1 || true
              else
                npx tsc -p tsconfig.json 2>&1 || true
              fi
            fi

            if [ -d "out" ]; then
              echo "   ✅ Build successful!"
            else
              echo "   ⚠️ Build did not produce out/ directory"
            fi

            cd - > /dev/null
          fi

          echo "✅ Debug extension build completed"

      - name: 🔍 Verify build contents
        run: |
          echo "=========================================="
          echo "🔍 Verify build contents"
          echo "=========================================="

          BUILD_DIR=""
          for dir in "./VSCode-linux-x64" "./vscode/VSCode-linux-x64" "../VSCode-linux-x64"; do
            if [ -d "$dir" ]; then
              BUILD_DIR="$dir"
              echo "Found build directory: $BUILD_DIR"
              break
            fi
          done

          if [ -z "$BUILD_DIR" ]; then
            echo "Build directory not found!"
            exit 1
          fi

          TARGET_DIR="./tscode"
          if [ "$BUILD_DIR" != "$TARGET_DIR" ]; then
            echo "Renaming $BUILD_DIR to $TARGET_DIR"
            rm -rf "$TARGET_DIR"
            mv "$BUILD_DIR" "$TARGET_DIR"
          fi
          BUILD_DIR="$TARGET_DIR"
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

          echo "Initial build size:"
          du -sh "$BUILD_DIR"

      - name: 📦 Copy node_modules to resources/app
        run: |
          echo "=========================================="
          echo "📦 Copy node_modules to resources/app"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          if [ ! -d "./node_modules" ]; then
            echo "❌ node_modules not found in root!"
            echo "Installing node_modules..."
            npm install --legacy-peer-deps
          fi

          echo "📌 Copying node_modules to $BUILD_DIR/resources/app/"
          rm -rf "$BUILD_DIR/resources/app/node_modules"
          cp -r ./node_modules "$BUILD_DIR/resources/app/"

          echo "✅ node_modules copied"

      - name: 🔥 Replace node-pty and copy official extensions
        run: |
          set +e

          echo "=========================================="
          echo "🔥 Replacing node-pty & copying official extensions"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          VERSION="${{ github.event.inputs.version || '1.116.0' }}"

          # 下载官方 VSCode
          echo ""
          echo "📌 Step 1: Downloading official VSCode $VERSION for Linux x64..."

          rm -rf /tmp/official-vscode
          rm -f /tmp/official.tar.gz

          wget -q --show-progress "https://update.code.visualstudio.com/$VERSION/linux-x64/stable" -O /tmp/official.tar.gz

          if [ $? -ne 0 ] || [ ! -s /tmp/official.tar.gz ]; then
            echo "⚠️ Failed to download version $VERSION, trying latest..."
            wget -q --show-progress https://update.code.visualstudio.com/latest/linux-x64/stable -O /tmp/official.tar.gz
            if [ $? -ne 0 ] || [ ! -s /tmp/official.tar.gz ]; then
              echo "❌ Failed to download official VSCode!"
              exit 1
            fi
          fi

          echo "📌 Extracting official VSCode..."
          mkdir -p /tmp/official-vscode
          tar -xzf /tmp/official.tar.gz -C /tmp/official-vscode/

          OFFICIAL_DIR=""
          for dir in "/tmp/official-vscode/VSCode-linux-x64" "/tmp/official-vscode/vscode/VSCode-linux-x64"; do
            if [ -d "$dir" ]; then
              OFFICIAL_DIR="$dir"
              break
            fi
          done

          if [ -z "$OFFICIAL_DIR" ]; then
            OFFICIAL_DIR=$(find /tmp/official-vscode -type d -name "VSCode-linux-x64" 2>/dev/null | head -1)
          fi

          if [ -z "$OFFICIAL_DIR" ] || [ ! -d "$OFFICIAL_DIR" ]; then
            echo "❌ Could not find official VSCode directory!"
            exit 1
          fi

          echo "✅ Official VSCode found at: $OFFICIAL_DIR"

          # 替换 node-pty
          echo ""
          echo "📌 Step 2: Replacing node-pty native module only..."

          NODE_PTY_DIR="$BUILD_DIR/resources/app/node_modules/node-pty"
          OFFICIAL_NODE_PTY="$OFFICIAL_DIR/resources/app/node_modules/node-pty"

          if [ -d "$OFFICIAL_NODE_PTY" ]; then
            echo "   ✅ Found official node-pty"

            if [ -d "$NODE_PTY_DIR" ]; then
              echo "   📦 Backing up original node-pty..."
              mv "$NODE_PTY_DIR" "$NODE_PTY_DIR.build.bak"
            fi

            echo "   📦 Copying official node-pty..."
            cp -r "$OFFICIAL_NODE_PTY" "$NODE_PTY_DIR"

            if [ -d "$NODE_PTY_DIR/build" ]; then
              chmod +x "$NODE_PTY_DIR/build"/* 2>/dev/null || true
            fi
            if [ -d "$NODE_PTY_DIR/lib" ]; then
              find "$NODE_PTY_DIR/lib" -name "*.node" -exec chmod +x {} \; 2>/dev/null || true
            fi

            echo "   ✅ node-pty replaced successfully"
            rm -rf "$NODE_PTY_DIR.build.bak" 2>/dev/null || true
          else
            echo "   ⚠️ No node-pty found in official build, keeping original"
          fi

          # 复制官方扩展
          echo ""
          echo "📌 Step 3: Copying official extensions"

          mkdir -p "$BUILD_DIR/resources/app/extensions"
          OFFICIAL_EXT_DIR="$OFFICIAL_DIR/resources/app/extensions"

          if [ ! -d "$OFFICIAL_EXT_DIR" ]; then
            echo "❌ Official extensions directory not found!"
            exit 1
          fi

          DEBUG_EXTS="ms-vscode.js-debug ms-vscode.js-debug-companion"
          KEEP_BUILT_EXTS="typescript-language-features git json-language-features markdown-language-features html-language-features css-language-features npm debug-auto-launch merge-conflict search-result @builtin"

          EXT_COPIED=0
          EXT_KEPT=0
          EXT_SKIPPED=0

          # 复制调试扩展
          echo "   📦 Copying debug extensions..."
          for ext in $DEBUG_EXTS; do
            echo "      Processing: $ext"

            BUILD_EXT_DIR=""
            for dir in "./extensions/$ext" "./vscode/extensions/$ext" "../extensions/$ext" "./VSCode-linux-x64/resources/app/extensions/$ext" "./tscode/resources/app/extensions/$ext"; do
              if [ -d "$dir" ] && [ -d "$dir/out" ]; then
                BUILD_EXT_DIR="$dir"
                echo "         📦 Found compiled version in build directory: $dir"
                break
              fi
            done

            if [ -n "$BUILD_EXT_DIR" ] && [ -d "$BUILD_EXT_DIR/out" ]; then
              echo "         ✅ Copying from build directory (with compiled output)"
              rm -rf "$BUILD_DIR/resources/app/extensions/$ext" 2>/dev/null || true
              cp -r "$BUILD_EXT_DIR" "$BUILD_DIR/resources/app/extensions/"
              EXT_COPIED=$((EXT_COPIED + 1))
              if [ -d "$BUILD_DIR/resources/app/extensions/$ext/out" ]; then
                echo "         ✅ out/ directory copied from build"
              fi
            elif [ -d "$OFFICIAL_EXT_DIR/$ext" ]; then
              echo "         📦 Copying from official"
              rm -rf "$BUILD_DIR/resources/app/extensions/$ext" 2>/dev/null || true
              cp -r "$OFFICIAL_EXT_DIR/$ext" "$BUILD_DIR/resources/app/extensions/"
              EXT_COPIED=$((EXT_COPIED + 1))
              if [ -d "$BUILD_DIR/resources/app/extensions/$ext/out" ]; then
                echo "         ✅ out/ directory found in official"
              else
                echo "         ⚠️ No compiled output in official"
                for src_dir in "./extensions/$ext" "./vscode/extensions/$ext" "../extensions/$ext" "./VSCode-linux-x64/resources/app/extensions/$ext" "./tscode/resources/app/extensions/$ext"; do
                  if [ -d "$src_dir/out" ]; then
                    echo "         📦 Copying out/ from $src_dir..."
                    cp -r "$src_dir/out" "$BUILD_DIR/resources/app/extensions/$ext/"
                    break
                  fi
                done
              fi
            else
              echo "         ⚠️ Not found: $ext"
            fi
          done

          # 保留构建的核心扩展
          echo ""
          echo "   📦 Keeping built-in core extensions from build..."
          for ext in $KEEP_BUILT_EXTS; do
            if [ -d "$BUILD_DIR/resources/app/extensions/$ext" ]; then
              echo "      ✅ Keeping: $ext"
              EXT_KEPT=$((EXT_KEPT + 1))
            elif [ -d "$OFFICIAL_EXT_DIR/$ext" ]; then
              echo "      📦 Copying from official: $ext"
              cp -r "$OFFICIAL_EXT_DIR/$ext" "$BUILD_DIR/resources/app/extensions/"
              EXT_COPIED=$((EXT_COPIED + 1))
            fi
          done

          # 复制其他官方扩展
          echo ""
          echo "   📦 Copying additional official extensions..."
          for ext_dir in "$OFFICIAL_EXT_DIR"/*/; do
            ext_name=$(basename "$ext_dir")
            case "$ext_name" in
              ms-vscode.js-debug|ms-vscode.js-debug-companion|typescript-language-features|git|json-language-features|markdown-language-features|html-language-features|css-language-features|npm|@builtin)
                continue
                ;;
            esac
            if [ -d "$BUILD_DIR/resources/app/extensions/$ext_name" ]; then
              echo "      ⏭️ Skipping: $ext_name"
              EXT_SKIPPED=$((EXT_SKIPPED + 1))
            else
              echo "      ✅ Copying: $ext_name"
              cp -r "$ext_dir" "$BUILD_DIR/resources/app/extensions/"
              EXT_COPIED=$((EXT_COPIED + 1))
            fi
          done

          echo ""
          echo "   📊 Extension copy summary:"
          echo "      ✅ Copied: $EXT_COPIED"
          echo "      ✅ Kept: $EXT_KEPT"
          echo "      ⏭️ Skipped: $EXT_SKIPPED"

          # 复制 @vscode/debug 包
          echo ""
          echo "📌 Step 4: Copying @vscode/debug packages..."

          NODE_MODULES="$BUILD_DIR/resources/app/node_modules"
          OFFICIAL_NODE_MODULES="$OFFICIAL_DIR/resources/app/node_modules"

          DEBUG_PKGS="@vscode/debug @vscode/debugadapter @vscode/debugprotocol"

          for pkg in $DEBUG_PKGS; do
            if [ -d "$NODE_MODULES/$pkg" ]; then
              echo "   ✅ $pkg already exists"
            elif [ -d "./node_modules/$pkg" ]; then
              echo "   📦 Copying $pkg from root node_modules..."
              mkdir -p "$NODE_MODULES/@vscode"
              cp -r "./node_modules/$pkg" "$NODE_MODULES/@vscode/"
            elif [ -d "$OFFICIAL_NODE_MODULES/$pkg" ]; then
              echo "   📦 Copying $pkg from official..."
              mkdir -p "$NODE_MODULES/@vscode"
              cp -r "$OFFICIAL_NODE_MODULES/$pkg" "$NODE_MODULES/@vscode/"
            else
              echo "   ⚠️ $pkg not found, installing..."
              cd "$NODE_MODULES"
              npm install $pkg --no-save --legacy-peer-deps 2>/dev/null || true
              cd - > /dev/null
            fi
          done

          # 清理临时文件
          echo ""
          echo "📌 Cleaning up temporary files..."
          rm -f /tmp/official.tar.gz
          rm -rf /tmp/official-vscode
          echo "   ✅ Cleanup completed"

          echo ""
          echo "✅ All replacements completed!"

          set -e

      - name: 🧹 Deep cleanup (preserve debug dependencies)
        run: |
          echo "=========================================="
          echo "🧹 Deep cleanup - preserving debug dependencies"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          cd "$BUILD_DIR/resources/app"

          PROTECTED_PKGS="node-pty @vscode/debug @vscode/debugadapter @vscode/debugprotocol @vscode/ripgrep typescript @types"

          echo "📌 Protecting debug-related packages..."
          for pkg in $PROTECTED_PKGS; do
            if [ -d "node_modules/$pkg" ]; then
              echo "   ✅ Preserving: $pkg"
              mv "node_modules/$pkg" "/tmp/$pkg.protected" 2>/dev/null || true
            fi
          done

          echo ""
          echo "📌 Removing unnecessary files..."
          find node_modules -name "*.md" -type f -delete 2>/dev/null || true
          find node_modules -name "CHANGELOG*" -type f -delete 2>/dev/null || true
          find node_modules -name "LICENSE*" -type f -delete 2>/dev/null || true

          find node_modules -type d -name "test" ! -path "*/@vscode/debug*/*" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "tests" ! -path "*/@vscode/debug*/*" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "__tests__" ! -path "*/@vscode/debug*/*" -exec rm -rf {} + 2>/dev/null || true

          find node_modules -type d -name "example" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "examples" -exec rm -rf {} + 2>/dev/null || true

          find node_modules -name "*.map" -type f ! -path "*/@vscode/debug*/*" -delete 2>/dev/null || true
          find node_modules -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true

          echo ""
          echo "📌 Restoring protected packages..."
          for pkg in $PROTECTED_PKGS; do
            if [ -d "/tmp/$pkg.protected" ]; then
              rm -rf "node_modules/$pkg" 2>/dev/null || true
              mv "/tmp/$pkg.protected" "node_modules/$pkg"
              echo "   ✅ Restored: $pkg"
            fi
          done

          if [ -d "node_modules/node-pty" ]; then
            chmod +x node_modules/node-pty/build/* 2>/dev/null || true
            find node_modules/node-pty -name "*.node" -exec chmod +x {} \; 2>/dev/null || true
            echo "   ✅ node-pty permissions fixed"
          fi

          cd -
          echo "✅ Deep cleanup completed"

      - name: 🔍 Verify debug functionality in build
        run: |
          echo "=========================================="
          echo "🔍 Verifying debug functionality in build"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          EXT_DIR="$BUILD_DIR/resources/app/extensions"

          echo ""
          echo "1️⃣ Checking debug extensions..."
          for ext in ms-vscode.js-debug ms-vscode.js-debug-companion; do
            if [ -d "$EXT_DIR/$ext" ]; then
              echo "   ✅ $ext"
              if [ -f "$EXT_DIR/$ext/package.json" ]; then
                VERSION=$(grep -o '"version": *"[^"]*"' "$EXT_DIR/$ext/package.json" | head -1 | cut -d'"' -f4)
                echo "      Version: $VERSION"
              fi
            else
              echo "   ❌ $ext (MISSING!)"
              exit 1
            fi
          done

          echo ""
          echo "2️⃣ Checking compiled output..."
          for ext in ms-vscode.js-debug ms-vscode.js-debug-companion; do
            if [ -d "$EXT_DIR/$ext/out" ]; then
              echo "   ✅ $ext/out/ exists"
              if [ -f "$EXT_DIR/$ext/out/nodeDebug.js" ]; then
                echo "      ✅ Debug adapter: out/nodeDebug.js"
              fi
            elif [ -d "$EXT_DIR/$ext/dist" ]; then
              echo "   ✅ $ext/dist/ exists"
            else
              if [ -d "$EXT_DIR/$ext/src" ]; then
                echo "   ℹ️ $ext: Using runtime compilation (src/ exists)"
              else
                echo "   ⚠️ $ext: No out/, dist/ or src/ directory"
              fi
            fi
          done

          echo ""
          echo "3️⃣ Checking @vscode/debug packages..."
          NODE_MODULES="$BUILD_DIR/resources/app/node_modules"
          for pkg in "@vscode/debug" "@vscode/debugadapter" "@vscode/debugprotocol"; do
            if [ -d "$NODE_MODULES/$pkg" ]; then
              echo "   ✅ $pkg"
            else
              echo "   ⚠️ $pkg not found"
            fi
          done

          echo ""
          echo "4️⃣ Checking node-pty..."
          if [ -d "$NODE_MODULES/node-pty" ]; then
            echo "   ✅ node-pty exists"
            if [ -f "$NODE_MODULES/node-pty/build/pty.node" ]; then
              echo "      ✅ pty.node found"
              file "$NODE_MODULES/node-pty/build/pty.node" 2>/dev/null | head -1
            fi
          fi

          echo ""
          echo "5️⃣ Checking ripgrep..."
          RG_PATHS=$(find "$BUILD_DIR/resources/app" -name "rg" -type f 2>/dev/null)
          if [ -n "$RG_PATHS" ]; then
            echo "   ✅ ripgrep found: $(echo "$RG_PATHS" | wc -l) files"
          else
            echo "   ⚠️ ripgrep not found"
          fi

          echo ""
          echo "=========================================="
          echo "✅ Debug functionality verification completed"
          echo "=========================================="

      - name: 📄 Create launcher and fix all issues
        run: |
          echo "=========================================="
          echo "📄 Creating launcher and fixing all issues"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          cd "$BUILD_DIR"

          [ -f "resources/app/package.json" ] && cp "resources/app/package.json" . && echo "✅ package.json"
          [ -f "resources/app/product.json" ] && cp "resources/app/product.json" . && echo "✅ product.json"

          REAL_EXEC=""
          for name in code code-oss; do
            if [ -f "./$name" ]; then
              REAL_EXEC="$name"
              break
            fi
          done

          if [ -z "$REAL_EXEC" ]; then
            REAL_EXEC=$(find . -maxdepth 1 -type f -executable ! -name "*.so" ! -name "*.sh" ! -name "chrome-*" 2>/dev/null | head -1 | sed 's|^\./||')
          fi

          if [ -z "$REAL_EXEC" ]; then
            echo "❌ No executable found!"
            exit 1
          fi

          echo "✅ Found executable: $REAL_EXEC"

          if [ "$REAL_EXEC" != "tscode" ]; then
            mv "$REAL_EXEC" "tscode"
            echo "✅ Renamed to tscode"
          else
            echo "✅ Already named tscode"
          fi

          # 创建启动脚本 - 包含 argv.json 自动修复 (统一放在 ~/.tscode/)
          cat > run.sh << 'RUNEOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          # 环境变量
          export ELECTRON_ENABLE_GPU=0
          export LIBGL_ALWAYS_SOFTWARE=1
          export NODE_OPTIONS="--max-old-space-size=4096"
          export ELECTRON_DISABLE_SANDBOX=1
          export GDK_BACKEND=x11
          export QT_QPA_PLATFORM=xcb
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          export CRASHPAD_DISABLE=1

          # 禁用密钥环
          export GNOME_KEYRING_CONTROL=
          export DBUS_SESSION_BUS_ADDRESS=
          export PYTHON_KEYRING_BACKEND=keyring.backends.null.Keyring
          export SECRETS_BACKEND=basic
          export DISABLE_VAULT=1
          export VSCODE_PASSWORD_STORE=basic
          export ELECTRON_PASSWORD_STORE=basic

          # 用户数据目录 - 统一使用 ~/.tscode/
          export VSCODE_APPDATA="$HOME/.tscode"
          export VSCODE_EXTENSIONS_DIR="$HOME/.tscode/extensions"

          # 创建目录
          mkdir -p "$VSCODE_APPDATA" 2>/dev/null || true
          mkdir -p "$VSCODE_EXTENSIONS_DIR" 2>/dev/null || true

          # ============================================================
          # 创建/修复 argv.json (在 ~/.tscode/ 目录)
          # ============================================================
          ARGV_FILE="$VSCODE_APPDATA/argv.json"
          echo "🔧 Checking argv.json at $ARGV_FILE..."

          NEEDS_FIX=false

          if [ -f "$ARGV_FILE" ]; then
              if ! python3 -c "import json; json.load(open('$ARGV_FILE'))" 2>/dev/null; then
                  echo "   ⚠️ argv.json is corrupted, backing up..."
                  mv "$ARGV_FILE" "$ARGV_FILE.bak.$(date +%s)" 2>/dev/null || true
                  NEEDS_FIX=true
              else
                  echo "   ✅ argv.json is valid"
              fi
          else
              echo "   📌 argv.json not found, creating..."
              NEEDS_FIX=true
          fi

          if [ "$NEEDS_FIX" = true ] || [ ! -f "$ARGV_FILE" ]; then
              cat > "$ARGV_FILE" << 'ARGVEOF'
          {
              "enable-proposed-api": [],
              "locale": "en",
              "disable-hardware-acceleration": false,
              "disable-gpu": false,
              "enable-crash-reporter": false
          }
          ARGVEOF
              echo "   ✅ Created/fixed argv.json"
          fi

          # 设置权限
          chmod 644 "$ARGV_FILE" 2>/dev/null || true

          # 系统扩展目录
          export VSCODE_SYSTEM_EXTENSIONS="$SCRIPT_DIR/resources/app/extensions"

          echo "🚀 Starting TSCode..."
          echo "   User data: $VSCODE_APPDATA"
          echo "   Extensions: $VSCODE_EXTENSIONS_DIR"

          # 启动
          exec "$SCRIPT_DIR/tscode" \
              --no-sandbox \
              --disable-gpu-sandbox \
              --disable-gpu \
              --disable-crash-reporter \
              --password-store="basic" \
              --extensions-dir="$VSCODE_EXTENSIONS_DIR" \
              --user-data-dir="$VSCODE_APPDATA" \
              --builtin-extensions-dir="$VSCODE_SYSTEM_EXTENSIONS" \
              "$@"
          RUNEOF

          chmod +x run.sh

          cat > start-tscode.sh << 'STARTEOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$SCRIPT_DIR/run.sh" "$@"
          STARTEOF

          chmod +x start-tscode.sh
          chmod +x tscode
          chmod +x chrome-sandbox 2>/dev/null || true

          echo "✅ Launcher and scripts created"

      - name: 📄 Create desktop entry
        run: |
          echo "=========================================="
          echo "📄 Creating desktop entry"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          mkdir -p "$BUILD_DIR/usr/share/applications"
          mkdir -p "$BUILD_DIR/usr/share/icons/hicolor/256x256/apps"

          if [ -f "$BUILD_DIR/resources/app/resources/linux/code.png" ]; then
            cp "$BUILD_DIR/resources/app/resources/linux/code.png" \
               "$BUILD_DIR/usr/share/icons/hicolor/256x256/apps/tscode.png"
            echo "   ✅ Icon copied"
          fi

          cat > "$BUILD_DIR/usr/share/applications/tscode.desktop" << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=TSCode
          GenericName=Code Editor
          Comment=Code Editing. Redefined.
          Exec=/opt/tscode/run.sh %F
          Icon=tscode
          Terminal=false
          Categories=Development;IDE
          MimeType=text/plain;inode/directory
          StartupNotify=true
          StartupWMClass=Code
          X-GNOME-SingleWindow=false
          EOF

          echo "   ✅ Desktop file created"

      - name: 📄 Create validation script
        run: |
          echo "=========================================="
          echo "📄 Creating validation script"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          cat > "$BUILD_DIR/validate.sh" << 'VALIDATE_EOF'
          #!/bin/bash
          echo "=========================================="
          echo "TSCode Validation Script"
          echo "=========================================="

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          PASSED=0
          FAILED=0

          echo ""
          echo "1️⃣ Checking main executable..."
          if [ -x "$SCRIPT_DIR/tscode" ]; then
            echo "   ✅ tscode executable"
            ((PASSED++))
          else
            echo "   ❌ tscode not executable"
            ((FAILED++))
          fi

          echo ""
          echo "2️⃣ Checking run wrapper..."
          if [ -x "$SCRIPT_DIR/run.sh" ]; then
            echo "   ✅ run.sh exists and executable"
            ((PASSED++))
          else
            echo "   ❌ run.sh missing"
            ((FAILED++))
          fi

          echo ""
          echo "3️⃣ Checking start-tscode.sh..."
          if [ -x "$SCRIPT_DIR/start-tscode.sh" ]; then
            echo "   ✅ start-tscode.sh exists"
            ((PASSED++))
          else
            echo "   ❌ start-tscode.sh missing"
            ((FAILED++))
          fi

          echo ""
          echo "4️⃣ Checking desktop file..."
          if [ -f "$SCRIPT_DIR/usr/share/applications/tscode.desktop" ]; then
            echo "   ✅ Desktop file exists"
            ((PASSED++))
          else
            echo "   ❌ Desktop file missing"
            ((FAILED++))
          fi

          echo ""
          echo "5️⃣ Checking icon..."
          if [ -f "$SCRIPT_DIR/usr/share/icons/hicolor/256x256/apps/tscode.png" ]; then
            echo "   ✅ Icon exists"
            ((PASSED++))
          else
            echo "   ⚠️ Icon missing"
          fi

          echo ""
          echo "6️⃣ Checking debug extensions..."
          for ext in ms-vscode.js-debug ms-vscode.js-debug-companion; do
            if [ -d "$SCRIPT_DIR/resources/app/extensions/$ext" ]; then
              echo "   ✅ $ext"
              if [ -d "$SCRIPT_DIR/resources/app/extensions/$ext/out" ] || [ -d "$SCRIPT_DIR/resources/app/extensions/$ext/dist" ]; then
                echo "      ✅ Compiled"
              elif [ -d "$SCRIPT_DIR/resources/app/extensions/$ext/src" ]; then
                echo "      ℹ️ Runtime compilation (src/ exists)"
              else
                echo "      ⚠️ No source or compiled output"
              fi
              ((PASSED++))
            else
              echo "   ❌ $ext missing"
              ((FAILED++))
            fi
          done

          echo ""
          echo "7️⃣ Checking @vscode/debug packages..."
          NODE_MODULES="$SCRIPT_DIR/resources/app/node_modules"
          for pkg in "@vscode/debug" "@vscode/debugadapter" "@vscode/debugprotocol"; do
            if [ -d "$NODE_MODULES/$pkg" ]; then
              echo "   ✅ $pkg"
              ((PASSED++))
            else
              echo "   ⚠️ $pkg not found"
            fi
          done

          echo ""
          echo "8️⃣ Checking TypeScript..."
          if [ -d "$NODE_MODULES/typescript" ]; then
            TS_VERSION=$(grep -o '"version": *"[^"]*"' "$NODE_MODULES/typescript/package.json" 2>/dev/null | head -1 | cut -d'"' -f4 || echo "unknown")
            echo "   ✅ TypeScript (v$TS_VERSION)"
            ((PASSED++))
          else
            echo "   ⚠️ TypeScript not found"
          fi

          echo ""
          echo "9️⃣ Checking node-pty..."
          if [ -d "$NODE_MODULES/node-pty" ]; then
            if [ -f "$NODE_MODULES/node-pty/build/pty.node" ]; then
              echo "   ✅ node-pty with native module"
              ((PASSED++))
            else
              echo "   ⚠️ node-pty without native module"
            fi
          else
            echo "   ❌ node-pty not found"
            ((FAILED++))
          fi

          echo ""
          echo "=========================================="
          echo "Validation Results:"
          echo "   ✅ Passed: $PASSED"
          echo "   ❌ Failed: $FAILED"
          echo "=========================================="

          if [ $FAILED -eq 0 ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed."
            exit 1
          fi
          VALIDATE_EOF

          chmod +x "$BUILD_DIR/validate.sh"
          echo "✅ Validation script created"

      - name: 🔍 Run validation
        run: |
          echo "=========================================="
          echo "🔍 Running validation"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          if ! "$BUILD_DIR/validate.sh"; then
            echo "❌ Validation failed!"
            exit 1
          fi

          echo "✅ Validation passed!"

      - name: 📦 Build DEB package
        run: |
          echo "=========================================="
          echo "📦 Building DEB package for Debian 10"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          VERSION="${{ github.event.inputs.version || '1.116.0' }}"
          DEB_VERSION="${VERSION}-1"
          DEB_ARCH="amd64"
          DEB_ROOT="$(pwd)/deb_root"

          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/opt/tscode"
          mkdir -p "$DEB_ROOT/usr/bin"
          mkdir -p "$DEB_ROOT/usr/share/applications"
          mkdir -p "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps"

          echo "📌 Copying application to /opt/tscode..."
          cp -r "$BUILD_DIR"/* "$DEB_ROOT/opt/tscode/"

          # ============================================================
          # 修复所有权限
          # ============================================================
          echo ""
          echo "📌 Fixing all permissions..."

          if [ -f "$DEB_ROOT/opt/tscode/chrome-sandbox" ]; then
            sudo chown root:root "$DEB_ROOT/opt/tscode/chrome-sandbox"
            sudo chmod 4755 "$DEB_ROOT/opt/tscode/chrome-sandbox"
            echo "   ✅ chrome-sandbox SUID set"
          fi

          chmod +x "$DEB_ROOT/opt/tscode/tscode" 2>/dev/null || true
          chmod +x "$DEB_ROOT/opt/tscode/run.sh" 2>/dev/null || true
          chmod +x "$DEB_ROOT/opt/tscode/start-tscode.sh" 2>/dev/null || true
          chmod +x "$DEB_ROOT/opt/tscode/validate.sh" 2>/dev/null || true

          EXTENSIONS_DIR="$DEB_ROOT/opt/tscode/resources/app/extensions"
          if [ -d "$EXTENSIONS_DIR" ]; then
              find "$EXTENSIONS_DIR" -type d \( -name "bin" -o -name "scripts" -o -name "tools" -o -name "utils" \) 2>/dev/null | while read -r dir; do
                  find "$dir" -type f -exec chmod +x {} \; 2>/dev/null || true
              done
              find "$EXTENSIONS_DIR" -type f \( -name "*.sh" -o -name "*.js" -o -name "*.node" -o -name "rg" \) -exec chmod +x {} \; 2>/dev/null || true
          fi

          if [ -d "$DEB_ROOT/opt/tscode/resources/app/custom-extensions" ]; then
              find "$DEB_ROOT/opt/tscode/resources/app/custom-extensions" -type f -exec chmod +x {} \; 2>/dev/null || true
          fi

          # ============================================================
          # 创建 /usr/bin/tscode 包装脚本
          # ============================================================
          cat > "$DEB_ROOT/usr/bin/tscode" << 'WRAPEOF'
          #!/bin/bash
          exec /opt/tscode/run.sh "$@"
          WRAPEOF

          chmod +x "$DEB_ROOT/usr/bin/tscode"

          # ============================================================
          # 复制图标和桌面文件
          # ============================================================
          if [ -f "$BUILD_DIR/resources/app/resources/linux/code.png" ]; then
            cp "$BUILD_DIR/resources/app/resources/linux/code.png" \
               "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps/tscode.png"
          fi

          printf '%s\n' \
            '[Desktop Entry]' \
            'Version=1.0' \
            'Type=Application' \
            'Name=TSCode' \
            'GenericName=Code Editor' \
            'Comment=Code Editing. Redefined.' \
            'Exec=/opt/tscode/run.sh %F' \
            'Icon=tscode' \
            'Terminal=false' \
            'Categories=Development;IDE' \
            'MimeType=text/plain;inode/directory' \
            'StartupNotify=true' \
            'StartupWMClass=Code' > "$DEB_ROOT/usr/share/applications/tscode.desktop"

          # ============================================================
          # 创建 DEBIAN/control
          # ============================================================
          cat > "$DEB_ROOT/DEBIAN/control" << 'CONTROLEOF'
          Package: tscode
          Version: REPLACE_VERSION
          Architecture: REPLACE_ARCH
          Maintainer: TSCode Team <tscode@example.com>
          Description: TSCode - Code Editing. Redefined.
           TSCode is a code editor redefined and optimized for building
           and debugging modern web and cloud applications.
          Depends: libgtk-3-0, libx11-6, libxss1, libxtst6, libnss3, libasound2, libgbm1, libglib2.0-0, libcairo2, libpango-1.0-0, libatk1.0-0, libgdk-pixbuf2.0-0
          Recommends: git, python3
          Homepage: https://github.com/tscode
          Section: devel
          Priority: optional
          CONTROLEOF

          sed -i "s/REPLACE_VERSION/${DEB_VERSION}/g" "$DEB_ROOT/DEBIAN/control"
          sed -i "s/REPLACE_ARCH/${DEB_ARCH}/g" "$DEB_ROOT/DEBIAN/control"

          # ============================================================
          # 创建 postinst 脚本 - 统一使用 ~/.tscode/ 作为用户数据目录
          # ============================================================
          cat > "$DEB_ROOT/DEBIAN/postinst" << 'POSTINSTEOF'
          #!/bin/bash
          set -e

          echo "=========================================="
          echo "Setting up TSCode for Debian 10..."
          echo "=========================================="

          # 修复 chrome-sandbox SUID
          if [ -f "/opt/tscode/chrome-sandbox" ]; then
              chown root:root /opt/tscode/chrome-sandbox
              chmod 4755 /opt/tscode/chrome-sandbox
              echo "  ✅ chrome-sandbox permissions fixed"
          fi

          # 设置可执行权限
          chmod +x /opt/tscode/run.sh 2>/dev/null || true
          chmod +x /opt/tscode/tscode 2>/dev/null || true
          chmod +x /usr/bin/tscode 2>/dev/null || true

          # 修复扩展权限
          EXTENSIONS_DIR="/opt/tscode/resources/app/extensions"
          if [ -d "$EXTENSIONS_DIR" ]; then
              find "$EXTENSIONS_DIR" -type f -name "*.node" -exec chmod +x {} \; 2>/dev/null || true
              find "$EXTENSIONS_DIR" -type f -name "rg" -exec chmod +x {} \; 2>/dev/null || true
          fi

          # ============================================================
          # 为所有用户创建 ~/.tscode/ 目录和 argv.json
          # ============================================================
          echo ""
          echo "🔧 Creating ~/.tscode/ directories and argv.json for all users..."

          for USER_HOME in /home/* /root; do
              if [ -d "$USER_HOME" ] && [ "$USER_HOME" != "/home/*" ]; then
                  USER_NAME=$(basename "$USER_HOME")
                  TSC_DIR="$USER_HOME/.tscode"
                  EXT_DIR="$TSC_DIR/extensions"
                  ARGV_FILE="$TSC_DIR/argv.json"

                  # 创建目录
                  mkdir -p "$EXT_DIR" 2>/dev/null || true

                  # 检查并创建/修复 argv.json
                  NEEDS_FIX=false
                  if [ -f "$ARGV_FILE" ]; then
                      if ! python3 -c "import json; json.load(open('$ARGV_FILE'))" 2>/dev/null; then
                          echo "    ⚠️ Corrupted argv.json for $USER_NAME, fixing..."
                          mv "$ARGV_FILE" "$ARGV_FILE.bak.$(date +%s)" 2>/dev/null || true
                          NEEDS_FIX=true
                      else
                          echo "    ✅ argv.json valid for $USER_NAME"
                      fi
                  else
                      echo "    📌 Creating argv.json for $USER_NAME..."
                      NEEDS_FIX=true
                  fi

                  if [ "$NEEDS_FIX" = true ] || [ ! -f "$ARGV_FILE" ]; then
                      cat > "$ARGV_FILE" << 'ARGVEOF'
          {
              "enable-proposed-api": [],
              "locale": "en",
              "disable-hardware-acceleration": false,
              "disable-gpu": false,
              "enable-crash-reporter": false
          }
          ARGVEOF
                      echo "    ✅ Created/fixed argv.json for $USER_NAME"
                  fi

                  # 设置正确的权限
                  chmod 644 "$ARGV_FILE" 2>/dev/null || true
                  if [ "$USER_HOME" != "/root" ]; then
                      USER_OWNER=$(stat -c '%u:%g' "$USER_HOME" 2>/dev/null || echo "")
                      if [ -n "$USER_OWNER" ]; then
                          chown -R "$USER_OWNER" "$TSC_DIR" 2>/dev/null || true
                      fi
                  fi
              fi
          done

          # 清理旧的 ~/.local/share/tscode/ 数据（迁移警告）
          echo ""
          echo "🧹 Checking for old data directories..."
          for USER_HOME in /home/* /root; do
              if [ -d "$USER_HOME" ] && [ "$USER_HOME" != "/home/*" ]; then
                  OLD_DATA_DIR="$USER_HOME/.local/share/tscode"
                  if [ -d "$OLD_DATA_DIR" ]; then
                      echo "    ℹ️ Old data found at $OLD_DATA_DIR"
                      echo "       Please manually migrate or remove if no longer needed"
                      if [ -f "$OLD_DATA_DIR/argv.json" ] && [ ! -f "$USER_HOME/.tscode/argv.json" ]; then
                          echo "       Copying argv.json from old location..."
                          cp "$OLD_DATA_DIR/argv.json" "$USER_HOME/.tscode/argv.json"
                      fi
                  fi
              fi
          done

          # 更新桌面数据库
          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database /usr/share/applications/ || true
          fi

          echo ""
          echo "=========================================="
          echo "✅ TSCode installed successfully!"
          echo ""
          echo "📁 System extensions: /opt/tscode/resources/app/extensions/"
          echo "📂 User directory:    ~/.tscode/"
          echo "   ├── extensions/    (user extensions)"
          echo "   └── argv.json      (configuration)"
          echo ""
          echo "🚀 Run 'tscode' to start"
          echo "=========================================="

          exit 0
          POSTINSTEOF

          chmod +x "$DEB_ROOT/DEBIAN/postinst"

          # ============================================================
          # 创建 prerm 脚本
          # ============================================================
          cat > "$DEB_ROOT/DEBIAN/prerm" << 'PRERMEOF'
          #!/bin/bash
          set -e
          echo "=========================================="
          echo "TSCode is being removed..."
          echo "=========================================="
          echo ""
          echo "📁 User data preserved at: ~/.tscode/"
          echo "📦 Extensions preserved at: ~/.tscode/extensions/"
          echo ""
          echo "To completely remove user data:"
          echo "  rm -rf ~/.tscode"
          echo "=========================================="
          exit 0
          PRERMEOF

          chmod +x "$DEB_ROOT/DEBIAN/prerm"

          echo ""
          echo "📌 Building DEB package..."
          fakeroot dpkg-deb -Zgzip -z9 --build "$DEB_ROOT" "tscode-${DEB_VERSION}_${DEB_ARCH}.deb"

          if [ $? -eq 0 ] && [ -f "tscode-${DEB_VERSION}_${DEB_ARCH}.deb" ]; then
            echo ""
            echo "✅ DEB package built successfully!"
            ls -lh "tscode-${DEB_VERSION}_${DEB_ARCH}.deb"
            sha256sum "tscode-${DEB_VERSION}_${DEB_ARCH}.deb" > "tscode-${DEB_VERSION}_${DEB_ARCH}.deb.sha256"
          else
            echo "❌ Failed to build DEB package"
            exit 1
          fi

      - name: 🔍 Verify DEB package extensions
        run: |
          echo "=========================================="
          echo "🔍 Verifying DEB package extensions"
          echo "=========================================="

          VERSION="${{ github.event.inputs.version || '1.116.0' }}"
          DEB_VERSION="${VERSION}-1"
          DEB_ARCH="amd64"
          DEB_FILE="tscode-${DEB_VERSION}_${DEB_ARCH}.deb"

          if [ ! -f "$DEB_FILE" ]; then
            echo "❌ DEB package not found: $DEB_FILE"
            exit 1
          fi

          echo "📦 Extracting DEB package for verification..."
          mkdir -p /tmp/deb-verify
          cd /tmp/deb-verify
          ar x "$GITHUB_WORKSPACE/$DEB_FILE"

          if [ -f "data.tar.xz" ]; then
            tar -xf data.tar.xz
          elif [ -f "data.tar.gz" ]; then
            tar -xf data.tar.gz
          elif [ -f "data.tar" ]; then
            tar -xf data.tar
          else
            echo "❌ No data archive found in DEB package!"
            ls -la
            exit 1
          fi

          echo ""
          echo "📂 Checking extensions in DEB package..."

          EXT_DIR="./opt/tscode/resources/app/extensions"

          if [ ! -d "$EXT_DIR" ]; then
            echo "❌ Extensions directory not found!"
            exit 1
          fi

          echo ""
          echo "🔍 Checking debug extensions in DEB:"
          DEBUG_EXTS="ms-vscode.js-debug ms-vscode.js-debug-companion"
          for ext in $DEBUG_EXTS; do
            if [ -d "$EXT_DIR/$ext" ]; then
              echo "   ✅ $ext"
              if [ -d "$EXT_DIR/$ext/out" ]; then
                echo "      ✅ Compiled (out/)"
              elif [ -d "$EXT_DIR/$ext/dist" ]; then
                echo "      ✅ Compiled (dist/)"
              elif [ -d "$EXT_DIR/$ext/src" ]; then
                echo "      ℹ️ Runtime compilation (src/)"
              else
                echo "      ⚠️ No source or compiled output"
              fi
            else
              echo "   ❌ $ext not found"
            fi
          done

          echo ""
          echo "🔍 Checking @vscode/debug packages in DEB:"
          NODE_MODULES="./opt/tscode/resources/app/node_modules"
          for pkg in "@vscode/debug" "@vscode/debugadapter" "@vscode/debugprotocol"; do
            if [ -d "$NODE_MODULES/$pkg" ]; then
              echo "   ✅ $pkg"
            else
              echo "   ⚠️ $pkg not found"
            fi
          done

          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/deb-verify

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tscode-debian10-deb
          path: |
            *.deb
            *.deb.sha256
          retention-days: 30

      - name: 📊 Build summary
        if: always()
        run: |
          echo "=========================================="
          echo "📊 BUILD SUMMARY"
          echo "=========================================="
          echo "Status: ${{ job.status }}"
          echo "Version: ${{ github.event.inputs.version || '1.116.0' }}"
          echo "Format: DEB (Debian 10)"
          echo ""
          echo "✅ Features:"
          echo "   - No password required on startup"
          echo "   - No sandbox password prompt"
          echo "   - Desktop entry in application menu"
          echo "   - /usr/bin/tscode is a wrapper script"
          echo "   - ✅ Debug extensions included"
          echo "   - ✅ @vscode/debug packages included"
          echo "   - ✅ argv.json auto-created in ~/.tscode/"
          echo "   - ✅ ~/.tscode/ contains extensions/ and argv.json"
          echo "   - ✅ node-pty replaced with official version"
          echo ""
          echo "📂 Directory structure:"
          echo "   System extensions: /opt/tscode/resources/app/extensions/"
          echo "   User directory:    ~/.tscode/"
          echo "     ├── extensions/  (user extensions)"
          echo "     └── argv.json    (configuration)"
          echo ""
          echo "💡 Extensions persist across reinstallation"
          echo "==========================================="

          if [ "${{ job.status }}" = "success" ]; then
            echo ""
            echo "✅ Build completed successfully!"
            echo ""
            echo "📦 DEB Package:"
            ls -lh *.deb 2>/dev/null || echo "   No DEB package found"
            echo ""
            echo "📖 Installation:"
            echo "  sudo dpkg -i tscode-*.deb"
            echo "  sudo apt-get install -f"
            echo ""
            echo "🚀 After installation:"
            echo "  - Run: tscode (no password)"
            echo "  - Find in application menu: TSCode"
            echo "  - Config: ~/.tscode/argv.json"
            echo "=========================================="
          fi