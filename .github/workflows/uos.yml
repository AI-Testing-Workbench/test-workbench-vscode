              echo ""
              echo "❌❌❌ $FAILED check(s) FAILED! ExtensionHost may not work properly."
              echo ""
              echo "   🔧 Common issues:"
              if [ ${#MISSING_EXTS[@]} -gt 0 ]; then
                  echo "      - Missing critical extensions: ${MISSING_EXTS[*]}"
              fi
              if [ $BINARY_ISSUES -gt 0 ]; then
                  echo "      - Binary permission issues"
              fi
              echo ""
              echo "   📝 Check the logs above for details"
              exit 1
          fi

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tscode-debian10-deb
          path: |
            *.deb
            *.deb.sha256
          retention-days: 30

      - name: 📊 Build summary
        if: always()
        run: |
          echo "=========================================="
          echo "📊 BUILD SUMMARY"
          echo "=========================================="
          echo "Status: ${{ job.status }}"
          echo "Version: ${{ github.event.inputs.version || '1.116.0' }}"
          echo "Format: DEB (Debian 10)"
          echo ""
          echo "✅ Features:"
          echo "   - No password required on startup"
          echo "   - No sandbox password prompt"
          echo "   - Desktop entry in application menu"
          echo "   - Extension host fully functional"
          echo "==========================================="
          if [ "${{ job.status }}" = "success" ]; then
            echo ""
            echo "✅ Build completed successfully!"
            ls -lh *.deb 2>/dev/null || echo "   No DEB package found"
            echo ""
            echo "📖 Installation:"
            echo "  sudo dpkg -i tscode-*.deb"
            echo "  sudo apt-get install -f"
            echo ""
            echo "🚀 After installation:"
            echo "  - Run: tscode (no password)"
            echo "  - Find in application menu: TSCode"
            echo "=========================================="
          fi