name: Build for Debian 10

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'feature/uos-workflow'
      version:
        description: 'Package version'
        required: false
        default: '1.116.0'
      custom_extension_repo:
        description: 'Custom extension repository (optional)'
        required: false
        default: 'https://github.com/AI-Testing-Workbench/test-workbench-vsix.git'
      custom_extension_branch:
        description: 'Custom extension branch'
        required: false
        default: 'feature/uos-workflow'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libgtk-3-dev libxkbfile-dev \
            libkrb5-dev libgbm-dev rpm libx11-dev libxss-dev libxtst-dev \
            libnss3-dev libasound2-dev libglib2.0-dev libcairo2-dev \
            libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev \
            python3 git wget curl tree xz-utils \
            dpkg-dev fakeroot lintian rsync jq

      - name: 🔧 Fix TypeScript scripts
        run: |
          echo 'console.log("Preinstall OK");' > build/npm/preinstall.js
          sed -i 's/"preinstall": "node build\/npm\/preinstall.ts"/"preinstall": "node build\/npm\/preinstall.js"/' package.json
          echo 'console.log("Postinstall OK");' > build/npm/postinstall.js
          sed -i 's/"postinstall": "node build\/npm\/postinstall.ts"/"postinstall": "node build\/npm\/postinstall.js"/' package.json

      - name: 📦 Install dependencies
        run: |
          echo "=========================================="
          echo "📦 Installing dependencies"
          echo "=========================================="
          npm install --legacy-peer-deps

      - name: 📦 Install build tools
        run: |
          echo "=========================================="
          echo "📦 Installing build tools"
          echo "=========================================="

          npm install -g tsx

          npm install --legacy-peer-deps \
            ternary-stream \
            vscode-gulp-watch \
            esbuild \
            jsonc-parser \
            gulp-merge-json \
            gulp-tsb \
            gulp-sourcemaps \
            gulp-filter \
            gulp-rename \
            gulp-sort \
            gulp \
            vinyl \
            vinyl-fs \
            del \
            fs-extra \
            glob \
            minimatch \
            semver \
            @vscode/ripgrep \
            through2 \
            merge-stream \
            event-stream \
            2>/dev/null || true

      # ============================================================
      # 修复所有扩展相关文件 - 一次性完成
      # ============================================================
      - name: 🔧 Fix all extension build files
        run: |
          echo "=========================================="
          echo "🔧 Fixing all extension build files"
          echo "=========================================="

          # 1. 创建 builtInExtensions.ts
          cat > build/lib/builtInExtensions.ts << 'BUILTIN_EOF'
          /*---------------------------------------------------------------------------------------------
           *  Copyright (c) Microsoft Corporation. All rights reserved.
           *  Licensed under the MIT License. See License.txt in the project root for license information.
           *--------------------------------------------------------------------------------------------*/

          import { Stream, Readable } from 'stream';

          export const builtInExtensions: any[] = [];
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions: any[] = [];
          export const shouldDownloadWebBuiltInExtensions = false;

          function createEmptyStream(): Stream {
              const s = new Readable();
              s._read = () => s.push(null);
              return s;
          }

          export function getExtensionStream(): Stream { return createEmptyStream(); }
          export function getExtensionDownloadStream(): Stream { return createEmptyStream(); }
          export function packageMarketplaceExtensionsStream(): Stream { return createEmptyStream(); }
          export function packageNativeLocalExtensionsStream(): Stream { return createEmptyStream(); }
          export function packageNonNativeLocalExtensionsStream(): Stream { return createEmptyStream(); }
          export function packageLocalExtensionsStream(): Stream { return createEmptyStream(); }
          export function packageExtensionsStream(): Stream { return createEmptyStream(); }
          export function packageCopilotExtensionStream(): Stream { return createEmptyStream(); }
          export function packageCopilotChatExtensionStream(): Stream { return createEmptyStream(); }
          export function packageCopilotAgentsExtensionStream(): Stream { return createEmptyStream(); }
          export function getNativeLocalExtensionStream(): Stream { return createEmptyStream(); }
          export function getLocalExtensionStream(): Stream { return createEmptyStream(); }
          export function getMarketplaceExtensionStream(): Stream { return createEmptyStream(); }

          export function fromMarketplace(): any[] { return []; }

          export async function fetchUrls(urls: string[], options: any): Promise<void> {
              console.log(`fetchUrls: Skipping ${urls.length} URLs (UOS build)`);
              return Promise.resolve();
          }

          export function buildExtensionMedia(): void {}
          export function compileExtensionMedia(): void {}
          export function buildExtensionMediaTask(done: any): void { done(); }

          export const isWebExtension = false;
          export const builtInExtensionsProd = [];
          export const shouldDownloadBuiltInExtensionsProd = false;
          BUILTIN_EOF

          echo "✅ builtInExtensions.ts created"

          # 2. 创建 extensions.ts - 完全重写，无语法错误
          cat > build/lib/extensions.ts << 'EXTENSIONS_EOF'
          /*---------------------------------------------------------------------------------------------
           *  Copyright (c) Microsoft Corporation. All rights reserved.
           *  Licensed under the MIT License. See License.txt in the project root for license information.
           *--------------------------------------------------------------------------------------------*/

          import { Stream, Readable } from 'stream';

          // ============================================================
          // UOS 构建版本 - 所有扩展函数返回空流
          // ============================================================

          function createEmptyStream(): Stream {
              const s = new Readable();
              s._read = () => s.push(null);
              return s;
          }

          // 内置扩展列表
          export const builtInExtensions: any[] = [];
          export const shouldDownloadBuiltInExtensions = false;
          export const webBuiltInExtensions: any[] = [];
          export const shouldDownloadWebBuiltInExtensions = false;

          // 所有扩展流函数
          export function getExtensionStream(): Stream {
              return createEmptyStream();
          }

          export function getExtensionDownloadStream(): Stream {
              return createEmptyStream();
          }

          export function packageMarketplaceExtensionsStream(): Stream {
              return createEmptyStream();
          }

          export function packageNativeLocalExtensionsStream(): Stream {
              return createEmptyStream();
          }

          export function packageNonNativeLocalExtensionsStream(): Stream {
              return createEmptyStream();
          }

          export function packageLocalExtensionsStream(): Stream {
              return createEmptyStream();
          }

          export function packageExtensionsStream(): Stream {
              return createEmptyStream();
          }

          export function packageCopilotExtensionStream(): Stream {
              return createEmptyStream();
          }

          export function packageCopilotChatExtensionStream(): Stream {
              return createEmptyStream();
          }

          export function packageCopilotAgentsExtensionStream(): Stream {
              return createEmptyStream();
          }

          export function getNativeLocalExtensionStream(): Stream {
              return createEmptyStream();
          }

          export function getLocalExtensionStream(): Stream {
              return createEmptyStream();
          }

          export function getMarketplaceExtensionStream(): Stream {
              return createEmptyStream();
          }

          export function fromMarketplace(): any[] {
              return [];
          }

          export async function fetchUrls(urls: string[], options: any): Promise<void> {
              console.log(`fetchUrls: Skipping ${urls.length} URLs (UOS build)`);
              return Promise.resolve();
          }

          export function buildExtensionMedia(): void {
              // 空操作
          }

          export function compileExtensionMedia(): void {
              // 空操作
          }

          export function buildExtensionMediaTask(done: any): void {
              done();
          }

          export const isWebExtension = false;
          export const builtInExtensionsProd = [];
          export const shouldDownloadBuiltInExtensionsProd = false;

          // 额外的导出
          export function scanBuiltinExtensions(): any[] {
              return [];
          }

          export function getExtensionGalleryResources(): any {
              return { extensions: [] };
          }

          export function packageExtension(): Stream {
              return createEmptyStream();
          }

          export function packageLocalExtension(): Stream {
              return createEmptyStream();
          }

          export const localExtensions: any[] = [];
          export const marketplaceExtensions: any[] = [];
          export const nonNativeLocalExtensions: any[] = [];

          console.log('✅ extensions.ts loaded (UOS build)');
          EXTENSIONS_EOF

          echo "✅ extensions.ts created"

          # 3. 修改 gulpfile.extensions.ts
          if [ -f "build/gulpfile.extensions.ts" ]; then
              python3 << 'PYTHON_SCRIPT'
          import re

          with open('build/gulpfile.extensions.ts', 'r') as f:
              content = f.read()

          # 替换 packageVsix 函数
          content = re.sub(
              r'function\s+packageVsix\s*\([^)]*\)\s*\{[^}]*\}',
              'function packageVsix() { console.log("packageVsix skipped for UOS build"); return Promise.resolve(); }',
              content,
              flags=re.DOTALL
          )

          # 注释掉 vsce 导入
          content = re.sub(
              r'import\s*\{?\s*vsce\s*\}?\s*from\s*["\']@vscode/vsce["\']',
              '// vsce import disabled for UOS build',
              content
          )

          with open('build/gulpfile.extensions.ts', 'w') as f:
              f.write(content)

          print("✅ gulpfile.extensions.ts patched")
          PYTHON_SCRIPT
          fi

      - name: 🔧 Fix gulpfile spawn calls
        run: |
          python3 << 'PY_END'
          import re
          import os

          for file in ['build/gulpfile.vscode.ts', 'build/gulpfile.extensions.ts', 'build/gulpfile.ts']:
              if os.path.exists(file):
                  with open(file, 'r') as f:
                      content = f.read()
                  content = re.sub(r"spawn\('node'", "spawn('tsx'", content)
                  content = re.sub(r'spawn\("node"', 'spawn("tsx"', content)
                  content = re.sub(r"spawn\(process\.execPath", "spawn('tsx'", content)
                  with open(file, 'w') as f:
                      f.write(content)
                  print(f"✅ spawn calls fixed in {os.path.basename(file)}")
          PY_END

      - name: 🔧 Replace copilot.ts
        run: |
          cat > build/lib/copilot.ts << 'EOF'
          /*---------------------------------------------------------------------------------------------
           *  Copyright (c) Microsoft Corporation. All rights reserved.
           *  Licensed under the MIT License. See License.txt in the project root for license information.
           *--------------------------------------------------------------------------------------------*/

          export async function prepareBuiltInCopilotExtensionShims(extRoot: string): Promise<void> {
              console.log('Copilot extension shims preparation skipped for UOS build');
              return;
          }

          export function copyCopilotNativeDeps(productRoot: string): void {
              console.log('Copilot native deps copy skipped for UOS build');
          }

          export function getCopilotExcludeFilter(): any {
              return function() { return false; };
          }
          EOF

      - name: 🔧 Disable Crashpad
        run: |
          echo "Disabling Crashpad"
          python3 << 'PY_JSON_END'
          import json
          import os
          if os.path.exists('product.json'):
              with open('product.json', 'r') as f:
                  data = json.load(f)
              data['enableCrashReport'] = False
              if 'crashReporter' not in data:
                  data['crashReporter'] = {}
              data['crashReporter']['disabled'] = True
              with open('product.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print("✅ product.json modified")
          PY_JSON_END

          mkdir -p src/vs/platform/crash/common
          cat > src/vs/platform/crash/common/crashService.ts << 'CRASH_EOF'
          /*---------------------------------------------------------------------------------------------
           *  Copyright (c) Microsoft Corporation. All rights reserved.
           *  Licensed under the MIT License. See License.txt in the project root for license information.
           *--------------------------------------------------------------------------------------------*/
          import { createDecorator } from '../../../base/common/instantiation.js';
          export const ICrashService = createDecorator<ICrashService>('crashService');
          export interface ICrashService { _serviceBrand: undefined; }
          export class CrashService implements ICrashService {
              declare readonly _serviceBrand: undefined;
              constructor() { console.log('Crash service disabled for UOS build'); }
          }
          CRASH_EOF

      - name: ⚙️ Set env
        run: |
          echo "VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_ELECTRON_SKIP_DOWNLOAD=1" >> $GITHUB_ENV
          echo "VSCODE_SKIP_PRELAUNCH=1" >> $GITHUB_ENV
          echo "VSCODE_SKIP_BUNDLED_EXTENSIONS=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTER=1" >> $GITHUB_ENV
          echo "ELECTRON_DISABLE_CRASH_REPORTING=1" >> $GITHUB_ENV
          echo "VSCODE_SKIP_VSIX_PACKAGING=1" >> $GITHUB_ENV

      - name: 🔨 Build VSCode
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          export VSCODE_SKIP_BUILTIN_EXTENSION_DOWNLOAD=1
          export VSCODE_ELECTRON_SKIP_DOWNLOAD=1
          export VSCODE_SKIP_PRELAUNCH=1
          export VSCODE_SKIP_BUNDLED_EXTENSIONS=1
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          export VSCODE_SKIP_VSIX_PACKAGING=1
          echo "Start: $(date)"
          npx tsx node_modules/gulp/bin/gulp.js vscode-linux-x64 --no-color
          echo "Done: $(date)"

      - name: 🔍 Verify build contents
        run: |
          echo "=========================================="
          echo "🔍 Verify build contents"
          echo "=========================================="

          BUILD_DIR=""
          for dir in "./VSCode-linux-x64" "./vscode/VSCode-linux-x64" "../VSCode-linux-x64"; do
            if [ -d "$dir" ]; then
              BUILD_DIR="$dir"
              echo "Found build directory: $BUILD_DIR"
              break
            fi
          done

          if [ -z "$BUILD_DIR" ]; then
            echo "Build directory not found!"
            exit 1
          fi

          TARGET_DIR="./tscode"
          if [ "$BUILD_DIR" != "$TARGET_DIR" ]; then
            echo "Renaming $BUILD_DIR to $TARGET_DIR"
            rm -rf "$TARGET_DIR"
            mv "$BUILD_DIR" "$TARGET_DIR"
          fi
          BUILD_DIR="$TARGET_DIR"
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

          echo "Initial build size:"
          du -sh "$BUILD_DIR"

      - name: 📦 Copy node_modules to resources/app
        run: |
          echo "=========================================="
          echo "📦 Copy node_modules to resources/app"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          if [ ! -d "./node_modules" ]; then
            echo "❌ node_modules not found in root!"
            echo "Installing node_modules..."
            npm install --legacy-peer-deps
          fi

          echo "📌 Copying node_modules to $BUILD_DIR/resources/app/"
          rm -rf "$BUILD_DIR/resources/app/node_modules"
          cp -r ./node_modules "$BUILD_DIR/resources/app/"

          echo "✅ node_modules copied"

      - name: 🔥 Replace native modules and copy official extensions
        run: |
          set +e

          echo "=========================================="
          echo "🔥 Replacing native modules & copying official extensions"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          VERSION="${{ github.event.inputs.version || '1.116.0' }}"

          echo ""
          echo "📌 Step 1: Downloading official VSCode $VERSION..."

          rm -rf /tmp/official-vscode
          rm -f /tmp/official.tar.gz

          wget -q --show-progress "https://update.code.visualstudio.com/$VERSION/linux-x64/stable" -O /tmp/official.tar.gz

          if [ $? -ne 0 ] || [ ! -s /tmp/official.tar.gz ]; then
            echo "⚠️ Failed to download $VERSION, trying latest..."
            wget -q --show-progress https://update.code.visualstudio.com/latest/linux-x64/stable -O /tmp/official.tar.gz
            if [ $? -ne 0 ] || [ ! -s /tmp/official.tar.gz ]; then
              echo "❌ Failed to download official VSCode!"
              exit 1
            fi
          fi

          echo "📌 Extracting official VSCode..."
          mkdir -p /tmp/official-vscode
          tar -xzf /tmp/official.tar.gz -C /tmp/official-vscode/

          OFFICIAL_DIR=""
          for dir in "/tmp/official-vscode/VSCode-linux-x64" "/tmp/official-vscode/vscode/VSCode-linux-x64"; do
            if [ -d "$dir" ]; then
              OFFICIAL_DIR="$dir"
              break
            fi
          done

          if [ -z "$OFFICIAL_DIR" ]; then
            OFFICIAL_DIR=$(find /tmp/official-vscode -type d -name "VSCode-linux-x64" 2>/dev/null | head -1)
          fi

          if [ -z "$OFFICIAL_DIR" ] || [ ! -d "$OFFICIAL_DIR" ]; then
            echo "❌ Could not find official VSCode directory!"
            ls -la /tmp/official-vscode/
            exit 1
          fi

          echo "✅ Official VSCode found at: $OFFICIAL_DIR"

          echo ""
          echo "📌 Step 2: Copying official extensions..."

          mkdir -p "$BUILD_DIR/resources/app/extensions"
          OFFICIAL_EXT_DIR="$OFFICIAL_DIR/resources/app/extensions"

          if [ ! -d "$OFFICIAL_EXT_DIR" ]; then
            echo "❌ Official extensions directory not found!"
            exit 1
          fi

          find "$OFFICIAL_EXT_DIR" -maxdepth 1 -type d ! -path "$OFFICIAL_EXT_DIR" -exec basename {} \; | while read ext_name; do
            if [ ! -d "$BUILD_DIR/resources/app/extensions/$ext_name" ]; then
              echo "  Copying: $ext_name"
              rsync -a --no-owner --no-group "$OFFICIAL_EXT_DIR/$ext_name/" "$BUILD_DIR/resources/app/extensions/$ext_name/" 2>/dev/null
            fi
          done

          echo "✅ Extensions copied"

          rm -f /tmp/official.tar.gz
          rm -rf /tmp/official-vscode

          set -e

      - name: 📦 Download and prepare custom extensions
        run: |
          echo "=========================================="
          echo "📦 Downloading and preparing custom extensions"
          echo "=========================================="

          CUSTOM_REPO="${{ github.event.inputs.custom_extension_repo }}"
          CUSTOM_BRANCH="${{ github.event.inputs.custom_extension_branch || 'feature/uos-workflow' }}"

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          mkdir -p "$BUILD_DIR/resources/app/custom-extensions"

          if [ -n "$CUSTOM_REPO" ] && [ "$CUSTOM_REPO" != "null" ]; then
            echo "📌 Cloning custom extension from: $CUSTOM_REPO"
            rm -rf /tmp/custom-ext-temp
            git clone --depth 1 --branch "$CUSTOM_BRANCH" "$CUSTOM_REPO" /tmp/custom-ext-temp 2>/dev/null || true

            if [ -d "/tmp/custom-ext-temp" ] && [ "$(ls -A /tmp/custom-ext-temp 2>/dev/null)" ]; then
              find /tmp/custom-ext-temp -name "*.vsix" -type f 2>/dev/null | while read vsix_file; do
                vsix_name=$(basename "$vsix_file" .vsix)
                if [[ "$vsix_name" == *"darwin"* ]] || [[ "$vsix_name" == *"win32"* ]]; then
                  echo "  ⏭️ Skipping non-Linux: $vsix_name"
                  continue
                fi
                echo "  📌 Extracting: $vsix_name"
                mkdir -p /tmp/extract-vsix-$vsix_name
                unzip -q "$vsix_file" -d /tmp/extract-vsix-$vsix_name 2>/dev/null
                if [ -d "/tmp/extract-vsix-$vsix_name/extension" ]; then
                  mkdir -p "$BUILD_DIR/resources/app/custom-extensions/$vsix_name"
                  cp -r /tmp/extract-vsix-$vsix_name/extension/* "$BUILD_DIR/resources/app/custom-extensions/$vsix_name/"
                elif [ -f "/tmp/extract-vsix-$vsix_name/package.json" ]; then
                  mkdir -p "$BUILD_DIR/resources/app/custom-extensions/$vsix_name"
                  cp -r /tmp/extract-vsix-$vsix_name/* "$BUILD_DIR/resources/app/custom-extensions/$vsix_name/"
                fi
                rm -rf /tmp/extract-vsix-$vsix_name
              done
              rm -rf /tmp/custom-ext-temp
            fi
          fi

      - name: 🧹 Deep cleanup
        run: |
          echo "=========================================="
          echo "🧹 Deep cleanup"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          # 移除不需要的扩展
          rm -rf "$BUILD_DIR/resources/app/extensions/copilot" 2>/dev/null || true
          rm -rf "$BUILD_DIR/resources/app/extensions"/testagent-nodejs-tscode-darwin-arm64 2>/dev/null || true
          rm -rf "$BUILD_DIR/resources/app/extensions"/testagent-nodejs-tscode-win32-x64 2>/dev/null || true

          # 清理扩展源代码
          find "$BUILD_DIR/resources/app/extensions" -name "*.ts" -type f ! -name "*.d.ts" -delete 2>/dev/null || true
          find "$BUILD_DIR/resources/app/extensions" -name "*.map" -type f -delete 2>/dev/null || true
          find "$BUILD_DIR/resources/app/extensions" -type d -name "src" -exec rm -rf {} + 2>/dev/null || true
          find "$BUILD_DIR/resources/app/extensions" -type d -name "test" -exec rm -rf {} + 2>/dev/null || true

      - name: 📄 Create launcher
        run: |
          echo "=========================================="
          echo "📄 Creating launcher"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          cd "$BUILD_DIR"

          [ -f "resources/app/package.json" ] && cp "resources/app/package.json" .
          [ -f "resources/app/product.json" ] && cp "resources/app/product.json" .

          REAL_EXEC=""
          for name in code code-oss; do
            if [ -f "./$name" ]; then
              REAL_EXEC="$name"
              break
            fi
          done

          if [ -z "$REAL_EXEC" ]; then
            REAL_EXEC=$(find . -maxdepth 1 -type f -executable ! -name "*.so" ! -name "*.sh" ! -name "chrome-*" 2>/dev/null | head -1 | sed 's|^\./||')
          fi

          if [ -z "$REAL_EXEC" ]; then
            echo "❌ No executable found!"
            exit 1
          fi

          [ "$REAL_EXEC" != "tscode" ] && mv "$REAL_EXEC" "tscode"

          cat > run.sh << 'RUNEOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export ELECTRON_ENABLE_GPU=0
          export LIBGL_ALWAYS_SOFTWARE=1
          export NODE_OPTIONS="--max-old-space-size=4096"
          export ELECTRON_DISABLE_SANDBOX=1
          export GDK_BACKEND=x11
          export QT_QPA_PLATFORM=xcb
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          export CRASHPAD_DISABLE=1
          export GNOME_KEYRING_CONTROL=
          export DBUS_SESSION_BUS_ADDRESS=
          export PYTHON_KEYRING_BACKEND=keyring.backends.null.Keyring
          export SECRETS_BACKEND=basic
          export DISABLE_VAULT=1
          export VSCODE_PASSWORD_STORE=basic
          export ELECTRON_PASSWORD_STORE=basic
          export VSCODE_APPDATA="$HOME/.local/share/tscode"
          export VSCODE_EXTENSIONS_DIR="$HOME/.tscode/extensions"
          mkdir -p "$VSCODE_APPDATA" 2>/dev/null || true
          mkdir -p "$VSCODE_EXTENSIONS_DIR" 2>/dev/null || true
          export VSCODE_SYSTEM_EXTENSIONS="$SCRIPT_DIR/resources/app/extensions"
          exec "$SCRIPT_DIR/tscode" \
              --no-sandbox \
              --disable-gpu-sandbox \
              --disable-gpu \
              --disable-crash-reporter \
              --password-store="basic" \
              --extensions-dir="$VSCODE_EXTENSIONS_DIR" \
              --user-data-dir="$VSCODE_APPDATA" \
              --builtin-extensions-dir="$VSCODE_SYSTEM_EXTENSIONS" \
              "$@"
          RUNEOF

          chmod +x run.sh
          chmod +x tscode
          chmod +x chrome-sandbox 2>/dev/null || true

      - name: 📦 Build DEB package
        run: |
          echo "=========================================="
          echo "📦 Building DEB package"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          VERSION="${{ github.event.inputs.version || '1.116.0' }}"
          DEB_VERSION="${VERSION}-1"
          DEB_ARCH="amd64"
          DEB_ROOT="$(pwd)/deb_root"

          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/opt/tscode"
          mkdir -p "$DEB_ROOT/usr/bin"
          mkdir -p "$DEB_ROOT/usr/share/applications"
          mkdir -p "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps"

          cp -r "$BUILD_DIR"/* "$DEB_ROOT/opt/tscode/"

          if [ -f "$DEB_ROOT/opt/tscode/chrome-sandbox" ]; then
            sudo chown root:root "$DEB_ROOT/opt/tscode/chrome-sandbox"
            sudo chmod 4755 "$DEB_ROOT/opt/tscode/chrome-sandbox"
          fi

          chmod +x "$DEB_ROOT/opt/tscode/tscode" 2>/dev/null || true
          chmod +x "$DEB_ROOT/opt/tscode/run.sh" 2>/dev/null || true

          cat > "$DEB_ROOT/usr/bin/tscode" << 'WRAPEOF'
          #!/bin/bash
