name: Build for UOS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch of release.yml to pull the linux artifact from'
        required: false
        default: 'main'
  workflow_run:
    workflows: ["Release Build"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🔎 Find release.yml run with linux artifact
        id: find-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          RUN_ID=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            echo "🤖 Auto-triggered by Release Build run: $RUN_ID (branch: $HEAD_BRANCH, conclusion: $CONCLUSION)"

            if [ "$CONCLUSION" != "success" ]; then
              echo "ℹ️ Skipping: triggering release.yml run did not succeed ($CONCLUSION)."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$HEAD_BRANCH" != "main" ]; then
              echo "ℹ️ Skipping: only auto-package release builds on 'main' branch (got '$HEAD_BRANCH')."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            FOUND=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="vscode-linux-x64") | .id' | head -1)
            if [ -z "$FOUND" ]; then
              echo "ℹ️ Skipping: release.yml run $RUN_ID has no 'vscode-linux-x64' artifact (platforms did not include linux)."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "✅ Found vscode-linux-x64 artifact in release.yml run: $RUN_ID"
          else
            BRANCH="${{ github.event.inputs.branch || 'main' }}"
            for candidate in $(gh run list --workflow release.yml --branch "$BRANCH" --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
              FOUND=$(gh api "repos/$GH_REPO/actions/runs/$candidate/artifacts" --jq '.artifacts[] | select(.name=="vscode-linux-x64") | .id' | head -1)
              if [ -n "$FOUND" ]; then
                RUN_ID="$candidate"
                break
              fi
            done
            if [ -z "$RUN_ID" ]; then
              echo "❌ No recent successful release.yml run on branch '$BRANCH' contains the 'vscode-linux-x64' artifact."
              echo "   Please run the Release Build workflow with platforms: linux or all first."
              exit 1
            fi
            echo "✅ Found vscode-linux-x64 artifact in release.yml run: $RUN_ID"
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: ⬇️ Download linux artifact
        if: steps.find-artifact.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: vscode-linux-x64
          run-id: ${{ steps.find-artifact.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/artifact

      - name: 📦 Extract and setup build directory
        if: steps.find-artifact.outputs.run-id != ''
        run: |
          set -e
          TARBALL=$(find /tmp/artifact -name "VSCode-linux-x64.tar.gz" | head -1)
          if [ -z "$TARBALL" ]; then
            echo "❌ VSCode-linux-x64.tar.gz not found in /tmp/artifact!"
            find /tmp/artifact -maxdepth 3 | head -20
            exit 1
          fi
          mkdir -p /tmp/extract
          tar -xzf "$TARBALL" -C /tmp/extract/

          SRC_DIR=""
          for d in /tmp/extract/VSCode-linux-x64 /tmp/extract/vscode/VSCode-linux-x64; do
            if [ -d "$d" ]; then
              SRC_DIR="$d"
              break
            fi
          done
          if [ -z "$SRC_DIR" ]; then
            echo "❌ VSCode-linux-x64 directory not found in artifact!"
            ls -la /tmp/extract/
            exit 1
          fi

          rm -rf ./tscode
          mv "$SRC_DIR" ./tscode
          echo "BUILD_DIR=./tscode" >> "$GITHUB_ENV"

          VERSION=$(node -p "require('./tscode/resources/app/package.json').version" 2>/dev/null || echo '1.116.0')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "✅ Build dir: ./tscode (version $VERSION)"
          du -sh ./tscode

      - name: 📄 Create launcher and fix all issues
        if: steps.find-artifact.outputs.run-id != ''
        run: |
          echo "=========================================="
          echo "📄 Creating launcher and fixing all issues"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          cd "$BUILD_DIR"

          [ -f "resources/app/package.json" ] && cp "resources/app/package.json" . && echo "✅ package.json"
          [ -f "resources/app/product.json" ] && cp "resources/app/product.json" . && echo "✅ product.json"

          REAL_EXEC=""
          for name in tscode code code-oss; do
            if [ -f "./$name" ]; then
              REAL_EXEC="$name"
              break
            fi
          done

          if [ -z "$REAL_EXEC" ]; then
            REAL_EXEC=$(find . -maxdepth 1 -type f -executable ! -name "*.so" ! -name "*.sh" ! -name "chrome-*" 2>/dev/null | head -1 | sed 's|^\./||')
          fi

          if [ -z "$REAL_EXEC" ]; then
            echo "❌ No executable found!"
            exit 1
          fi

          echo "✅ Found executable: $REAL_EXEC"

          if [ "$REAL_EXEC" != "tscode" ]; then
            mv "$REAL_EXEC" "tscode"
            echo "✅ Renamed to tscode"
          else
            echo "✅ Already named tscode"
          fi

          echo ""
          echo "📌 Creating startup wrapper script (run.sh)..."

          cat > run.sh << 'RUNEOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          export ELECTRON_ENABLE_GPU=0
          export LIBGL_ALWAYS_SOFTWARE=1
          export NODE_OPTIONS="--max-old-space-size=4096"
          export ELECTRON_DISABLE_SANDBOX=1
          export GDK_BACKEND=x11
          export QT_QPA_PLATFORM=xcb
          export ELECTRON_DISABLE_CRASH_REPORTER=1
          export ELECTRON_DISABLE_CRASH_REPORTING=1
          export CRASHPAD_DISABLE=1

          # 保留系统 D-Bus（GitHub OAuth 需要）
          # 不要设置 DBUS_SESSION_BUS_ADDRESS=""

          # 使用 basic 密码存储，避免密钥环弹窗
          export TSCODE_PASSWORD_STORE=basic
          export TSCODE_USE_FILE_SECRET_STORAGE=1

          # 启用 GitHub 认证
          export TSCODE_GITHUB_AUTHENTICATION=true

          export TSCODE_APPDATA="$HOME/.local/share/tscode"
          export TSCODE_EXTENSIONS_DIR="$HOME/.tscode/extensions"
          mkdir -p "$TSCODE_APPDATA" 2>/dev/null || true
          mkdir -p "$TSCODE_EXTENSIONS_DIR" 2>/dev/null || true

          export TSCODE_SYSTEM_EXTENSIONS="$SCRIPT_DIR/resources/app/extensions"

          # 创建用户设置，启用 GitHub 认证
          mkdir -p "$TSCODE_APPDATA/User"
          cat > "$TSCODE_APPDATA/User/settings.json" << 'SETTINGS_EOF'
          {
              "github.authentication": true,
              "git.githubAuthentication": true,
              "git.enabled": true,
              "workbench.startupEditor": "welcomePage"
          }
          SETTINGS_EOF

          # 创建 GitHub 认证存储
          GITHUB_STORAGE="$TSCODE_APPDATA/User/globalStorage/github-authentication"
          mkdir -p "$GITHUB_STORAGE"
          if [ ! -f "$GITHUB_STORAGE/secrets.json" ]; then
              echo '{}' > "$GITHUB_STORAGE/secrets.json"
          fi

          exec "$SCRIPT_DIR/tscode" \
              --no-sandbox \
              --disable-gpu-sandbox \
              --disable-gpu \
              --disable-crash-reporter \
              --password-store=basic \
              --extensions-dir="$TSCODE_EXTENSIONS_DIR" \
              --user-data-dir="$TSCODE_APPDATA" \
              --builtin-extensions-dir="$TSCODE_SYSTEM_EXTENSIONS" \
              --enable-proposed-api=vscode.github-authentication \
              "$@"
          RUNEOF

          chmod +x run.sh
          echo "   ✅ run.sh created"

          cat > start-tscode.sh << 'STARTEOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$SCRIPT_DIR/run.sh" "$@"
          STARTEOF

          chmod +x start-tscode.sh
          echo "   ✅ start-tscode.sh created"

          chmod +x tscode
          chmod +x chrome-sandbox 2>/dev/null || true

          echo ""
          echo "✅ Launcher and scripts created"

      - name: 📄 Create desktop entry
        if: steps.find-artifact.outputs.run-id != ''
        run: |
          echo "=========================================="
          echo "📄 Creating desktop entry"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          mkdir -p "$BUILD_DIR/usr/share/applications"
          mkdir -p "$BUILD_DIR/usr/share/icons/hicolor/256x256/apps"

          if [ -f "$BUILD_DIR/resources/app/resources/linux/code.png" ]; then
            cp "$BUILD_DIR/resources/app/resources/linux/code.png" \
               "$BUILD_DIR/usr/share/icons/hicolor/256x256/apps/tscode.png"
            echo "   ✅ Icon copied"
          fi

          cat > "$BUILD_DIR/usr/share/applications/tscode.desktop" << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=TSCode
          GenericName=Code Editor
          Comment=Code Editing. Redefined.
          Exec=/opt/tscode/run.sh %F
          Icon=tscode
          Terminal=false
          Categories=Development;IDE;
          MimeType=text/plain;inode/directory;
          StartupNotify=true
          StartupWMClass=Code
          X-GNOME-SingleWindow=false
          EOF

          echo "   ✅ Desktop file created"

      - name: 📄 Create validation script
        if: steps.find-artifact.outputs.run-id != ''
        run: |
          echo "=========================================="
          echo "📄 Creating validation script"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          cat > "$BUILD_DIR/validate.sh" << 'VALIDATE_EOF'
          #!/bin/bash
          echo "=========================================="
          echo "TSCode Validation Script"
          echo "=========================================="

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          PASSED=0
          FAILED=0

          echo ""
          echo "1️⃣ Checking main executable..."
          if [ -x "$SCRIPT_DIR/tscode" ]; then
            echo "   ✅ tscode executable"
            ((PASSED++))
          else
            echo "   ❌ tscode not executable"
            ((FAILED++))
          fi

          echo ""
          echo "2️⃣ Checking run wrapper..."
          if [ -x "$SCRIPT_DIR/run.sh" ]; then
            echo "   ✅ run.sh exists and executable"
            ((PASSED++))
          else
            echo "   ❌ run.sh missing"
            ((FAILED++))
          fi

          echo ""
          echo "3️⃣ Checking start-tscode.sh..."
          if [ -x "$SCRIPT_DIR/start-tscode.sh" ]; then
            echo "   ✅ start-tscode.sh exists"
            ((PASSED++))
          else
            echo "   ❌ start-tscode.sh missing"
            ((FAILED++))
          fi

          echo ""
          echo "4️⃣ Checking desktop file..."
          if [ -f "$SCRIPT_DIR/usr/share/applications/tscode.desktop" ]; then
            echo "   ✅ Desktop file exists"
            ((PASSED++))
          else
            echo "   ❌ Desktop file missing"
            ((FAILED++))
          fi

          echo ""
          echo "5️⃣ Checking icon..."
          if [ -f "$SCRIPT_DIR/usr/share/icons/hicolor/256x256/apps/tscode.png" ]; then
            echo "   ✅ Icon exists"
            ((PASSED++))
          else
            echo "   ⚠️ Icon missing"
          fi

          echo ""
          echo "6️⃣ Checking Chrome sandbox..."
          if [ -f "$SCRIPT_DIR/chrome-sandbox" ]; then
            PERMS=$(stat -c %a "$SCRIPT_DIR/chrome-sandbox" 2>/dev/null || echo "000")
            if [ "$PERMS" = "4755" ]; then
              echo "   ✅ chrome-sandbox SUID: 4755"
              ((PASSED++))
            else
              echo "   ⚠️ chrome-sandbox permissions: $PERMS"
            fi
          else
            echo "   ⚠️ chrome-sandbox not found"
          fi

          echo ""
          echo "7️⃣ Checking core extensions..."
          for ext in typescript-language-features git json-language-features; do
            if [ -d "$SCRIPT_DIR/resources/app/extensions/$ext" ]; then
              echo "   ✅ $ext (system)"
              ((PASSED++))
            else
              echo "   ❌ $ext (missing)"
              ((FAILED++))
            fi
          done

          echo ""
          echo "8️⃣ Checking debug extensions..."

          # 检查 extensions 目录中的调试扩展
          DEBUG_EXTS=$(find "$SCRIPT_DIR/resources/app/extensions" -maxdepth 1 -type d -name "*debug*" 2>/dev/null)
          DEBUG_COUNT=$(echo "$DEBUG_EXTS" | grep -v "^$" | wc -l)

          if [ $DEBUG_COUNT -gt 0 ]; then
            echo "   ✅ Found $DEBUG_COUNT debug extension(s):"
            echo "$DEBUG_EXTS" | while read -r ext; do
              echo "      - $(basename "$ext")"
            done
            ((PASSED++))
          else
            echo "   ℹ️ No debug extensions found"
            echo "   (extensionHost debugging uses built-in VSCode support)"
          fi

          echo ""
          echo "=========================================="
          echo "Validation Results:"
          echo "   ✅ Passed: $PASSED"
          echo "   ❌ Failed: $FAILED"
          echo "=========================================="

          if [ $FAILED -eq 0 ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed."
            exit 1
          fi
          VALIDATE_EOF

          chmod +x "$BUILD_DIR/validate.sh"
          echo "✅ Validation script created"

      - name: 🔍 Run validation
        if: steps.find-artifact.outputs.run-id != ''
        run: |
          echo "=========================================="
          echo "🔍 Running validation"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"

          if ! "$BUILD_DIR/validate.sh"; then
            echo "❌ Validation failed!"
            exit 1
          fi

          echo "✅ Validation passed!"

      - name: 📦 Build DEB package
        if: steps.find-artifact.outputs.run-id != ''
        run: |
          echo "=========================================="
          echo "📦 Building DEB package for Debian 10"
          echo "=========================================="

          BUILD_DIR="${BUILD_DIR:-./tscode}"
          VERSION="${VERSION:-1.116.0}"
          DEB_VERSION="${VERSION}-1"
          DEB_ARCH="amd64"
          DEB_ROOT="$(pwd)/deb_root"

          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/opt/tscode"
          mkdir -p "$DEB_ROOT/usr/bin"
          mkdir -p "$DEB_ROOT/usr/share/applications"
          mkdir -p "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps"

          echo "📌 Copying application to /opt/tscode..."
          cp -r "$BUILD_DIR"/* "$DEB_ROOT/opt/tscode/"

          echo ""
          echo "📌 Fixing all permissions..."

          if [ -f "$DEB_ROOT/opt/tscode/chrome-sandbox" ]; then
            sudo chown root:root "$DEB_ROOT/opt/tscode/chrome-sandbox"
            sudo chmod 4755 "$DEB_ROOT/opt/tscode/chrome-sandbox"
            echo "   ✅ chrome-sandbox SUID set"
          fi

          chmod +x "$DEB_ROOT/opt/tscode/tscode" 2>/dev/null || true
          chmod +x "$DEB_ROOT/opt/tscode/run.sh" 2>/dev/null || true
          chmod +x "$DEB_ROOT/opt/tscode/start-tscode.sh" 2>/dev/null || true
          chmod +x "$DEB_ROOT/opt/tscode/validate.sh" 2>/dev/null || true
          chmod +x "$DEB_ROOT/opt/tscode/test-debug.sh" 2>/dev/null || true

          echo ""
          echo "📌 Setting executable permissions for ALL extension binaries..."

          EXTENSIONS_DIR="$DEB_ROOT/opt/tscode/resources/app/extensions"

          if [ -d "$EXTENSIONS_DIR" ]; then
              echo "   🔧 Fixing bin/ scripts/ tools/ utils/ directories..."
              find "$EXTENSIONS_DIR" -type d \( -name "bin" -o -name "scripts" -o -name "tools" -o -name "utils" \) 2>/dev/null | while read -r dir; do
                  find "$dir" -type f -exec chmod +x {} \; 2>/dev/null || true
              done

              echo "   🔧 Fixing common executable files..."
              find "$EXTENSIONS_DIR" -type f \( \
                  -name "*.sh" -o -name "*.bash" -o -name "*.zsh" -o \
                  -name "*.py" -o -name "*.pl" -o -name "*.rb" -o \
                  -name "*.js" -o -name "*.mjs" -o -name "*.cjs" -o \
                  -name "testflow" -o -name "testagent" -o \
                  -name "rg" -o -name "grep" -o \
                  -name "server" -o -name "main" -o -name "run" -o \
                  -name "start" -o -name "bootstrap" -o -name "cli" -o \
                  -name "node" -o -name "npm" -o -name "npx" -o \
                  -name "*.node" \
              \) -exec chmod +x {} \; 2>/dev/null || true

              echo "   🔧 Fixing files without extensions (ELF/scripts)..."
              find "$EXTENSIONS_DIR" -type f ! -name "*.*" 2>/dev/null | while read -r file; do
                  if file "$file" 2>/dev/null | grep -qE "(ELF|script|executable)"; then
                      chmod +x "$file" 2>/dev/null || true
                  fi
              done

              echo "   ✅ All extension binaries permissions fixed"
          fi

          find "$DEB_ROOT/opt/tscode" -name "rg" -type f -exec chmod 755 {} \; 2>/dev/null || true
          find "$DEB_ROOT/opt/tscode" -type f -executable -exec chmod 755 {} \; 2>/dev/null || true

          echo "   ✅ All permissions fixed"

          echo ""
          echo "📌 Creating /usr/bin/tscode wrapper script..."

          cat > "$DEB_ROOT/usr/bin/tscode" << 'WRAPEOF'
          #!/bin/bash
          exec /opt/tscode/run.sh "$@"
          WRAPEOF

          chmod +x "$DEB_ROOT/usr/bin/tscode"
          echo "   ✅ /usr/bin/tscode wrapper created"

          echo ""
          echo "📌 Creating desktop file..."

          printf '%s\n' \
            '[Desktop Entry]' \
            'Version=1.0' \
            'Type=Application' \
            'Name=TSCode' \
            'GenericName=Code Editor' \
            'Comment=Code Editing. Redefined.' \
            'Exec=/opt/tscode/run.sh %F' \
            'Icon=tscode' \
            'Terminal=false' \
            'Categories=Development;IDE' \
            'MimeType=text/plain;inode/directory' \
            'StartupNotify=true' \
            'StartupWMClass=Code' > "$DEB_ROOT/usr/share/applications/tscode.desktop"

          echo "   ✅ Desktop file created"

          if [ -f "$BUILD_DIR/resources/app/resources/linux/code.png" ]; then
            cp "$BUILD_DIR/resources/app/resources/linux/code.png" \
               "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps/tscode.png"
            echo "   ✅ Icon copied"
          fi

          cat > "$DEB_ROOT/DEBIAN/control" << 'CONTROLEOF'
          Package: tscode
          Version: REPLACE_VERSION
          Architecture: REPLACE_ARCH
          Maintainer: TSCode Team <tscode@example.com>
          Description: TSCode - Code Editing. Redefined.
           TSCode is a code editor redefined and optimized for building
           and debugging modern web and cloud applications.
          Depends: libgtk-3-0, libx11-6, libxss1, libxtst6, libnss3, libasound2, libgbm1, libglib2.0-0, libcairo2, libpango-1.0-0, libatk1.0-0, libgdk-pixbuf2.0-0
          Recommends: git, python3
          Homepage: https://github.com/tscode
          Section: devel
          Priority: optional
          CONTROLEOF

          sed -i "s/REPLACE_VERSION/$DEB_VERSION/g" "$DEB_ROOT/DEBIAN/control"
          sed -i "s/REPLACE_ARCH/$DEB_ARCH/g" "$DEB_ROOT/DEBIAN/control"

          cat > "$DEB_ROOT/DEBIAN/postinst" << 'POSTINSTEOF'
          #!/bin/bash
          set -e

          echo "=========================================="
          echo "Setting up TSCode for Debian 10..."
          echo "=========================================="

          if [ -f "/opt/tscode/chrome-sandbox" ]; then
              chown root:root /opt/tscode/chrome-sandbox
              chmod 4755 /opt/tscode/chrome-sandbox
              echo "  ✅ chrome-sandbox permissions fixed"
          fi

          chmod +x /opt/tscode/run.sh 2>/dev/null || true
          chmod +x /opt/tscode/tscode 2>/dev/null || true
          chmod +x /opt/tscode/start-tscode.sh 2>/dev/null || true
          chmod +x /usr/bin/tscode 2>/dev/null || true
          chmod +x /opt/tscode/test-debug.sh 2>/dev/null || true

          if [ -f "/opt/tscode/resources/app/node_modules/@vscode/ripgrep/bin/rg" ]; then
              chmod 755 /opt/tscode/resources/app/node_modules/@vscode/ripgrep/bin/rg
              echo "  ✅ ripgrep permissions fixed"
          fi

          echo ""
          echo "📌 Setting executable permissions for ALL extension binaries..."

          EXTENSIONS_DIR="/opt/tscode/resources/app/extensions"

          if [ -d "$EXTENSIONS_DIR" ]; then
              echo "   🔧 Fixing bin/ scripts/ tools/ utils/ directories..."
              find "$EXTENSIONS_DIR" -type d \( -name "bin" -o -name "scripts" -o -name "tools" -o -name "utils" \) 2>/dev/null | while read -r dir; do
                  find "$dir" -type f -exec chmod +x {} \; 2>/dev/null || true
              done

              echo "   🔧 Fixing common executable files..."
              find "$EXTENSIONS_DIR" -type f \( \
                  -name "*.sh" -o -name "*.bash" -o -name "*.zsh" -o \
                  -name "*.py" -o -name "*.pl" -o -name "*.rb" -o \
                  -name "*.js" -o -name "*.mjs" -o -name "*.cjs" -o \
                  -name "testflow" -o -name "testagent" -o \
                  -name "rg" -o -name "grep" -o \
                  -name "server" -o -name "main" -o -name "run" -o \
                  -name "start" -o -name "bootstrap" -o -name "cli" -o \
                  -name "node" -o -name "npm" -o -name "npx" -o \
                  -name "*.node" \
              \) -exec chmod +x {} \; 2>/dev/null || true

              echo "   🔧 Fixing files without extensions (ELF/scripts)..."
              find "$EXTENSIONS_DIR" -type f ! -name "*.*" 2>/dev/null | while read -r file; do
                  if file "$file" 2>/dev/null | grep -qE "(ELF|script|executable)"; then
                      chmod +x "$file" 2>/dev/null || true
                  fi
              done

              echo "  ✅ All extension binaries permissions fixed"
          fi

          echo ""
          echo "🔧 Checking debug extensions..."
          DEBUG_EXTS=$(find "/opt/tscode/resources/app/extensions" -maxdepth 1 -type d -name "*debug*" 2>/dev/null)
          DEBUG_COUNT=$(echo "$DEBUG_EXTS" | grep -v "^$" | wc -l)
          if [ $DEBUG_COUNT -gt 0 ]; then
              echo "   ✅ Found $DEBUG_COUNT debug extension(s)"
          else
              echo "   ℹ️ No debug extensions found"
          fi

          echo ""
          echo "📁 Creating and fixing user directories..."

          for USER_HOME in /home/* /root; do
              if [ -d "$USER_HOME" ] && [ "$USER_HOME" != "/home/*" ]; then
                  USER_NAME=$(basename "$USER_HOME")
                  TSC_DIR="$USER_HOME/.tscode"
                  TSC_DATA_DIR="$USER_HOME/.local/share/tscode"

                  USER_UID=$(stat -c '%u' "$USER_HOME" 2>/dev/null || echo "")
                  USER_GID=$(stat -c '%g' "$USER_HOME" 2>/dev/null || echo "")

                  mkdir -p "$TSC_DIR/extensions"
                  mkdir -p "$TSC_DATA_DIR"

                  if [ -n "$USER_UID" ] && [ -n "$USER_GID" ]; then
                      chown -R "$USER_UID:$USER_GID" "$TSC_DIR" 2>/dev/null || true
                      chown -R "$USER_UID:$USER_GID" "$TSC_DATA_DIR" 2>/dev/null || true
                  fi

                  chmod 755 "$TSC_DIR"
                  chmod 755 "$TSC_DIR/extensions"
                  chmod 755 "$TSC_DATA_DIR"

                  if [ "$USER_HOME" != "/root" ]; then
                      echo "    ✅ Created directories for: $USER_NAME ($USER_UID:$USER_GID)"
                  else
                      echo "    ✅ Created directories for root"
                  fi
              fi
          done

          echo ""
          echo "🧹 Cleaning up stale prebuilt extension copies from user directories..."
          echo "   (Prebuilt extensions are bundled under /opt/tscode and removed with the package;"
          echo "    ~/.tscode/extensions only holds user-installed extensions)"
          EXTENSIONS_DIR="/opt/tscode/resources/app/extensions"
          if [ -d "$EXTENSIONS_DIR" ]; then
              find "$EXTENSIONS_DIR" -maxdepth 1 -type d -name "test-tech.*" 2>/dev/null | while read -r ext_dir; do
                  ext_name=$(basename "$ext_dir")
                  echo "    📦 Bundled system extension: $ext_name"
                  for USER_HOME in /home/* /root; do
                      if [ -d "$USER_HOME" ] && [ "$USER_HOME" != "/home/*" ]; then
                          USER_NAME=$(basename "$USER_HOME")
                          TSC_EXT_DIR="$USER_HOME/.tscode/extensions"
                          if [ -d "$TSC_EXT_DIR/$ext_name" ]; then
                              echo "      🗑️ Removing stale copy for $USER_NAME: $ext_name"
                              rm -rf "$TSC_EXT_DIR/$ext_name" 2>/dev/null || true
                          fi
                      fi
                  done
              done
          fi

          echo ""
          echo "🧹 Cleaning up user directories..."

          for USER_HOME in /home/* /root; do
              if [ -d "$USER_HOME" ] && [ "$USER_HOME" != "/home/*" ]; then
                  USER_NAME=$(basename "$USER_HOME")
                  TSC_DIR="$USER_HOME/.tscode"

                  if [ -d "$TSC_DIR" ]; then
                      USER_UID=$(stat -c '%u' "$USER_HOME" 2>/dev/null || echo "")
                      USER_GID=$(stat -c '%g' "$USER_HOME" 2>/dev/null || echo "")

                      for item in "$TSC_DIR"/*; do
                          if [ -e "$item" ]; then
                              item_name=$(basename "$item")
                              if [ "$item_name" != "extensions" ]; then
                                  echo "    🗑️ Removing: $item_name"
                                  rm -rf "$item" 2>/dev/null || true
                              fi
                          fi
                      done

                      mkdir -p "$TSC_DIR/extensions"
                      if [ -n "$USER_UID" ] && [ -n "$USER_GID" ]; then
                          chown -R "$USER_UID:$USER_GID" "$TSC_DIR" 2>/dev/null || true
                      fi
                      chmod 755 "$TSC_DIR"
                      chmod 755 "$TSC_DIR/extensions"

                      echo "    ✅ Cleaned: $TSC_DIR (permissions fixed)"
                  else
                      echo "    📁 Creating: $TSC_DIR"
                      mkdir -p "$TSC_DIR/extensions"
                      if [ "$USER_HOME" != "/root" ]; then
                          USER_UID=$(stat -c '%u' "$USER_HOME" 2>/dev/null || echo "")
                          USER_GID=$(stat -c '%g' "$USER_HOME" 2>/dev/null || echo "")
                          if [ -n "$USER_UID" ] && [ -n "$USER_GID" ]; then
                              chown -R "$USER_UID:$USER_GID" "$TSC_DIR" 2>/dev/null || true
                          fi
                      fi
                      chmod 755 "$TSC_DIR"
                      chmod 755 "$TSC_DIR/extensions"
                  fi
              fi
          done

          REAL_USER="${SUDO_USER:-$USER}"
          if [ -n "$REAL_USER" ] && [ "$REAL_USER" != "root" ]; then
              REAL_HOME=$(getent passwd "$REAL_USER" 2>/dev/null | cut -d: -f6)
              if [ -n "$REAL_HOME" ]; then
                  mkdir -p "$REAL_HOME/.local/share/keyrings" 2>/dev/null || true
                  echo "[keyring]" > "$REAL_HOME/.local/share/keyrings/login.keyring" 2>/dev/null || true
                  echo "display-name=Login" >> "$REAL_HOME/.local/share/keyrings/login.keyring" 2>/dev/null || true
                  echo "locked=false" >> "$REAL_HOME/.local/share/keyrings/login.keyring" 2>/dev/null || true
                  chown -R "$REAL_USER:$REAL_USER" "$REAL_HOME/.local/share/keyrings" 2>/dev/null || true
                  echo "  ✅ Keyring pre-configured for $REAL_USER"
              fi
          fi

          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database /usr/share/applications/
              echo "  ✅ Desktop database updated"
          fi

          if command -v update-icon-caches >/dev/null 2>&1; then
              update-icon-caches /usr/share/icons/hicolor/
              echo "  ✅ Icon cache updated"
          fi

          echo ""
          echo "=========================================="
          echo "✅ TSCode installed successfully!"
          echo ""
          echo "🔑 Using file-based secret storage (no keyring required)"
          echo "📁 System extensions: /opt/tscode/resources/app/extensions/"
          echo "📂 User extensions: ~/.tscode/extensions/"
          echo "📂 User data: ~/.local/share/tscode/"
          echo ""
          echo "🐛 Extension development:"
          echo "   - Debug type 'extensionHost' should work"
          echo "   - Run '/opt/tscode/test-debug.sh' to verify"
          echo ""
          echo "🚀 Run 'tscode' to start"
          echo "=========================================="

          exit 0
          POSTINSTEOF

          chmod +x "$DEB_ROOT/DEBIAN/postinst"

          cat > "$DEB_ROOT/DEBIAN/prerm" << 'PRERMEOF'
          #!/bin/bash
          set -e
          echo "=========================================="
          echo "TSCode is being removed..."
          echo "=========================================="
          echo ""
          echo "📁 User data preserved at: ~/.local/share/tscode/"
          echo "📦 User-installed extensions preserved at: ~/.tscode/extensions/"
          echo ""
          echo "To completely remove user data:"
          echo "  rm -rf ~/.tscode"
          echo "  rm -rf ~/.local/share/tscode"
          echo "=========================================="
          exit 0
          PRERMEOF

          chmod +x "$DEB_ROOT/DEBIAN/prerm"

          echo ""
          echo "📌 Building DEB package..."
          fakeroot dpkg-deb -Zgzip -z9 --build "$DEB_ROOT" "tscode-${DEB_VERSION}_${DEB_ARCH}.deb"

          if [ $? -eq 0 ] && [ -f "tscode-${DEB_VERSION}_${DEB_ARCH}.deb" ]; then
            echo ""
            echo "✅ DEB package built successfully!"
            ls -lh "tscode-${DEB_VERSION}_${DEB_ARCH}.deb"
            sha256sum "tscode-${DEB_VERSION}_${DEB_ARCH}.deb" > "tscode-${DEB_VERSION}_${DEB_ARCH}.deb.sha256"
          else
            echo "❌ Failed to build DEB package"
            exit 1
          fi

      - name: 🔍 Verify DEB package extensions
        if: steps.find-artifact.outputs.run-id != ''
        run: |
          echo "=========================================="
          echo "🔍 Verifying DEB package extensions"
          echo "=========================================="

          VERSION="${VERSION:-1.116.0}"
          DEB_VERSION="${VERSION}-1"
          DEB_ARCH="amd64"
          DEB_FILE="tscode-${DEB_VERSION}_${DEB_ARCH}.deb"

          if [ ! -f "$DEB_FILE" ]; then
            echo "❌ DEB package not found: $DEB_FILE"
            exit 1
          fi

          echo "📦 Extracting DEB package for verification..."
          mkdir -p /tmp/deb-verify
          cd /tmp/deb-verify
          ar x "$GITHUB_WORKSPACE/$DEB_FILE"

          if [ -f "data.tar.xz" ]; then
            tar -xf data.tar.xz
          elif [ -f "data.tar.gz" ]; then
            tar -xf data.tar.gz
          elif [ -f "data.tar" ]; then
            tar -xf data.tar
          else
            echo "❌ No data archive found in DEB package!"
            ls -la
            exit 1
          fi

          echo ""
          echo "📂 Checking extensions in DEB package..."
          echo "=========================================="

          EXT_DIR="./opt/tscode/resources/app/extensions"

          if [ ! -d "$EXT_DIR" ]; then
            echo "❌ Extensions directory not found in DEB package!"
            exit 1
          fi

          echo ""
          echo "📋 Extensions in DEB package:"
          echo "----------------------------------------"
          EXT_COUNT=$(find "$EXT_DIR" -maxdepth 1 -type d ! -path "$EXT_DIR" 2>/dev/null | wc -l | tr -d ' ')
          find "$EXT_DIR" -maxdepth 1 -type d ! -path "$EXT_DIR" -exec basename {} \; 2>/dev/null | sort
          echo "----------------------------------------"
          echo "   Total extensions: $EXT_COUNT"
          echo ""

          echo ""
          echo "🔍 Checking critical extensions in DEB:"
          CRITICAL_EXTS="typescript-language-features git json-language-features markdown-language-features html-language-features css-language-features npm debug-auto-launch merge-conflict"
          CRITICAL_MISSING=""

          for ext in $CRITICAL_EXTS; do
            if [ -d "$EXT_DIR/$ext" ]; then
              echo "   ✅ $ext"
            else
              echo "   ❌ $ext (CRITICAL - MISSING!)"
              CRITICAL_MISSING="$CRITICAL_MISSING $ext"
            fi
          done

          if [ -n "$CRITICAL_MISSING" ]; then
            echo ""
            echo "❌❌❌ CRITICAL ERROR: Missing critical extensions:$CRITICAL_MISSING"
            exit 1
          fi

          echo ""
          echo "🔍 Checking test-tech extensions in DEB:"
          TEST_TECH_EXTS=$(find "$EXT_DIR" -maxdepth 1 -type d -name "test-tech.*" 2>/dev/null)
          if [ -n "$TEST_TECH_EXTS" ]; then
            for ext in $TEST_TECH_EXTS; do
              ext_name=$(basename "$ext")
              echo "   ✅ $ext_name"
              if [ -f "$ext/bin/testflow" ]; then
                PERMS=$(stat -c %a "$ext/bin/testflow" 2>/dev/null || echo "unknown")
                echo "      📄 testflow permissions: $PERMS"
              fi
            done
          else
            echo "   ℹ️ No test-tech extensions found"
          fi

          echo ""
          echo "🔍 Checking debug extensions in DEB:"
          DEBUG_EXTS=$(find "./opt/tscode/resources/app/extensions" -maxdepth 1 -type d -name "*debug*" 2>/dev/null)
          DEBUG_COUNT=$(echo "$DEBUG_EXTS" | grep -v "^$" | wc -l)
          if [ $DEBUG_COUNT -gt 0 ]; then
            echo "   ✅ Found $DEBUG_COUNT debug extension(s)"
          else
            echo "   ℹ️ No debug extensions found"
          fi

          echo ""
          echo "=========================================="
          echo "📊 DEB EXTENSION VERIFICATION SUMMARY"
          echo "=========================================="
          echo "   Total extensions: $EXT_COUNT"
          echo "   ✅ Critical extensions: All present"
          echo "   Debug extensions: $([ $DEBUG_COUNT -gt 0 ] && echo '✅ Found' || echo 'ℹ️ Not found')"
          echo "   Result: PASSED"
          echo "=========================================="

          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/deb-verify

          echo ""
          echo "✅ DEB package extension verification completed!"

      - name: 📤 Upload artifacts
        if: steps.find-artifact.outputs.run-id != ''
        uses: actions/upload-artifact@v7
        with:
          name: tscode-debian10-deb
          path: |
            *.deb
            *.deb.sha256
          retention-days: 30

      - name: 📊 Build summary
        if: always()
        run: |
          if [ "${{ steps.find-artifact.outputs.skipped }}" = "true" ]; then
            echo "=========================================="
            echo "📊 BUILD SUMMARY"
            echo "=========================================="
            echo "Status: ${{ job.status }} (skipped)"
            echo "Reason: triggering release.yml run had no 'vscode-linux-x64' artifact"
            echo "  - Only main-branch, successful, linux-including release builds are auto-packaged"
            echo "  - Run this workflow manually with a linux release build to package"
            echo "=========================================="
            exit 0
          fi
          echo "=========================================="
          echo "📊 BUILD SUMMARY"
          echo "=========================================="
          echo "Status: ${{ job.status }}"
          echo "Version: ${VERSION:-1.116.0}"
          echo "Format: DEB (Debian 10)"
          echo ""
          echo "✅ Features:"
          echo "   - No password required on startup"
          echo "   - No sandbox password prompt"
          echo "   - Desktop entry in application menu"
          echo "   - /usr/bin/tscode is a wrapper script (not a symlink)"
          echo "   - ✅ ALL extension binaries have execute permissions"
          echo "   - ✅ test-tech.* extensions bundled in /opt/tscode (removed on uninstall)"
          echo "   - ✅ User directory permissions fixed"
          echo "   - ✅ File-based secret storage (no keyring required)"
          echo "   - ✅ GitHub login works without keyring"
          echo "   - ✅ Debug extensions included (extensionHost works)"
          echo "   - ✅ test-debug.sh available for verification"
          echo ""
          echo "📂 Directory structure:"
          echo "   System extensions: /opt/tscode/resources/app/extensions/"
          echo "   User extensions:   ~/.tscode/extensions/"
          echo "   User data:         ~/.local/share/tscode/"
          echo ""
          echo "💡 User-installed extensions persist across reinstallation"
          echo "💡 Prebuilt extensions follow package removal (no copies in user dir)"
          echo "💡 ~/.tscode/ only contains extensions directory"
          echo "==========================================="

          if [ "${{ job.status }}" = "success" ]; then
            echo ""
            echo "✅ Build completed successfully!"
            echo ""
            echo "📦 DEB Package:"
            ls -lh *.deb 2>/dev/null || echo "   No DEB package found"
            echo ""
            echo "📖 Installation:"
            echo "  sudo dpkg -i tscode-*.deb"
            echo "  sudo apt-get install -f"
            echo ""
            echo "🚀 After installation:"
            echo "  - Run: tscode (no password)"
            echo "  - Find in application menu: TSCode"
            echo "  - GitHub login works without keyring password prompt"
            echo "  - Extension development: debug type 'extensionHost' works"
            echo "  - Run '/opt/tscode/test-debug.sh' to verify debug functionality"
            echo ""
            echo "📂 Directory structure:"
            echo "  System extensions: /opt/tscode/resources/app/extensions/"
            echo "  User extensions:   ~/.tscode/extensions/"
            echo "  User data:         ~/.local/share/tscode/"
            echo "=========================================="
          fi
