# test-workbench_change - new file
# Logstash 原始数据配置 - TSCode 遥测数据收集
# =============================================================================
# logstash.conf —— 同时处理 NDJSON + JSON数组，不丢数据
# =============================================================================

input {
  http {
    port => 8080
    codec => plain
    additional_codecs => {
      "application/json"          => "plain"
      "application/x-json-stream" => "plain"
      "text/plain"                => "plain"
    }
    type => "tscode_telemetry_http"
    response_headers => {
      "Content-Type" => "application/json"
      "Access-Control-Allow-Origin" => "*"
      "Access-Control-Allow-Methods" => "POST, GET, OPTIONS"
      "Access-Control-Allow-Headers" => "Content-Type"
    }
    threads => 4
    max_pending_requests => 1000
    max_content_length => 10485760
  }

  http {
    port => 8081
    type => "health_check"
    codec => plain
    threads => 1
  }
}

filter {
  # ---------- 健康检查 ----------
  if [type] == "health_check" {
    drop {}
  }

  if [type] == "tscode_telemetry_http" {

    # ============================================================
    # 唯一入口：把任何形态的请求体 → 逐条 Hash 放进 _items 数组
    # ============================================================
    ruby {
      code => '
        require "json"

        raw = event.get("message").to_s.strip
        return if raw.empty?

        items = []

        # --- 情况A：裸 JSON 数组 [{...},{...}] ---
        if raw.start_with?("[")
          begin
            parsed = JSON.parse(raw)
            if parsed.is_a?(Array)
              parsed.each { |p| items << p if p.is_a?(Hash) }
            elsif parsed.is_a?(Hash)
              items << parsed
            end
          rescue => e
            # parse 失败：整坨当原文留底
            items << { "raw_line" => raw, "_parse_error" => e.message }
          end

        # --- 情况B：NDJSON 多行（1DS 常见，也可能单行单条） ---
        else
          raw.split(/\r?\n/).each do |line|
            line = line.strip
            next if line.empty?
            begin
              parsed = JSON.parse(line)
              if parsed.is_a?(Hash)
                items << parsed
              elsif parsed.is_a?(Array)
                # 防御：行内居然还有数组（极少见）
                parsed.each { |p| items << p if p.is_a?(Hash) }
              end
            rescue => e
              items << { "raw_line" => line, "_parse_error" => e.message }
            end
          end
        end

        # 兜底：啥也没解析出来不能让事件变空
        if items.empty?
          items << { "raw_line" => raw }
        end

        event.set("_items", items)
      '
    }

    # ============================================================
    # 统一拆分：不管 1 条还是 N 条，都走这一条路
    # ============================================================
    split {
      field => "_items"
    }

    # ============================================================
    # 把拆出来的单条 Hash 铺到事件根级
    # ============================================================
    ruby {
      code => '
        item = event.get("_items")
        if item.is_a?(Hash)
          item.each do |k, v|
            # 避开把 _items 自己再铺一遍
            next if k == "_items"
            # 业务字段 tags 跟 Logstash tags 冲突 → 改名
            if k == "tags" && v.is_a?(Hash)
              event.set("ai_tags", v)
            else
              event.set(k, v)
            end
          end
        end
        event.remove("_items")
      '
    }

    # ============================================================
    # 清 Logstash 原生 tags（之前 input 打的 "telemetry" 那些）
    # 注意：这里只清数组型 tags，不动 ai_tags
    # ============================================================
    mutate {
      remove_field => [
        "message", "http", "headers", "host", "url",
        "user_agent", "event", "@version", "tags"
      ]
    }

    # ============================================================
    # 标记 schema 类型（方便 Kibana 里区分 1ds / 2ds）
    # ============================================================
    ruby {
      code => '
        if event.get("ext") || (event.get("data").is_a?(Hash) && event.get("data")["properties"])
          event.set("[@metadata][schema]", "1ds")
        elsif event.get("data").is_a?(Hash) && event.get("data")["baseData"]
          event.set("[@metadata][schema]", "2ds")
        else
          event.set("[@metadata][schema]", "unknown")
        end
      '
    }
  }
}

output {
  if [type] == "tscode_telemetry_http" {

    # ---- capturedLog 分流（你原来的逻辑，保留）----
    if [data][baseData][name] == "monacoworkbench/capturedLog" {
      elasticsearch {
        hosts => ["${ES_HOSTS}"]
        user => "${ES_USER}"
        password => "${ES_PASSWORD}"
        manage_template => false
        index => "tscode-captured-log-%{+YYYY.MM.dd}"
      }
    }
    # ---- 其余走 raw ----
    else {
      elasticsearch {
        hosts => ["${ES_HOSTS}"]
        user => "${ES_USER}"
        password => "${ES_PASSWORD}"
        manage_template => false
        index => "tscode-telemetry-raw-%{+YYYY.MM.dd}"
      }
    }
  }
}
