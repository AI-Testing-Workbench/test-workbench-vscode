<svg viewBox="-32 -24 88 72" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#2979ff"/>
      <stop offset="100%" stop-color="#69f0ae"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8f4ff"/>
      <stop offset="0.5" stop-color="#d4e9ff"/>
      <stop offset="1" stop-color="#b8deff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes eye-shift {
        0%   { transform: translateX(-2.3px); }
        30%  { transform: translateX(-2.3px); }
        50%  { transform: translateX(2.3px); }
        80%  { transform: translateX(2.3px); }
        100% { transform: translateX(-2.3px); }
      }
      @keyframes ring-pulse {
        0%, 100% { r: 10.75; opacity: 0.6; stroke-width: 1.5; }
        50%       { r: 11.15; opacity: 1;   stroke-width: 1.5; }
      }
      @keyframes ring-pulse-bg {
        0%, 100% { r: 10.75; opacity: 0.2; stroke-width: 3; }
        50%       { r: 11.5; opacity: 0.5; stroke-width: 3; }
      }
      .thinking-eye  { animation: eye-shift 2.0s ease-in-out infinite; }
      .glow-ring     { animation: ring-pulse 2.0s ease-in-out infinite; filter: url(#glow); }
      .glow-ring-bg  { animation: ring-pulse-bg 2.0s ease-in-out infinite; }
    </style>
  </defs>

  <circle cx="12" cy="12" r="10" fill="url(#bodyGrad)"/>
  <circle cx="12" cy="12" r="10.75" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <circle class="glow-ring-bg" cx="12" cy="12" r="10.75" fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.2"/>
  <circle class="glow-ring" cx="12" cy="12" r="10.75" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <g class="thinking-eye">
    <!-- Eyes (Cloudling base geometry) -->
    <ellipse cx="8.92" cy="9.95" rx="1.38" ry="2.15" fill="#2979ff"/>
    <ellipse cx="15.08" cy="9.95" rx="1.38" ry="2.15" fill="#2979ff"/>
  </g>
</svg>
