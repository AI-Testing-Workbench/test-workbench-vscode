<svg viewBox="-32 -24 88 72" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#2979ff"/>
      <stop offset="100%" stop-color="#69f0ae"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8f4ff"/>
      <stop offset="0.5" stop-color="#d4e9ff"/>
      <stop offset="1" stop-color="#b8deff"/>
    </linearGradient>
    <style>
      @keyframes drag-wobble {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-3deg); }
        75% { transform: rotate(3deg); }
      }
      .dragging-body { animation: drag-wobble 0.3s ease-in-out infinite; transform-origin: 12px 12px; }
    </style>
  </defs>

  <g class="dragging-body">
    <circle cx="12" cy="12" r="10" fill="url(#bodyGrad)"/>
    <circle cx="12" cy="12" r="10.75" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
    <!-- Effort eyes: > < (left points right, right points left) -->
    <path d="M7.54 8.27 L10.30 9.95 L7.54 11.63" fill="none" stroke="#2979ff" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16.46 8.27 L13.70 9.95 L16.46 11.63" fill="none" stroke="#2979ff" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
