<svg viewBox="-15 -25 45 45" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#2979ff"/>
      <stop offset="100%" stop-color="#69f0ae"/>
    </linearGradient>
    <style>
      @keyframes surprised-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes eye-highlight {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .surprised-face { animation: surprised-pulse 0.6s ease-in-out 2; transform-origin: 7.5px 8px; }
      .eye-highlight { animation: eye-highlight 0.6s ease-in-out infinite; }
    </style>
  </defs>
  
  <g class="surprised-face">
    <circle cx="7.5" cy="8" r="3.9" fill="#e8f4ff"/>
    <circle cx="7.5" cy="8" r="4.05" fill="none" stroke="url(#borderGrad)" stroke-width="0.6"/>
    <!-- Big surprised eyes -->
    <circle cx="6.3" cy="7.3" r="0.84" fill="#2979ff"/>
    <circle cx="8.7" cy="7.3" r="0.84" fill="#2979ff"/>
    <!-- Eye highlights -->
    <circle class="eye-highlight" cx="6.57" cy="7.05" r="0.27" fill="rgba(255,255,255,0.7)"/>
    <circle class="eye-highlight" cx="8.37" cy="7.05" r="0.27" fill="rgba(255,255,255,0.7)"/>
  </g>
</svg>
