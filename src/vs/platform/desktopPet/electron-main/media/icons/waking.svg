<svg viewBox="-15 -25 45 45" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#2979ff"/>
      <stop offset="100%" stop-color="#69f0ae"/>
    </linearGradient>
    <style>
      @keyframes wake-up {
        0% { transform: scale(0.95) rotate(-5deg); }
        50% { transform: scale(1.05) rotate(5deg); }
        100% { transform: scale(1) rotate(0deg); }
      }
      @keyframes eye-open {
        0% { ry: 0.09; }
        100% { ry: 0.84; }
      }
      .waking-body { animation: wake-up 0.8s ease-out 1 forwards; transform-origin: 7.5px 8px; }
      .waking-eye { animation: eye-open 0.8s ease-out 1 forwards; }
    </style>
  </defs>
  
  <g class="waking-body">
    <circle cx="7.5" cy="8" r="3.9" fill="#e8f4ff"/>
    <circle cx="7.5" cy="8" r="4.05" fill="none" stroke="url(#borderGrad)" stroke-width="0.6"/>
    <ellipse class="waking-eye" cx="6.3" cy="7.2" rx="0.54" ry="0.09" fill="#2979ff"/>
    <ellipse class="waking-eye" cx="8.7" cy="7.2" rx="0.54" ry="0.09" fill="#2979ff"/>
  </g>
</svg>
