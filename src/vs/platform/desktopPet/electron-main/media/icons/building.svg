<svg viewBox="-15 -25 45 45" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#2979ff"/>
      <stop offset="100%" stop-color="#69f0ae"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#2979ff"/>
    </linearGradient>
    <style>
      @keyframes hat-tip {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-5deg); }
      }
      .wizard-hat { animation: hat-tip 2s ease-in-out infinite; transform-origin: 7.5px 5px; }
    </style>
  </defs>
  
  <circle cx="7.5" cy="8" r="3.9" fill="#e8f4ff"/>
  <circle cx="7.5" cy="8" r="4.05" fill="none" stroke="url(#borderGrad)" stroke-width="0.6"/>
  
  <!-- Wizard hat (scaled to 30%) -->
  <g class="wizard-hat">
    <ellipse cx="7.5" cy="5" rx="3.3" ry="0.75" fill="#1565c0"/>
    <ellipse cx="7.5" cy="4.85" rx="3.3" ry="0.75" fill="#2979ff" opacity="0.6"/>
    <rect x="6.3" y="0.8" width="3.3" height="4.2" fill="url(#hatGrad)" rx="0.3"/>
    <ellipse cx="7.5" cy="0.8" rx="1.65" ry="0.48" fill="#2979ff"/>
    <rect x="6.3" y="3.8" width="3.3" height="0.6" fill="#4fc3f7" opacity="0.8"/>
  </g>
  
  <!-- Happy eyes -->
  <path d="M6.3 7.7 Q6.6 7.1 6.9 7.7" stroke="#2979ff" stroke-width="0.54" fill="none" stroke-linecap="round"/>
  <path d="M8.1 7.7 Q8.4 7.1 8.7 7.7" stroke="#2979ff" stroke-width="0.54" fill="none" stroke-linecap="round"/>
</svg>
