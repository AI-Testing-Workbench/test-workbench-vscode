<svg viewBox="-15 -25 45 45" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#2979ff"/>
      <stop offset="100%" stop-color="#69f0ae"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
    <style>
      @keyframes spin-happy {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.1); }
        100% { transform: rotate(360deg) scale(1); }
      }
      @keyframes heart-float {
        0%   { transform: translate(0, 0) scale(0.8); opacity: 0; }
        20%  { opacity: 1; }
        100% { transform: translate(0.6px, -4.5px) scale(1.1); opacity: 0; }
      }
      .spinning-face { animation: spin-happy 1.2s ease-in-out 1; transform-origin: 7.5px 8px; }
      .love-heart { animation: heart-float 2s ease-out infinite; transform-origin: 11px 6px; }
    </style>
  </defs>
  
  <g class="spinning-face">
    <circle cx="7.5" cy="8" r="3.9" fill="#e8f4ff"/>
    <circle cx="7.5" cy="8" r="4.05" fill="none" stroke="url(#borderGrad)" stroke-width="0.6"/>
    <!-- Happy curved eyes -->
    <path d="M5.85 7.65 Q6.3 6.75 6.75 7.65" stroke="#2979ff" stroke-width="0.42" fill="none" stroke-linecap="round"/>
    <path d="M8.25 7.65 Q8.7 6.75 9.15 7.65" stroke="#2979ff" stroke-width="0.42" fill="none" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="6.0" cy="8.4" rx="0.66" ry="0.36" fill="rgba(255,107,157,0.4)"/>
    <ellipse cx="9.0" cy="8.4" rx="0.66" ry="0.36" fill="rgba(255,107,157,0.4)"/>
  </g>
  
  <!-- Floating heart (scaled to 30%) -->
  <g class="love-heart">
    <path d="M11 6 Q11 5.1 11.45 5.1 Q11.9 5.1 11.9 6 Q11.9 6.9 11 7.5 Q10.1 6.9 10.1 6 Q10.1 5.1 10.55 5.1 Q11 5.1 11 6 Z" 
          fill="url(#heartGrad)"/>
  </g>
</svg>
